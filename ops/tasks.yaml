        and 5,397 primary ETF portfolios. The earlier 478 number was LSEG
        Lipper's Q1 2026 count and is documented only as superseded evidence.
        Current code still has 345 named adapter keys, leaving a 151-promoter
        named-identity reconciliation gap before those providers can be added
        without inventing names. Also removed the remaining generated
        recognition-only fallback adapter path: every registered provider must
