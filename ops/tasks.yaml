tasks:
  - id: etf-holdings-constituents
    title: Implement native ETF holdings integrations for all registered issuers
    status: in_progress
    priority: high
    scope: >
      Replace generated/thin ETF provider adapters with per-provider native holdings
      integrations for all 345 registered issuers. SEC EDGAR remains fallback-only and
      does not count as native provider support. Prioritize issuers with larger ETF
      lineups, higher AUM, and broader US-market constituent coverage.
    definition_of_done:
      - Every registered issuer has an isolated provider-specific holdings implementation
      - Every provider has static and opt-in live coverage for a concrete issuer route
      - The live test suite programmatically asserts that every native/live-backed provider has a concrete issuer-route test
      - SEC EDGAR is only a fallback path
      - Handoff and validation evidence are current
    validation:
      - backend-unit
      - provider-live-tests
      - adapter-matrix
      - lint
    notes:
      - Current truthful count: 237 native/live-backed providers out of 345; 108 remain.
        Tidal is supported through an isolated, strictly bounded adapter for IINC's
        verified sponsor-published daily holdings CSV. The adapter first confirms the
        public sponsor page identity, rejects arbitrary URLs and unrelated tickers,
        filters the CSV by its exact Account field, and preserves cash as non-tradable.
        Its narrowly scoped requests transport fallback exists only because the
        sponsor's WordPress edge rejects equivalent httpx requests with HTTP 403; both
        static parser and opt-in live-route coverage are in place for IINC.
        Kensington Asset Management is supported through an isolated adapter for its
        verified KAMO and KHPI ETF range. It verifies each fund through Kensington's
        public WordPress identity API, filters the issuer's combined daily CSV by
        Account, and preserves non-tradable cash and option positions without
        inventing instrument tickers. Its browser-compatible requests transport is
        scoped solely to the public Cloudflare-protected CSV and has static plus
        opt-in live coverage for KAMO.
        Man Group is supported through a dedicated adapter for the documented `BUYO`
        partnership, using KraneShares' complete daily holdings CSV. It is constrained
        to that product relationship and has static plus opt-in live coverage.
      - Cboe/Vest is supported through a dedicated adapter for the verified `BUFG`
        sub-advised fund. It uses the legal First Trust issuer's complete holdings table,
        accepts no arbitrary publisher URL or unrelated Cboe-listed product, and has
        static plus opt-in live route coverage.
      - CICC is supported through a dedicated adapter for its verified controlling
        relationship to KraneShares' `KWEB` route. It owns the dated CSV lookup,
        rejects arbitrary URLs and unrelated products, records KraneShares as the
        publisher, and has static plus opt-in live route coverage.
      - Amun is supported through a dedicated, bounded adapter for its verified U.S.
        21Shares subsidiary ETF range (`ARKB`, `TETH`, `TOXR`, and `TSOL`). It owns
        its publisher API retrieval, rejects unverified symbols and arbitrary source
        URLs, and has static plus opt-in live route coverage for `ARKB`.
        Redwood is supported through its verified LeaderShares `LSAF`, `LSAT`, and
        `DYLD` issuer-owned full-holdings CSVs. The adapter validates the exact fund
        title, as-of date, and disclosed schema before preserving identifiers, values,
        weights, and non-tradable cash or fixed-income semantics.
        Osprey is supported through its verified public OSOL, OBNB, ODOT, and OBNK
        trust pages. The adapter derives each issuer-disclosed daily single-asset holding
        from units per share and outstanding shares while preserving AUM/as-of metadata;
        it does not claim a multi-security ETF portfolio where none exists.
        Raymond James is supported through its issuer-owned FilePoint portal's complete,
        fund-specific quarterly Schedule of Investments PDFs for RJDI, RJMI, and RJVI;
        the adapter validates fund identity/as-of date and preserves equity, bond, and
        cash semantics. Its periodic issuer disclosure cadence is explicit metadata,
        not a claim of daily coverage.
        Affiliated Managers Group is supported through AMG's complete public MUNX
        municipal-bond holdings table, with issuer-local transport handling plus
        static and opt-in live route coverage.
        SoFi remains fallback-only after a 2026-07-16 retry: its ETF product pages,
        sitemap, and publicly declared wealth API namespace all return the same WAF
        `403` document to normal browser-equivalent backend requests.
        Thrivent remains fallback-only after direct retries against both public ETF
        hostnames and its advertised holdings paths; each returned `403` before a
        complete issuer-native holdings artifact could be inspected.
        A 2026-07-20 repeat confirmed Thrivent's own ETF page links to a fund-scoped
        `daily-holdings-tscv.csv` asset, but both that asset and representative product
        pages return the same Imperva/CloudFront HTTP 403 response to browser-header
        backend requests. WisdomTree's documented DataSpan fund-data endpoints require
        an unavailable API key and its public US holdings surfaces remain Cloudflare
        gated; SoFi's indexed pages provide only top-ten holdings and its complete
        issuer routes remain WAF blocked. All three remain fallback-only and uncounted.
        Guinness Atkinson's issuer resource catalogue currently returns `403` to backend
        requests despite advertising ETF holdings documents, while Man Group's disclosed
        direct all-holdings download endpoint currently returns `500`; neither is counted
        as native support pending an executable issuer route.
        Baird is supported through its Strategas current-holdings CSVs for SAMM, SAMT,
        and SAGP, with both static and opt-in live route coverage.
        Praxis is supported through its verified issuer-publisher daily CSVs for PRXG,
        PRXV, and PRXI, with both static and opt-in live route coverage.
      - >
        Brookfield Asset Management's registered US ETF identity is supported through a
        dedicated, deliberately constrained adapter for TRBF. Angel Oak is TRBF's legal
        issuer and publishes the complete account-scoped portfolio CSV; the adapter records
        Angel Oak as publisher and rejects every other symbol rather than treating its
        aggregate file as a Brookfield fallback.
      - >
        Wellington Management's three registered US ETF identities are supported through a
        dedicated, deliberately constrained adapter for VUSV, VDIG, and VUSG. Vanguard is
        their legal issuer and publishes the complete fund-scoped portfolios; the adapter
        records that publisher relationship rather than inventing a Wellington endpoint.
      - >
        Weitz is supported through its issuer-owned WCPB and WMSB product pages,
        whose embedded `holdingsFileJson` payloads disclose complete current holdings.
        The dedicated adapter verifies the requested page ticker and fund name, enforces
        a single issuer as-of date, preserves CUSIP/shares/value/weight data, and has
        static plus opt-in live coverage for WCPB.
      - >
        Clough CGI is supported through the issuer-owned Clough Capital JSON
        holdings route for its real CBLS and CBSE ETF range. The adapter rejects
        unrelated symbols and has both static and live issuer-route coverage.
      - >
        Dividend Assets Capital is supported through DAC 3D Dividend Growth ETF
        (DVGR)'s issuer-owned complete holdings table. The adapter verifies the
        exact fund identity and schema, enforces one effective date across the
        disclosure, preserves CUSIP/shares/weights/value data, and uses an
        issuer-local requests transport fallback only for the publisher edge's
        documented httpx TLS-fingerprint rejection.
      - >
        Cyber Hornet is supported through its issuer-owned BBB, EEE, SSS, and XXX
        product pages and their explicitly declared full-holdings CSV exports. The
        adapter validates the fund-scoped download route and CSV schema, preserves
        CUSIP/shares/market value/weight data, and keeps direct crypto and cash rows
        non-tradable rather than inventing platform symbols.
      - >
        Golden Eagle is supported through HYP's official current portfolio table.
        The adapter verifies fund identity, the issuer's actual table schema, its
        reported as-of date, and the page-declared security count before storing
        holdings, including the non-tradable cash balance.
      - >
        Morgan Stanley is supported through its issuer-owned Pathway ETF product
        page and current, dated MSLC holdings workbook. The adapter verifies the
        fund title and workbook schema before preserving identifiers, weights,
        values, shares, currencies, and non-tradable rows.
      - >
        Russell Investments is supported through issuer-hosted month-end strategy
        workbooks for RUSC, RINT, RGLO, REMG, and RIFR. Its adapter validates the
        expected strategy title and Russell workbook schema before parsing holdings.
      - >
        Counted empty adapters for SPDR, YieldMax, and VanEck have now been
        replaced with isolated schema-specific parser implementations and live
        tests. Do not treat a provider as native/live-backed based solely on a
        generated adapter registration or SEC fallback.
      - >
        Global X's prior inherited generic discovery path has also been replaced
        with a fund-page-scoped native resolver and CSV parser. Its related
        Mirae Asset identity uses that same concrete issuer platform route.
      - >
        Liquid Strategies is supported through its official fund-scoped ETF pages and
        complete current holdings tables for OVL, OVS, OVF, OVLH, OVB, OVT, and OVM.
      - >
        Fortuna is supported through its official HBTC product page and its complete
        current fund-scoped holdings table.
      - >
        IronHorse is supported through Conductor ETFs' official CGV product page and its
        explicitly declared complete current holdings CSV.
      - >
        Indexperts is supported through its issuer-designated ETF Pages product workspace
        and the page-declared complete current holdings JSON for RILA, QIDX, and YFFI.
      - >
        Cygnet Capital is supported through the official Elm ELM product page and its
        explicitly declared complete current holdings CSV.
      - >
        LionShares is supported through its issuer-declared public TOT product page,
        application script, and complete account-scoped daily holdings CSV.
      - >
        Formidable is supported through its verified public FORH and KONG product pages,
        which expose complete current holdings tables scoped by ETF ticker.
      - >
        IDX Shares is supported through its verified public ETF catalogue and the complete
        current holdings tables on its DYFI and GLDB fund pages.
      - >
        Thornburg is supported through its verified ETF product pages and the dated,
        fund-scoped worksheet selected from its complete issuer-hosted holdings workbook.
      - >
        Goose Hollow Capital is supported through its own verified ETF application and
        its current complete GHTA holdings payload.
      - >
        Frontier Asset is supported through its own verified fund pages and dated daily
        fund-scoped holdings exports for FARX, FCBD, FGSM, FINT, FLCE, and FOPC.
      - >
        Intech is supported through its official ETF catalogue and current daily PDF holdings
        exports for LGDX and SMDX. The provider-specific adapter discovers the current dated
        fund PDF from the issuer page before parsing the selected fund's report.
      - >
        Current priority blockers: WisdomTree, SoFi, and Thrivent return bot-protection HTTP 403
        responses to browser-header backend requests. Thrivent and WisdomTree advertise current
        full/daily holdings, but their public routes are not executable from the backend. John
        Hancock's public multi-fund basket PDF also returns HTTP 403. PIMCO's public fund client
        exposes only a top-ten export and its direct API requires an unavailable authenticated role.
        Cultivar's public fund page and WordPress API currently reject backend requests (403/500),
        so it is fallback-only rather than falsely counted as live-backed.
        Do not promote any of them until a reachable complete issuer-native route passes a live
        test. Neuberger Berman is supported through its official sitemap and detailed-holdings
        workbook route. Water Island is supported through AltShares' complete periodic
        portfolio-of-investments report for ARB and EVNT; its periodic disclosure cadence is
        explicit metadata, not a claim of daily coverage. Canary Capital is supported through
        its issuer-owned current product-page table, filtered by the report's fund account.
        Optimize Financial is supported through OPTZ's issuer-verified full-holdings legacy XLS
        export. The shared legacy-XLS parser now recovers issuer workbooks with duplicated OLE
        stream references using xlrd's explicit corruption-tolerant mode. 3EDGE is supported
        through its own dated, fund-scoped daily holdings text export for EDGF/EDGU/EDGH/EDGI.
  - id: strategy-lab
    title: Expand Strategy Lab across the remaining roadmap gaps
    status: in_progress
    priority: high
    scope: >
      Continue extending Strategy Lab toward the documented roadmap: platform signal replay,
      broader universes, richer analytics, comparison/export tooling, deeper execution modeling,
      stronger paper-forward support, more realistic multi-symbol research behavior,
      and richer grouped rule authoring.
    definition_of_done:
      - Code changes completed for the selected Strategy Lab roadmap slice
      - Relevant backend/frontend tests passed
      - Handoff updated
    validation:
      - backend-unit
      - backend-integration
      - frontend-tests
      - type-check
      - e2e-when-routed-flows-are-affected
    notes:
      - Radar replay and screener-backed universes were added in the latest session.
      - Grouped rule-tree authoring, portfolio-control summaries, and refreshable paper-forward monitor snapshots were added in the current session.
      - Remaining largest gaps are broader condition families/validation, deeper comparison and robustness tooling, fuller portfolio realism, and broader asset/signal coverage.
