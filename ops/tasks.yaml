        explicit metadata, not a claim of daily coverage. Canary Capital is supported through
        its issuer-owned current product-page table, filtered by the report's fund account.
        Optimize Financial is supported through OPTZ's issuer-verified full-holdings legacy XLS
        export. The shared legacy-XLS parser now recovers issuer workbooks with duplicated OLE
        stream references using xlrd's explicit corruption-tolerant mode. 3EDGE is supported
        through its own dated, fund-scoped daily holdings text export for EDGF/EDGU/EDGH/EDGI.
