    failure_modes:
      - Missing holdings use explicitly labeled metadata fallback and never imply official index membership.
      - Missing industry proxies remain explicit and do not select unrelated ETFs.
      - Missing or misaligned bars exclude only misleading calculations and expose reasons.
      - Missing official index data uses an explicitly labelled tradable proxy and never renames it as the index.
      - Unsupported Python/data capabilities preserve code and block dependent execution with structured errors.
      - Sandbox limits or security violations terminate and clean up only the isolated run while preserving bounded diagnostics.
      - Provider failures retain cached data and expose freshness/retry state.
      - Changed or invalid provider entitlements disable only the affected capability and expose the reason.
      - Unknown workspace tools preserve raw state and open a recovery/export panel.
      - Concurrent snapshots use revisions, merge only disjoint window changes, and create recovery copies otherwise.
      - Large lists remain virtualized and preserve selection by instrument ID.
      - Missing, stale, conflicting, or unapproved visual references block parity acceptance for only the affected surface and remain explicit in the manifest; they never fall back silently to an older generation.
      - Protected reference images remain outside distributable bundles, with reproducible manifest metadata and controlled-storage identifiers when repository storage is not permitted.
    definition_of_done:
      - New TC2000-style workstation is the default authenticated frontend.
      - All documented in-scope factory layouts, tools, linking, keyboard mechanics, dialogs, persistence, polling, and recovery behavior are implemented.
      - Complete SPY to RSP to sector to industry to constituent to stock/sector and stock/market analysis works without leaving the workspace.
      - Unified Python works across every programmable surface through the isolated reproducible worker and authoritative SDK.
      - Study Lab completes open-ended event/statistical research with structured native outputs and linked occurrence inspection.
      - No new-workstation path depends on yfinance, paid APIs, provider-specific frontend logic, or reliable consolidated real-time data.
      - Unsupported Python/data capabilities and excluded product domains have explicit stubs and extension documentation.
      - Current canonical user data remains usable and legacy routes remain directly accessible but hidden from the new interface.
      - No application is described as complete while temporary placeholders, known broken flows, unexplained visual mismatches, console errors, or backend errors remain.
      - Backend, frontend, sandbox, provider, integration, E2E, visual, performance, console, log, migration, and diff validation pass.
      - Handoff, state, run report, API, architecture, testing, parity, and capability-stub documentation are current.
      - Every board-represented required Version 25 state has a reviewed board-guided reference,
        measured local design tokens, and passing deterministic comparisons in all four display
        environments; uncovered or materially ambiguous states remain explicitly recorded in the
        visual manifest and reference-board gap ledger, with targeted interim oracles and closure
        evidence requirements rather than a blanket exact-build gate.
