  - id: etf-holdings-constituents
    title: Implement native ETF holdings integrations for all registered issuers
    status: in_progress
    priority: high
    scope: >
      Replace generated/thin ETF provider adapters with full native per-provider ETF
      holdings integrations for the broad U.S. ETF promoter universe, currently 496
      promoters per LSEG Lipper's June 2026 U.S. ETF industry review, with each
      registered provider having isolated implementation code plus static and live
      test coverage. The repo currently enumerates 496 adapter keys, so the arithmetic
      named-promoter gap is closed against the LSEG 496 target; do not
      invent placeholder names from a count-only market source. SEC EDGAR remains
      fallback only and must not count as primary provider support. Respect the priority
      ordering of ETF providers based on what was discussed: higher priority to
      implement a native handler should be given to those providers that host more ETFs,
      hold ETFs with higher AUM, or hold ETFs with greater coverage of overall US stock
      market listed stocks. Keep trying to access each provider's resources, even if
      they reject requests. If after some tries a provider is only flaggable as blocking
      (our requests), skip it and mark it as such so we can take care of the next one,
      and so on and so forth. Do not instantly block the goal until you can actually say
      you've tried all pending/left providers. Ensure also that the maintainability gap
      (i.e., we do not programmatically assert that every member of
      LIVE_BACKED_ISSUER_ADAPTERS has a corresponding live-test case) is covered for all
      supported providers.
    definition_of_done:
      - Every registered issuer has an isolated provider-specific holdings implementation
      - Every provider has static and opt-in live coverage for a concrete issuer route
      - The live test suite programmatically asserts that every native/live-backed provider has a concrete issuer-route test
      - SEC EDGAR is only a fallback path
      - Handoff and validation evidence are current
