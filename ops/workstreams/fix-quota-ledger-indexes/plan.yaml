local_validation_profile: docker_integration
local_validation_reason: >-
  Backend quota coordinator schema only: additive secondary indexes on the private quota ledger, created for
  new ledgers and upgraded in place for existing SQLite and PostgreSQL ledgers. The coordinator unit suite and
  new index/plan tests run locally, plus a real-PostgreSQL ledger upgrade test. Exact-source CI and the
  staging exhaustive gate run every suite.
goal_budget_policy: unbounded_unless_human_authorized
human_goal_budget_authorization: none
goal: >-
  Remove the global provider-call ceiling: every provider request on the platform reserves and settles through
  one exclusive quota-ledger transaction, and on the append-only production ledger (128k baselines, 278k
  reservations) each admission full-scans both tables, holding the lock ~240 ms. Index the hot admission
  queries so the lock hold is a few milliseconds and the cost no longer grows with ledger age.
scope:
  - Secondary indexes serve the baseline lookups, the rolling and fixed-window reservation sums and counts, the identity-keyed reservation lookup and the expired-lease sweep.
  - Fresh ledgers get the indexes from the table definitions; existing SQLite and PostgreSQL ledgers get them in place on first use, under the existing schema-upgrade lock.
  - No ledger row is deleted or rewritten; the append-only evidence policy is unchanged.
owned_paths:
  - backend/app/services/provider_quota_coordinator.py
  - backend/tests/unit/services/test_provider_quota_ledger_indexes.py
  - backend/tests/integration/test_provider_quota_ledger_indexes_postgres.py
  - ops/workstreams/fix-quota-ledger-indexes/
dependencies: []
acceptance_criteria:
  - id: AC1
    text: >-
      A fresh SQLite ledger has indexes on baselines (account_scope, quota_group, dimension, window_seconds,
      observed_at), reservations (account_scope, quota_group, dimension, created_at), reservations
      (account_scope, quota_group, dimension, window_started_at) and reservations (account_scope, state,
      lease_expires_at).
  - id: AC2
    text: >-
      An existing SQLite ledger created without those indexes gains them on first use, keeps every row, and
      the coordinator still reserves and settles on it.
  - id: AC3
    text: >-
      SQLite's query plan for each hot admission query (baseline lookup, rolling settled-usage sum, rolling
      and fixed pending counts, identity-keyed reservation lookup, expired-lease sweep) searches an index
      instead of scanning the table.
  - id: AC4
    text: A PostgreSQL ledger without the indexes gains them on first use, and re-running the upgrade is a no-op.
  - id: AC5
    text: Exact-source feature CI and the staging exhaustive gate are green before promotion; production deployment waits for the human's approval.
branch_tests:
  - uv run --project backend pytest backend/tests/unit/services/test_provider_quota_ledger_indexes.py backend/tests/unit/services/test_provider_quota_coordinator.py backend/tests/unit/services/test_provider_quota_contract.py -q --no-cov
branch_tests_reason: Index presence, in-place upgrade and query plans are covered offline on SQLite; the PostgreSQL upgrade test runs in the integration suite.
live_test_impact: none
migration_impact: >-
  No Alembic change (the quota ledger is a separate private store). Additive CREATE INDEX IF NOT EXISTS on
  the ledger at first use per process; no data change.
deployment_impact: >-
  Backend/worker image only. The first quota admission after start builds the ledger indexes once (~1.3 s on
  the 195 MB production ledger, under the existing schema-upgrade lock); no environment or deployment-file
  change.
