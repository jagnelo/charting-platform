closure_summary: >-
  The weekly universe seed (cron scheduled_weekly_seed) failed on 2026-11-22 with
  StringDataRightTruncation: value too long for type character varying(50). seed_universe_task records an
  instrument_sync_run audit row whose source is the comma-joined provider chain; a long chain exceeded
  varchar(50) and the insert failed before the seed started. Migration d5e6f7a8b9c0 widens source to
  varchar(255) (existing rows stay valid; downgrade refuses to truncate) and the chain label is capped at
  255 characters. Requires integration_capture: exact branch HEAD.
