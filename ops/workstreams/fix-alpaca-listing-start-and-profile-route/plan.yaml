closure_summary: >-
  About 87% of Alpaca D1 history calls returned no data. After a head chunk returns bars that begin at the
  listing, the planner queued an older chunk back to 2016 that is always empty, and it repeated daily
  because its request key moves with the end date (11,189 such jobs in 24 h). The planner now skips the
  older chunk when the bars of the chunk it just fetched (stored plus fetched, for D1 and coarser) begin
  more than 30 days after the chunk start, or when the chunk ends before the earliest known listing or IPO
  date; the reason is recorded in result_summary. About 98% of the last day's older-chunk no-data jobs
  would have been skipped. Alpaca is no longer routed for instrument_metadata (no data on 96% of profile
  calls): it is dropped from the chain seed and from its routable capabilities, so the seed sweep disables
  its policy row and Edgar and Massive serve profiles. Requires integration_capture: exact branch HEAD.
  Requires integration_capture: exact branch HEAD.
