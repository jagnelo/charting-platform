closure_summary: >-
  Futures have no price history because no legally usable free futures OHLC source exists for the held
  instruments. Stooq serves a proof-of-work bot challenge, CME data terms prohibit scripts and scrapers,
  Yahoo terms forbid automated collection (yfinance stays gated off), CFTC publishes positions only, FRED
  has no futures prices, and Cboe VX files cover only VIX futures without confirmable terms. Production
  holds no Future-type instruments; the only futures-like rows are 13 Dec-2026 CME contracts materialized
  as Stock from ETF holdings. No adapter was added. Unblock paths: IBKR persistent-storage authorization
  (the adapter already supports futures history), or a reviewed Cboe VX terms decision. Requires
  integration_capture: exact branch HEAD.
