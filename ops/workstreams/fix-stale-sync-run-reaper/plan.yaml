closure_summary: >-
  Production held 12 instrument_sync_run rows stuck in 'running' (9 sync-instruments, 3
  bootstrap-ids/openfigi). run_tracked_sync closed rows only in `except Exception`, but arq job timeouts
  cancel with CancelledError (a BaseException) and deploys kill the worker; the daily OpenFIGI bootstrap
  also had no time budget and took 8-9 min against the 600 s job timeout. Rows are now always closed:
  failed on exceptions (fresh-session fallback if the job session cannot commit) and cancelled on
  cancellation (shielded fresh-session write). bootstrap-ids stops at a 480 s budget. A reaper marks
  running rows older than 6 h as failed ('abandoned: ...') at worker startup and before every run, so the
  next deploy closes all 12 production rows. Stale rows never blocked runs. Requires integration_capture:
  exact branch HEAD. Requires integration_capture: exact branch HEAD.
