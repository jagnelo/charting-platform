  - "Create and maintain a branch-owned exhaustive provider audit ledger covering all 140 current fallback-only adapter keys, with deterministic prioritization, source evidence, attempt dates, route disposition, and next action."
  - "Investigate every current fallback issuer against first-party public or already-entitled holdings sources; promote only complete, executable, provider-owned routes and retain evidence-backed fallback classifications otherwise."
