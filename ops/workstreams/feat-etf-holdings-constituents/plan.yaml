    proposed_typed_request: >-
      Minimal admin-only request fields are predecessor_job_id=3,
      operator_review_reference (bounded opaque string),
      review_evidence_sha256 (exactly 64 lowercase hex characters), and
      request_id (UUID idempotency key). The review attestation must bind the
