  - "Enforce one platform-wide recurring provider budget of 20 EUR/USD-equivalent units per month, with free and zero-incremental-cost sources first; paid activation remains separately human-authorized."
  - "Prioritize active US ETFs by AUM, configured benchmark/proxy role, and platform usage, beginning with WisdomTree DXJ/NTSX, PIMCO MINT/BOND/GEME, and the F/m U.S. Benchmark Series."
  - "Add bounded, opt-in ETF route canaries, schema/content-drift detection, stale-data visibility, failure classification, recovery, and shared provider-health integration."
  - "Assess licensed/vendor sources only after compliant free and already-entitled options, recording coverage, terms, freshness, quota, and cost without purchasing or enabling a paid source in this session."
  - "Fix the narrow generic chart comparison/plot toolbar overlap that blocks the required F9c browser assertion, without weakening the assertion or changing generic visual baselines."
  - "Stop at ready_for_human_review with a clean, synchronized feature branch; do not integrate, promote, deploy, or modify another worktree."
