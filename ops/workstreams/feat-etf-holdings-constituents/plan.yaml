      operation, OIH/profile/instrument/symbol, host/URL, account scope, scope
      revision, expiry and every request limit are derived from trusted current
      records and committed reviewed authority; none are caller-overridable.
    admission_and_single_successor: >-
      Under a row lock on exact failed job3, verify immutable job2/job3/raw
      lineage hashes and current repaired-release/deployment identity; verify
      current OIH profile/source/adapter, fresh reviewed account scope,
      revision/fingerprint/expiry, Provider health and ordinary global stop,
      free-only, paid-off, hold, known-cost/quota admission. Read the existing
      persistent ledger read-only, fail closed on missing/ambiguous proof, and
      count job3's settled unit as already spent. Require a distinct finite
      operator-approved application account budget for the successor, with
      concurrency=1, burst=1, one admitted operation, one physical request,
      and a recorded remaining budget sufficient for that request; do not infer
      native vendor quota/reset. Atomically claim at most one successor per
      predecessor. Same request_id returns the same successor without transport;
      concurrent or different successor claims are held before transport. Never
      reset/reuse job2/job3, their latch/helper/authority or the spent reservation.
