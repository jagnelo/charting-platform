closure_summary: >-
  Four e2e tests flaked about once per CI run, and CI fails any flaky test. F14-context-keyboard now waits
  for the OHLC and drawings loads, the drawing canvas, the Lines flyout opening and drawing mode before
  measuring the plot overlay and placing the line. F8x-library registers the version-save POST wait before
  the click, and CodeLibraryTool bumps its refresh generation on save, so a list fetch started before the
  save can no longer overwrite the new version (a real app race). The F8p Study Lab tests assert the
  symbol and source before Validate. The watchlist journey waits for the row to stop moving, then clicks
  the menu trigger exactly once. No assertion is removed or loosened and no retry setting is changed.
  Requires integration_capture: exact branch HEAD. Requires integration_capture: exact branch HEAD.
