closure_summary: >-
  Also fixes the throughput bound diagnosed on fix/refresh-queue-backlog: the Alpaca quota ledger settled every fetch_ohlcv call at its calendar-time page estimate (about twice the measured HTTP requests, holding the ledger at 190-200 of 200/min), and settled no-data slices were re-asked every 12h; Alpaca D1 calls now settle at measured requests (bounded by the reservation) and slices older than 30 days are remembered for 7 days.
  Wasted provider requests for answers that are stable for days. (1) xstocks: about 1.5k HTTP 404
  get_tokenized_price errors per 6h for unlisted tokens; a 404 is now remembered for 7 days per provider
  and symbol and refresh_tokenized_prices skips remembered tokens before any call. (2) The no-data slice
  memo was in-process only, so each worker restart re-asked Alpaca; it is now mirrored to Redis
  (charting:negmemo, same 12h TTL and 2-day minimum slice age) with the in-process dict as a fast cache,
  one MGET per repair, and a 30s cool-down when Redis is unreachable so it never fails a read. (3) Finnhub
  profile 403s (1087 of 1182 on mutual-fund-shaped tickers, 0 successes) and FMP profile 402s (dot-class
  symbols) are free-plan symbol-coverage limits; get_instrument_profile now remembers 404 for 7 days,
  402/403 for 3 days and definitive no-data for 2 days per provider and symbol, and routing drops
  remembered providers before quota reservation so the fallback chain still serves the symbol. 429, 5xx,
  timeouts and quota denials are never remembered. Requires integration_capture: exact branch HEAD.
