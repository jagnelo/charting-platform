goal: "do ALL of these"
scope:
  - Settle Alpaca fetch_ohlcv request units at the HTTP requests actually measured, never above the page-count reservation (moved from fix/refresh-queue-backlog, which diagnosed it).
  - Remember no-data slices that ended over 30 days ago for 7 days instead of 12 hours, in process and in Redis.
  - Persist the no-data history slice memo in Redis (same 12h TTL and 2-day minimum slice age) with the in-process dict kept as the fast layer; Redis failure degrades silently.
  - A shared best-effort Redis negative memo (app/services/negative_memo.py) and a per-provider identity memo for get_tokenized_price and get_instrument_profile (HTTP 404 7d, HTTP 402/403 3d, definitive no-data 2d).
  - Tokenized price refresh stops requesting tokens a provider reported 404 for, and stops logging an exhausted-provider error for them.
  - Provider routing skips providers remembered as unable to serve a symbol (Finnhub mutual-fund 403, FMP preferred/class-share 402 and no-data), without changing capability policy or quotas.
  - No schema, API or deployment change.
