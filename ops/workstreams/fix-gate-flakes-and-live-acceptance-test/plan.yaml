closure_summary: >-
  Three gate reliability items. (1) identity_batch.py calls providers but was missing from the
  full-live-acceptance provider module set in scripts/agent-session.py, so the workflow test failed; it is
  now registered and the test passes unchanged. (2) backend-coverage exit=2 is make's generic recipe
  status and hides the real cause; scripts/backend_coverage.py now writes per-shard junitxml and prints a
  ::error annotation naming the shard, exit status, reason and failing tests, so the next failure is
  diagnosable from public annotations. (3) The watchlist journey and F14 drawing e2e tests now wait for
  the create form to close and assert the menu trigger aria-expanded flips to true before selecting an
  item, so a click swallowed by a layout shift fails fast with that fact rather than a 60s menu-item
  timeout. The e2e root cause is a hypothesis; the gate is the first real run. Requires
  integration_capture: exact branch HEAD.
