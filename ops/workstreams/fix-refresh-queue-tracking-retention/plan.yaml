closure_summary: >-
  market_refresh_job held 748,770 data_preparation_request tracking parents (2.2GB table). Tracking
  parents never change status and nothing pruned them, and system maintenance mints about 100-120k a day.
  A bounded cron (minute 11 and 41, 5k-row batches, 240 s budget, on by default) now deletes
  system-maintenance tracking parents untouched for 3 days whose referenced child jobs are all terminal or
  gone; children (which carry request-key dedup) and owner tracking parents are never touched. About 290k
  rows qualify on the first runs, and the table settles near 300k tracking rows. Coalesced waiters whose
  survivor is still pending are parked for up to 30 min instead of being rechecked every 20 s to 10 min
  through the claim rotation (about 11.9k were cycling), and the survivor's completion wakes them through
  a PostgreSQL JSONB filter instead of a 500-row scan. The hand-over dips are documented: drains started
  by the quarter-hour tick share one 360 s deadline and end together near :06; no safe isolated fix was
  found. Requires integration_capture: exact branch HEAD. Requires integration_capture: exact branch HEAD.
