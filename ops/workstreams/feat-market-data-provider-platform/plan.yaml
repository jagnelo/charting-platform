      success_shape: "ProviderExecutionResult(provider_name, data_source, policy, health, result, response_payloads); response payload retention is enabled by default."
      success_test: backend/tests/unit/services/test_provider_runtime.py::test_execute_provider_call_persists_transport_measurement
      unavailable_shape: "If no usable provider response remains for an instrument, ProviderNoDataError is raised; unknown/exhausted quota is denied before invoke. Consumers must preserve unavailable/partial status rather than substitute guessed or stale data."
