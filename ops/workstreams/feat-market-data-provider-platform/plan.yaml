        - "provider_recurring_cost_status(session)"
      success_contract: "A successful decision includes allowed=true, reason_code, currency, monthly_ceiling, committed_monthly, proposed_monthly, remaining_monthly, commitment_id/revision where applicable, and paid_activation_authorized=false. Admin status and revision-history responses expose retained provider/environment/plan/state/monthly-equivalent/evidence/revision without exposing billing_account_scope or its digest; current commitments and budget/commitment revision history are paginated with total/limit/offset/next_offset so a page cap cannot silently hide rows."
