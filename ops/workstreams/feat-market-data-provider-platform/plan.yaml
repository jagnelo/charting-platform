        - backend/tests/unit/services/test_provider_recurring_costs.py::test_distinct_accounts_aggregate_and_over_ceiling_proposal_is_not_persisted
        - backend/tests/unit/services/test_provider_recurring_costs.py::test_trial_uses_known_post_trial_recurring_price_and_unknown_trial_is_denied
        - backend/tests/unit/services/test_provider_recurring_costs.py::test_commitment_lifecycle_revisions_recalculate_cost_and_retain_every_state
        - backend/tests/unit/services/test_provider_recurring_costs.py::test_reviewed_free_forever_commitment_uses_zero_budget_and_never_activates_provider
        - backend/tests/unit/services/test_provider_recurring_costs.py::test_zero_monthly_ceiling_allows_reviewed_free_and_denies_paid_commitment
        - backend/tests/unit/routers/test_market_data_admin_router.py::test_recurring_cost_admin_contract_is_admin_only_and_never_activates_providers
        - backend/tests/unit/routers/test_market_data_admin_router.py::test_zero_recurring_cost_budget_accepts_free_plan_and_denies_paid_plan
        - backend/tests/integration/test_provider_recurring_cost_concurrency.py::test_concurrent_near_ceiling_admissions_are_serialized_and_durable
