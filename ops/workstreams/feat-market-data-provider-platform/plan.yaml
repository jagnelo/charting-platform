  - Historical context only: the post-change live attempt at 2026-09-10T14:29Z collected 37 tests before the newly supplied Alpaca, MarketData.app, and Dinari Sandbox credentials were configured. The available provider probes recorded only aggregate request/byte telemetry outside Git; Dinari and Ondo stopped at their exact credential preflights in that run. The superseding 2026-09-11 matrix is recorded below; no historical run is treated as current acceptance evidence.
  - provider-specific incomplete contracts (FRED v1's published 120-requests/minute threshold is now paired with explicit fail-closed review controls for scope, conservative limit, and series terms; Nasdaq Trader polling; xStocks' unpublished public quota plus its official US-person/jurisdiction and redistribution restriction; Bybit xStocks endpoint/UID limits and provider-native header state; and FINRA OTC source terms/polling/redistribution approval) remain non-routable until reviewed; the separate FRED v2 2-requests/second rule is not applied to the v1 adapter; Tiingo/FMP bandwidth enforcement is implemented fail-closed and requires a complete operator-reviewed per-operation byte-bound map before promotion; Tiingo's provider-specific 500-unique-symbol monthly pool now has a durable per-window identity ledger and is no longer approximated as request count; Binance historical OHLCV now computes and reserves the conservative documented multi-page request weight before execution; FINRA synchronous short-interest, OTC Daily List, and the configurable OTC Security Master path now record the documented 1,200/minute/IP and 3 MB synchronous platform limits, with the credentialed datasets reserving the 3 MB maximum against the 10 GB monthly budget and settling to observed bytes; FINRA async signed-result accounting is implemented and fixture-tested, but remains default non-routable until a positive reviewed `FINRA_ASYNC_MAX_RESULT_BYTES` bound is supplied; the current FINRA API Terms of Service and dataset-specific redistribution/authorized-user boundary are recorded as a separate legal gate; every registered synchronous provider adapter now reports observed HTTP request counts, response bytes, and selected rate-limit headers into the runtime telemetry context; Finnhub's observed free key is recorded at 60/min plus the documented 30/sec hard cap, but its stock-candle endpoint is not entitled and remains excluded; Bybit's official 600/5-second/IP outer ceiling and rolling per-second endpoint/UID model are recorded, while the current public xStocks edge omitted the documented `X-Bapi-Limit*` headers during live validation, so no missing native state is guessed
  - complete production NMS/OTC reconciliation and the separately approved 30-day shadow run remain post-deployment gates; the NMS/SEC directory adapters and bounded keyless evidence are implemented, while FINRA OTC Daily List now supplies lifecycle deltas but OTC still needs an approved complete security-master source
  - the 2026-09-11T17:43:45Z matrix supersedes the earlier missing-credential run: 33/37 passed, with only Alpha Vantage IPO-calendar capacity plus the explicitly deferred Tradier, IBKR, and Ondo credential preflights remaining. The run wrote only aggregate telemetry to `/private/tmp/charting-provider-live-usage-resume.jsonl`; no credentials or payloads entered Git.
  - the post-options complete matrix rerun at 2026-09-12 collected 39 cases and passed 35. The four honest outcomes were Alpha Vantage's documented 25-requests/day IPO-calendar capacity response plus exact intentional credential preflights for Tradier, IBKR, and Ondo. xStocks returned an explicit null quote while its selected token reported a closed trading period; the test records that provider state without fabricating a price. No acceptance claim was made.
