  - backend migration compatibility and PostgreSQL/Redis integration tests
  - worker scheduling, quota reservation, request coalescing, deferred-run retry, and provider health tests
  - backend API contract tests for canonical IDs, compatibility symbol aliases, coverage, provider admin, sessions, quarantine, and shadow reports
  - opt-in live provider probes plus full backend integration validation when credentials and infrastructure are available
branch_tests_reason: Application models, migrations, providers, workers, Redis quota controls, and backend APIs are all changed; full backend integration is required. Frontend/browser validation is out of scope by explicit authorization.
live_test_impact: opt-in provider probes and a separately approved post-deployment 30-day disabled shadow run; no deployment or activation is authorized in this implementation session
migration_impact: multiple additive/transformational PostgreSQL migrations for issuers, domain identities, series scope, sessions, facts/events/short interest, provider runtime budgets, and shadow telemetry; old symbol/OHLCV rows require deterministic compatibility backfill
deployment_impact: new backend/worker configuration, optional provider credentials, QuantLib dependency, Redis-backed quota state, scheduled shadow-report jobs, and feature flags; deployment remains a separate human-authorized master workflow
status: ready_for_human_review
approved_execution_decisions:
  provider_use:
    rule: Use every eligible provider for every capability it supports, ranked dynamically by capability, history, freshness, health, entitlement, exact cost, and remaining usage.
    pricing: Free tiers only for now. Total future provider spend is capped at 20 per month and any paid upgrade requires a later evidence-based proposal and explicit approval.
    marketstack: Keep the existing Free plan and its 100 monthly calls; do not ask again about upgrading unless measured unmet demand justifies a proposal.
  identity_and_universe:
    nms_source: Nasdaq Trader official nasdaqlisted.txt and otherlisted.txt; fetch once per completed market day with conditional validators and immediate 429/reset handling.
    otc_source: FINRA Daily List lifecycle deltas plus the documented ORF active/inactive security-master pair; legacy otcSecurityMaster remains only a candidate.
    otc_source_validation_gate: FINRA's ORF file-download specification documents EQUITYMASTERAC and EQUITYMASTERIN as the complete active/inactive pair. The API uses a separate TRAQS refresh-token/assigned-username flow and requires product authorization/MFA plus reviewed use/redistribution terms; FINRA Gateway client credentials are not interchangeable. Configure and route the pair only after those controls are recorded; Daily List alone is not a complete security master.
    sec_issuers: First complete bounded SEC directory cycle with issuer materialization disabled, review its report, then create only missing validated CIK/name Issuer rows.
    prelisting: After the staged SEC gate, create inactive provisional instruments only for strong, unambiguous identity/venue evidence; quarantine the rest.
    delisting: Require three consecutive complete daily authoritative snapshot misses; incomplete runs do not count and authoritative reappearance reactivates the listing.
  providers:
    tradier: Deferred by user; keep non-routable and report exact credential preflight.
    ibkr: Deferred by user; keep non-routable and report exact gateway/session preflight.
    ondo_global_markets: Deferred by user; keep non-routable and do not request credentials in this phase.
    dinari: Sandbox-only, including a production-host canary isolated from canonical persistence; production API access remains disabled because the documented starting price is 2000 per month.
    xstocks: Sole user is an eligible non-US person; public API calls need no account. Live response-header limit is 1000 per rolling minute with remaining/reset headers and must be enforced as provider-native state.
    marketdata_app: Use the explicitly configured Starter Trial quota of 10000 credits/day through the timezone-aware configured expiry (30 days from the 2026-09-11 18:09 Lisbon key-email time, i.e. 2026-10-11 18:09+01:00); after expiry automatically fall back to Free Forever at 100/day. The plan/limit/expiry remain provider-specific environment configuration. Do not infer the account plan from /user/ headers; paid-plan quota changes require an explicit plan/limit configuration and paid-routing authorization.
    unknown_quotas: Investigate official documentation, account endpoints, and bounded live headers; do not ask the user to guess operational limits. Keep only truly undiscoverable dimensions non-routable.
  credentials:
    environments: [local-development, github-staging-validation, github-master-validation, live-production]
    current_keys: Existing credentials are local-development-only and must never be copied into GitHub or deployment stores.
    deployment: Production runtime secrets are target-owned and exposed only to backend/worker; production is not a GitHub validation environment.
  tokenized_data:
    audience: Private/internal, single eligible non-US user.
    dinari_sandbox: May be probed from live host only as a canary; never persist, route, alert, or analyze its synthetic/test data.
  validation:
    live_policy: Every enabled registered provider capability requires fixture coverage plus bounded current-source live evidence at the exact source SHA; user-deferred providers are explicitly deferred, not falsely passed.
    shadow: Do not start the 30-day shadow run in this phase; plan it only after all other controllable gates pass.
execution_plan:
  phases:
    - provider contract, quota, bandwidth, cursor, account-usage, and dynamic-router correctness across the full roster
    - complete venue/security-master reconciliation, SEC staging/materialization, prelisting, and ticker/lifecycle handling
    - four-domain secret isolation, protected staging/master live CI, deployment preflight, and integration-workflow enforcement
    - exhaustive fixtures, migration compatibility, local credentialed live matrix, and final provider-by-provider evidence report
    - separately planned 30-day shadow run as the final gate before closure and staging integration
  explicit_out_of_scope_until_separate_authorization:
    - staging/master/prod credential provisioning by the human owner
    - deploying or activating the application
    - running the 30-day shadow phase before every other controllable gate is complete
    - frontend changes and ETF constituent provider adapters
