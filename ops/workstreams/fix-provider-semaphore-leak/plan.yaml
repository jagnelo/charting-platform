closure_summary: >-
  Production refresh-queue stall. From 2026-11-22 02:00Z completions fell from ~2k/h to ~50/h for 34 hours:
  drains timed out at 600 s blocked in execute_provider_call on `await semaphore.acquire()`. The provider
  permit (one for unknown-concurrency providers such as Alpaca) was held from before quota admission to
  after result bookkeeping, so a holder blocked on an instrument_provider_capability_status row lock owned
  by another drain's open transaction while that drain waited for the permit (deadlock confirmed live via
  pg_blocking_pids, re-formed 4 minutes after a worker restart); cancellation during early-exit settles also
  leaked the permit. The permit now covers only the outbound provider request (`async with` around the
  executor call). Regression tests reproduce the deadlock shape and the cancellation leak and fail on the
  old code. Closed
  by the orchestrator under the 2026-11-13 delegation; production deployment still needs the human's explicit
  approval. Requires integration_capture: exact branch HEAD.
