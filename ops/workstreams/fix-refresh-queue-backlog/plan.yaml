  answers (87% of Alpaca D1 calls return no data, mostly pre-listing repair slices re-asked every 12h). No
  orphaned waits, missing prerequisites or failed rows exist; 6k satisfied waiters only add latency. The
  fixes (measured-request settlement for Alpaca fetch_ohlcv; 7-day memo for slices that ended over 30 days
  ago, mirrored to Redis) ship on fix/provider-negative-memo. Requires integration_capture: exact branch
  HEAD.
