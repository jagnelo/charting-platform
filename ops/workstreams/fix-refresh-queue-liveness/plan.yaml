acceptance_criteria:
  - id: AC1
    text: A real-PostgreSQL regression with more than 32767 active instruments fails on the old planner query with the production InterfaceError and passes on the fix.
  - id: AC2
    text: The scheduled tick still drains when the planner raises, and planning plus draining share one budget inside the 600s job timeout.
  - id: AC3
    text: A drain whose budget runs out (mid-batch or before claiming) schedules a continuation; a drain within budget on an empty queue schedules nothing.
  - id: AC4
    text: The discovered-universe pass stops at its deadline without dropping default or saved work, and resumes on later passes.
  - id: AC5
    text: Continuations stop once the configured number of other live drains is reached and resume below it.
  - id: AC6
    text: Exact-source feature CI and the staging exhaustive gate are green before promotion; production deployment waits for the human's approval.
