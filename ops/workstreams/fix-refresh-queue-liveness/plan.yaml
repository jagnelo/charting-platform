human_validation_authorization: agent_default_full_integration
local_validation_profile: docker_integration
local_validation_reason: >-
  Backend worker/planner change only (no frontend, migration or Compose input). Focused unit tests plus the
  real-PostgreSQL planner regressions run locally; the planner was also timed against a scratch restore of the
  verified production backup (34,111 active instruments). Exact-source CI and the staging exhaustive gate run
  every backend, frontend and Playwright suite.
goal_budget_policy: unbounded_unless_human_authorized
human_goal_budget_authorization: none
goal: >-
  Restore the self-sustaining refresh queue in production: the whole-market universe (34k active instruments)
  broke the scheduled planner and the drain chain, so nothing has drained on schedule since 2026-11-19 13:06Z.
scope:
  - Planner selects primary listings by the instrument predicate instead of one bind parameter per active instrument.
  - The quarter-hour tick drains already-queued work even when planning fails.
  - Drains stop claiming at a wall-clock budget and hand over to a continuation instead of being cancelled by the job timeout.
  - The discovered-universe planning pass (quarter-hour tick and 05:00 daily cron) stops at the same budget.
  - Continuation chains are capped so robust drains cannot crowd the worker's four job slots.
  - The daily metadata sync commits as it goes and stops at a wall-clock budget instead of losing its whole pass to the job timeout.
