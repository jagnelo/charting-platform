closure_summary: >-
  Production refresh-queue liveness at whole-market scale. Planner primary-listing read no longer binds one
  parameter per active instrument (real-PostgreSQL regression reproduces the production InterfaceError on the
  old query and passes on the fix). The quarter-hour tick drains even when planning fails; drains and the
  discovered-universe planning pass stop at a shared 360s budget and hand over; live continuation chains are
  capped at 2; the daily metadata sync checkpoints every 25 instruments and stops at 480s. Timed on a scratch
  restore of the verified production backup (34,111 instruments): each bounded tick plans ~10k instruments,
  re-checking planned ones is cheap (~17k in under a minute), and the third tick completed the universe in 277s;
  the largest bind list is 48 parameters. Unit 232 + 40 and PostgreSQL planner tests pass; Ruff clean.
  Requires integration_capture: exact branch HEAD.
integration_capture: exact branch HEAD
