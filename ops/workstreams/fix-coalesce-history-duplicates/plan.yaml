closure_summary: >-
  Wasted provider requests from duplicate history children. After release 4d5bd954 removed the provider-permit
  deadlock, about a quarter of Alpaca D1 calls returned no data, most of them repeats: ESZ6 alone had 40 open
  deepest-range children, each draining and calling Alpaca separately. Production held about 35k open duplicate
  deepest-range children (about 40% of the 92k open refresh jobs), all forked by hourly maintenance before
  enqueue-time sibling joining shipped in 896ad20f (2026-11-20 23:10Z); none were created after it, but nothing
  folded the existing ones. A drain now folds a leased duplicate into the oldest waiting sibling of the same
  series (same adjustment and feed pin; rows another drain holds are skipped): its parent refs move to the
  survivor, its parents' dependency job_ids are repointed, the survivor keeps the wider end, the more urgent
  priority and any coarse derivation, and the duplicate waits on the survivor and then copies its outcome
  without a provider call. Enqueue-time joins skip folded rows. The worker regression test fails on the
  previous code (the provider fetch runs). Closed by the orchestrator under the 2026-11-13 delegation;
  production deployment still needs the human's explicit approval. Requires integration_capture: exact branch HEAD.
