closure_summary: >-
  Production holds about 341 duplicate instrument pairs created when a FIGI-keyed universe row minted a
  new instrument instead of adopting the existing exchange-qualified legacy listing. The root cause is
  fixed in market_universe._adoptable_legacy_listing. A bounded, idempotent, lock-ordered worker task
  (cron every 15 minutes, 25 pairs, 240 s) merges provable duplicates: it repoints every FK found through
  the catalog, unions bars (canonical wins), merges market_series with scope_key rewrite, logs each
  retired id in the new instrument_merge_log table (migration b1c2d3e4f5a7, chained after d5e6f7a8b9c0)
  and deletes the duplicate. Only the evidence tiers listed in INSTRUMENT_DUPLICATE_MERGE_EVIDENCE run
  (default same_listing and separator_spelling, about 336 pairs); bar_agreement (about 800 pairs) is
  opt-in after a dry-run review. Share classes with different CUSIPs are never merged. Requires
  integration_capture: exact branch HEAD. Requires integration_capture: exact branch HEAD.
