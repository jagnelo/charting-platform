goal: "do ALL of these"
scope:
  - Root-cause fix - a new stable-key (FIGI) universe row adopts the unique exchange-qualified, same-type, non-conflicting legacy listing instead of minting a duplicate instrument.
  - Idempotent, transactional, lock-ordered merge of provable duplicate instruments (backend/app/services/instrument_dedup.py) that repoints every FK to instrument (catalog-driven), merges market_series and scope-keyed bars, resolves unique collisions in favour of the canonical row, logs retired ids and deletes the duplicate.
  - Bounded arq maintenance task and cron (every 15 minutes, 25 pairs per pass) so existing duplicates drain gradually and any future one self-heals.
  - instrument_merge_log audit table (schema-only migration).
  - No API, provider routing or quota change; no unique constraint added (existing data and legitimate share-class listings make one unsafe).
