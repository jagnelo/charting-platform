    text: "TC consumes the provider-platform preflight and coverage contract from staging without implementing generic provider selection, credentials, ingestion, refresh workers, or provider probes."
  - id: AC3
    text: "TC consumes ETF holdings capability/source lineage from staging; stale last-known holdings remain display-only and do not become current analytic input."
  - id: AC4
    text: "The TC workstation supports its benchmark-to-sector/industry/constituent flow, Market Map, breadth, ratios, and historical analytics over persisted evidence with explicit gaps and provenance."
  - id: AC5
    text: "The existing TC Python/DSL/Study/Strategy engine remains the single programming model, immutable and lineage-preserving, with compatible promotions and explicit capability errors."
  - id: AC6
    text: "Mapped V25 reference states and the workstation interaction model are implemented and validated without weakening visual or functional oracles."
  - id: AC7
