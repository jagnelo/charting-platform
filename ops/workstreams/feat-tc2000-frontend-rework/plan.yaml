upstream_consumer_contracts:
  market_data:
    source_of_truth: feat/market-data-provider-platform
    preflight_statuses: [full, partial, deferred, stale-blocked, provider-unavailable, empty]
    tc_rules:
      - Preserve upstream status, provider/capability/entitlement evidence, coverage, and freshness.
      - Do not select providers, probe providers, retry, repair, or enqueue ingestion from TC read paths.
      - Treat only explicitly sufficient upstream coverage plus TC analytic requirements as analysis-ready; expose partial/deferred/stale/unavailable/empty distinctly.
  etf_holdings:
    source_of_truth: feat/etf-holdings-constituents
    availability: [current, degraded, stale, unavailable, not_applicable, unknown]
    tc_rules:
      - Preserve usable_for_current_analysis as the upstream eligibility authority.
      - displayable_last_known permits labelled last-known display only, never current analysis.
      - Preserve source tier, provider, composition/published/freshness dates, completeness, identity, and failure/audit metadata.
      - Do not implement adapters, provider probes, refresh routes/workers, or constituent resolution in TC.
acceptance_criteria:
  - id: AC1
    text: "The TC-only ownership boundary is executable: future touched paths are in the scoped allowlist or documented shared exceptions, and provider/ETF-owned paths fail validation."
  - id: AC2
    text: "TC consumes the provider-platform preflight and coverage contract from staging without implementing generic provider selection, credentials, ingestion, refresh workers, or provider probes."
  - id: AC3
    text: "TC consumes ETF holdings capability/source lineage from staging; stale last-known holdings remain display-only and do not become current analytic input."
  - id: AC4
    text: "The TC workstation supports its benchmark-to-sector/industry/constituent flow, Market Map, breadth, ratios, and historical analytics over persisted evidence with explicit gaps and provenance."
  - id: AC5
    text: "The existing TC Python/DSL/Study/Strategy engine remains the single programming model, immutable and lineage-preserving, with compatible promotions and explicit capability errors."
  - id: AC6
    text: "Mapped V25 reference states and the workstation interaction model are implemented and validated without weakening visual or functional oracles."
  - id: AC7
