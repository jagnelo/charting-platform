on_demand_market_acquisition_proposal: 'Human authorization: “Ok, so proceed then”; coordination contract and safety

  boundary: /home/m920q/charting-platform/.ai/staging-attempts/on-demand-market-acquisition-contract-20261027.md.

  At the time of the initial proposal, Provider and ETF owners still needed to

  review reusable APIs and return additive wire shapes. Their later reviewed

  DTO designs were used for a TC-owned UI implementation and controlled-response

  tests; the current implementation evidence and limits are recorded in

  current_checkpoint_status. No sibling source was imported, and no live source

  validation has occurred.


  Existing paths reviewed: WorkstationView''s 120ms search calls GET

  /instruments/search?q=...&canonical_only=true; selecting a result resolves

  canonical identity and loadSymbolData calls chartStore.loadBars(..., true),

  which reads /ohlcv/local for ordinary bars. It cannot discover tickers outside

  the local catalog. The shared SearchBar used by ChartView and ETF searches

  /instruments/search without canonical_only; backend search defaults false, so

  typing may invoke provider search. ChartView selection calls chartStore.loadBars

  with localOnly=false by default; /ohlcv also defaults local_only=false and can

  fetch through a provider. Workstation comparisons use /ohlcv/local. The

  CoverageSummaryTool reads /coverage/instruments/{symbol}/ohlcv. Keep cached

  rendering read-only; require explicit discovery/history actions, not calls on

  mount, render, or each search keystroke.


  ETFHoldingsView lists profiles via GET /etf-holdings, but selecting a search

  result or a profile without a stored snapshot currently posts

  /etf-holdings/{symbol}/bootstrap. Make this intent visible as an explicit Load

  holdings action after selection. Existing snapshots are read through /dates

  and /holdings; ETFHoldingsPanel separately reads /latest and /capability.

  Preserve composition date, known_at, source/provenance, identity/resolution,

  stored-snapshot and current-analysis distinctions. MarketMapTool already has

  an explicit Load ETF action for constituent-universe bootstrap; it is not a

  constituent-bar request. Current ETF constituent chart links are gated by a

  resolved tradable row plus current-analysis capability. A resolved security

  from a historical snapshot should still have an explicit read-only historical

  chart path, independent of parent-fund current-analysis eligibility. This

  cannot upgrade the fund snapshot''s eligibility or feed it into current

  analysis; ETF owner review must confirm the row-identity contract.


  Minimal user flow: (1) Typing shows local canonical suggestions only. A

  keyboard-accessible Search free sources action explicitly starts bounded

  discovery for an unknown ticker. Label candidates with normalized symbol/name,

  exchange/type, source and supported/held state; choosing one must return a

  producer-issued canonical instrument ID. (2) Open its chart without clearing

  cached bars. If local coverage shows a gap for the selected symbol/timeframe,

  offer Load missing history for that one instrument, timeframe and bounded date

  range. (3) ETF selection shows stored snapshots and current-analysis eligibility

  separately; a deliberate Load holdings action requests one selected fund.

  (4) A resolved constituent can open its own historical chart even when the

  parent ETF snapshot is historical/not current. Only an explicit Load missing

  history action may request that one constituent''s bars. Never fan out over

  fund members or describe the ETF snapshot as current.


  Required consumer API semantics, pending owner-designed wire shapes: explicit

  bounded discovery returns candidates with identity/source/availability and

  safe no-match/held reasons; candidate selection resolves to a persistent

  canonical ID. A history request accepts one canonical ID, timeframe and date

  range and returns stable request identity, truthful lifecycle state, source,

  covered range and refreshed coverage. A single-fund holdings request returns

  status and snapshot identity, composition date, known_at, provenance, row/

  resolution counts and current-analysis capability. A resolved constituent

  history request reuses the Provider-owned one-instrument contract and does

  not require parent-fund current-analysis eligibility. Distinguish

  queued/running/partial/complete, held, unsupported/no-free-source, no-data

  and failed; report only real progress and safe error text. Preserve cached

  bars/snapshots while requests run. Announce status accessibly; retries remain

  explicit. Retain Arrow/Enter/Escape, visible focus and narrow-screen access.

  These are consumer requirements, not a guessed endpoint or frozen JSON schema.


  Existing behavior is source evidence only. Provider/ETF owner review is the

  next technical prerequisite, not a human-testing gate. Keep all original

  AC1-AC9, frozen imported byte pins, quotas/data holds and assertion/reference/

  mask/tolerance/retry policies unchanged. Do not replay the consumed119-request

  allowance, SEC acquisition or IWM reparse.'
on_demand_consumer_implementation: 'Current TC-owned mocked implementation at the staged candidate: the chart has

  one ordinary “Load missing history” action. Its explicit click checks

  selected-timeframe local coverage first, resolves the returned canonical

  identity only when gaps exist, validates matching symbol and safe positive ID,

  and requests one bounded history range. The range guard mirrors Provider

  `TIMEFRAME_SECONDS` semantics: ceil(elapsed/timeframe)+1 inclusive slots <=

  2000. Daily defaults cover180days; defaults/caps are M1 1d, M5 6d, M15 20d,

  M30 30d, H1 60d, H2/H4/H12 90d, D1 180d, and W1/MN 700d. Weekly/monthly

  limits are conservative application defaults. Provider APIs own

  source-specific coverage and entitlement decisions and may return partial or

  held outcomes when history is unavailable; the UI says so and preserves

  cached data. No

  mount/typeahead/navigation source call was added. Only

  successful/partial history completion emits the existing local-only chart

  reload; held/no-data/failure retains current bars.


  ETF selected-fund buttons resolve identity internally before one cache-only

  (`refresh:false`) or explicit issuer (`refresh:true`) request. A denied,

  mismatched or unsafe identity sends no holdings request; a resolved identity

  is retained for later actions. Historical snapshot lineage remains separate

  from current-analysis capability, and held refreshes retain cached rows and

  `known_at`. No Search/ETF mount or navigation action requests a source.

  Focused tests cover single-click sequencing, sufficient/failed local coverage,

  held and denied outcomes, symbol/timeframe generation fencing, chart cache and

  local reload, ETF cache-only versus refresh, denied identity, selected-snapshot

  retention, native keyboard controls and bounded dates.


  The main Workstation front door now has a conditional action in the focused

  chart tool: after local search/discovery and canonical identity resolution,

  an empty settled chart offers the same explicit bounded history control.

  Mount, typing, layout hydration, linked-chart activity and other symbols stay

  local-only. The control binds to the focused symbol/timeframe, requests one

  selected instrument only after an ordinary user click, and refreshes local

  bars after success. Its mounted test covers no acquisition on mount/inactive

  focus, explicit-click request sequencing and local readback. A controlled

  Chromium case now exercises the real Workstation entrypoint from absent local

  ticker through discovery, identity resolution, chart focus, bounded history

  request and visible local bars; its fixture responses are software-only.


  The wire review at

  `/home/m920q/charting-platform/.ai/staging-attempts/on-demand-wire-design-review-20261027.json`

  reconciles additive `cache_hit`, optional empty exchange, candidate-symbol

  consistency and nonempty timezone-aware history bounds. It remains wire

  design only. Range semantics were checked read-only against Provider

  `instruments.py` and `ohlcv.py` (source hashes7cb5c61f/cee00e29); the

  inclusive max request budget is2000 and the timeframe map is mirrored in

  focused tests. These are application-side bounds, not assertions about any

  source''s availability or entitlement. The accepted Provider/ETF producer

  source is now imported only through exact synchronized-green staging

  173745205692acd3fca650eeeafcd6de38f29fed (staging CI40624295433); no sibling

  worktree source was imported or run and no genuine source call was made.

  Root accepted bounded TCO1-TCO6 software checkpoint at implementation ff564860e5b0918e269a862962cd63ba470e2153. Source-qualified
  local functional/strict-visual receipts and exact CI40644260199 passed; final TCNEW correction is covered by its targeted
  immutable-snapshot pass and full exact CI. Accepted staging e3e87183fdf8690bfb8e7ad8c2ae8a6569fc48f2 has the identical application
  tree and passed its full required CI40656688915. This feature-branch adoption records ancestry only; its exact branch CI
  is pending Root. Controlled tests are not genuine Provider/issuer proof; target/deployment and the complete roadmap remain
  open.'
