  weakening visual or functional oracles.'
- 'R7: after provider then ETF work reaches staging, synchronize TC through the prescribed workflow, reconcile every shared
  path semantically, and run exact-tip validation before ready_for_human_review; do not directly merge branches, promote,
  deploy, or mutate another worktree.'
- 'R8: under the exact 2026-10-26 human presentation handoff, inventory and unify every reachable frontend route/component
  in TC style without changing feature behavior or upstream ownership; retain all original visual oracles and full roadmap
  gates.'
