historical_implementation_records:
  - "Product commit 61c4ae34a adds a dedicated historical Python breadth-to-Strategy signal promotion path. Research Results no longer routes this action through an EasyScan condition: the TC endpoint creates a separate immutable signal asset and Strategy definition atomically, preserving source run, member IDs, dataset-manifest fingerprint/summary, source output name, threshold adapter, recursive member tree, and point-in-time lineage. Cross-sectional trees are rejected as aggregate-only. Legacy and canonical promotion diagnostics are normalized into queued Strategy research jobs, including condition-tree execution. Focused frontend Research Results coverage passed 48/48; full frontend Vitest passed 1,102/1,102; type-check and production build passed with the existing large-chunk warning; Strategy Lab API coverage passed 29/29; breadth workspace integration passed 2/2 for Boolean, numeric-series, and recursive-tree paths; Strategy queue unit coverage passed 16/16; Ruff/format and diff checks passed. The initial exact gate attempt had one transient F8k popup-recovery failure; a fresh-stack retry passed 1/1 and the exact rerun then passed functional Chromium 170 with 107 documented skips plus all four visual projects 104/104. No provider-platform, ETF, visual baseline, threshold, mask, skip, V25 media, or acceptance policy changed."
  - "Exact make validate-integration gate passed at product/checkpoint tip 2153991e4: backend unit/integration coverage 1,619 passed, frontend Vitest 1,102/1,102, lint/format/type-check/build, Compose contracts, expected research-runner sandbox/resource probes, authenticated functional Chromium 170 passed with 107 documented skips, and all four visual projects 104/104. Stack teardown removed the assigned containers, volumes, network, four generated images, and test sessions. A focused retry classified the earlier runner restart as transient; an intermediate stack build hit Docker storage exhaustion and a full-gate retry hit stale custom-builder registration, both recovered with exact TC2000 builder cleanup. No provider/ETF, visual-oracle, baseline, threshold, mask, skip, or acceptance-policy behavior changed."
  - "Product commit c17962ef2 replaces dense canvas Market Map hover/click linear scans with a fixed normalized-space spatial hit-test index while preserving source-order first-match semantics at shared edges. Focused Market Map utility/component coverage passed 59/59, full frontend Vitest passed 1,102/1,102, type-check and production build passed with the existing large-chunk warning, and git diff checks passed. No provider-platform, ETF, visual baseline, threshold, mask, skip, V25 media, or acceptance-policy behavior changed."
  - "Product commit f23cb77f6 gives manually added Strategy Lab symbol-removal controls explicit accessible names (Remove <symbol>) while preserving the visible glyph and click handler. Focused Strategy Lab coverage passed 31/31 with named-control and removal assertions; frontend type-check and git diff checks passed. No provider-platform, ETF, visual baseline, threshold, mask, skip, V25 media, or acceptance-policy behavior changed."
  - "Product commit e11ce1f47 gives the chart comparison add and remove controls explicit accessible names (Add comparison and Remove <symbol>), preserves title/visible/click behavior, and updates F9c to use role/name locators. Focused workstation/pop-out coverage passed 31/31; frontend type-check and production build passed; authenticated branch-scoped Chromium confirmed add/remove semantics; Docker stack teardown removed only the assigned resources; and git diff checks passed. No provider-platform, ETF, visual baseline, threshold, mask, skip, V25 media, or acceptance-policy behavior changed."
  - "Product commit a624ffaf5 gives the compact WorkstationView layout-clone '+' control the explicit accessible name 'Clone active layout' while preserving its title and activation. Focused workstation/pop-out coverage passed 31/31, including clone activation and accessible-name assertions; frontend type-check, TC scope guard, workstream validation, and git diff checks passed. No provider-platform, ETF, visual baseline, threshold, mask, skip, V25 media, or acceptance-policy behavior changed."
  - "Exact-tip full_stack_browser gate at documentation/product tip 04903e6ff passed: backend unit+integration coverage 1,619 tests, frontend coverage, type-check/build, compose contracts, expected research-runner sandbox/resource probes, authenticated functional Playwright 170 passed with 107 skipped, and all four visual projects 104/104 passed. The branch-scoped stack teardown removed its containers, volumes, network, four generated images, and test sessions. The first same-tip attempt failed only because the helper reused an existing builder; the successful retry used a fresh branch-scoped builder with Docker API access. The declared branch-test full-gate command now omits INTEGRATION_BRANCH to prevent recursive invocation."
  - "Product commit 361cdcb54 fixes direct single-output Study Lab range promotion: valid aligned finite centers now resolve their durable named artifact for chart-plot and latest-column adapters, while malformed or centerless ranges remain view/export-only. Focused Study Lab coverage passed 39/39; full frontend Vitest passed 1,099/1,099; type-check and production build passed; authenticated F9j-range passed 1/1 with lineage assertions; TC scope guard passed 52 paths and six self-tests; diff checks passed; and the branch-scoped stack/resource cleanup completed. No provider-platform, ETF, visual-oracle, threshold, mask, skip, or acceptance-policy behavior changed."
  - "Product commit 349ffc07 validates persisted Research Results cross-sectional series shapes before exposing an aggregate chart plot. Malformed timestamp/value alignment remains view/export-only with an explicit limitation, while valid aggregate series retain the existing lineage-preserving adapter. Focused Research Results coverage passed 40/40; full frontend Vitest 1079/1079; type-check/build and authenticated headless F8t-results passed; scoped Docker cleanup/resource audit, scope/workstream validators, and diff check passed. Six protected visual diffs, exact-tip validation, upstream staging dependencies, and private-origin push authorization remain open."
  - "Product commit bda0f964 aligns generic watchlist history planning/status and refresh-source responses with the benchmark-family disposition contract: canonical/placeholder/unresolved/excluded. Aggregate exclusion behavior remains compatible, unavailable sources return deterministic zero maps, and Market Map exposes the map only through hidden accessibility evidence. Focused backend history planner/status coverage passed 7/7; Docker-backed watchlist API regressions passed 2/2; adjacent benchmark/watchlist units passed 32/32; Market Map coverage passed 36/36; type-check/Ruff/format/diff checks passed; and the exact gate passed backend unit/integration 1374/387, frontend Vitest 990/990, and functional Playwright 165/272 (107 documented skips). Visual parity remains 98/104 with exactly the six established watchlist-column-editor-open/workspace-floating diffs; teardown was clean and no visual baseline, mask, threshold, skip, provider, fallback, or acceptance policy changed. Continue R1 history/provenance and R2-R7 evidence."
  - "Product commit 96bfea6e extends the admin canonical history-refresh planner with canonical/placeholder/unresolved/excluded member dispositions while preserving legacy aggregate counts and deterministic zero maps for unresolved/error legs. Focused planner coverage passed 25/25; the Docker-backed ETF history API suite passed 65/65; frontend type-check, Ruff, format, and diff checks passed; and the exact gate passed backend unit/integration 1373/387 plus functional Playwright 165/272 (107 documented skips). Visual parity remains 98/104 with exactly the six established watchlist-column-editor-open/workspace-floating diffs; teardown was clean and no visual baseline, mask, threshold, skip, provider, fallback, or acceptance policy changed. Continue R1 history/provenance and R2-R7 evidence."
  - "Product commit 7333b328 adds canonical/placeholder/unresolved/excluded member dispositions to every persisted benchmark-family snapshot while keeping canonical IDs and readiness denominators scoped to resolved security/equity rows. The mixed snapshot workspace integration contract passed 57/57; focused Market Map/accessibility/pop-out frontend coverage passed 66/66; type-check, Ruff, and diff checks passed. The exact gate passed all non-visual stages and functional Playwright 165/272 (107 documented skips); visual parity remains 98/104 with exactly the six established watchlist-column-editor-open/workspace-floating diffs. No visual baseline, mask, threshold, skip, provider, fallback, or acceptance policy changed; continue R1 history/provenance and R2-R7 evidence."
