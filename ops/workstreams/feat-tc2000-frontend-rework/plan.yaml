current_blocker: >-
  Current TC frontend parity covers supported Ctrl+number timeframe shortcuts,
  Ctrl+B cycling through HLC/OHLC/Candles/Line, and `/` opening the active
  chart's plot library. HLC uses the existing OHLCV data and draws each
  high-low range plus the close tick; the open tick is omitted. At pushed
  product source 86eff36ac plus the local HLC change, focused renderer and
  workstation tests pass 45/45; the full serial frontend suite passes 130/130
  files and 1,225/1,225 tests; vue-tsc/Vite production build passes; and
  authenticated F8k-direct-chart-style passes 1/1 across all four styles.
  The protected application-shell Help screenshot still differs by exactly
  50,941 pixels (3.0%), exceeding its unchanged 0.5% threshold. This is the
  same visible-help-state delta as before HLC was added; no baseline or visual
  acceptance setting was changed. Generic integration, broader R1/R5/R6 and
  AC4-AC7 evidence, exact V25 review, and staging-gated provider/ETF consumer
  work remain open.
  Direct remote refs refreshed 2026-10-06: TC 86eff36ac859a5c2d25cd28520ddfb422008ea5c,
  staging 8b885a2ffd9cbb8b20c626e2c0381d3fce5cdc35, provider platform
  88132e9145a08d1c935a0111b3dba0fbd88bdff1, and ETF holdings
  2bd221663956581dfb35f5b77961900674449f23. Both upstream dependencies remain
  outside staging; defer R2/R3 consumption and shared-path reconciliation.
  At pushed product commit c0a2100cd0741e933382a6f72a0237ba8f495bda, Study Lab's
  existing universe-source input now offers canonical saved-source suggestions
  labelled by source kind, while preserving arbitrary/unavailable configured
  IDs and the explicit-symbol fallback contract. StudyLabTool passed 48/48;
  exact-source full frontend Vitest passed 129 files/1212 tests; type-check and
  production build passed; pinned authenticated F9g passed 1/1. This is one
  bounded R1/R5 usability improvement, not closure of those criteria.
  The browser proved the suggestions populated through Study Lab's existing
  workstation source store; it did not test exact V25 styling or canonical
  provider/ETF data readiness.
  Direct remote refs refreshed 2026-10-06: TC c0a2100cd0741e933382a6f72a0237ba8f495bda,
  staging 8b885a2ffd9cbb8b20c626e2c0381d3fce5cdc35, provider platform
  88132e9145a08d1c935a0111b3dba0fbd88bdff1, and ETF holdings
  2bd221663956581dfb35f5b77961900674449f23. Both upstream dependencies remain
  outside staging, so R2/R3 consumption and shared-path reconciliation remain
  correctly deferred.
  At pushed product commit a1b49aeaebef1bcd481223ce5b6c70f07070eabf, dense
  Market Map member selection now has a persistent polite screen-reader status
  announcing selected ticker symbols (up to five, then a remaining count) while
  leaving the visible selection control unchanged. The focused MarketMapTool
  suite passed 57/57; full serial frontend Vitest passed 129 files/1211 tests;
  production type-check/build passed; the pinned authenticated 10,000-cell map
  interaction case passed 1/1 in 17.3 seconds. Browser source was mounted
  read-only and the assigned stack was not rebuilt/restarted. This adds one
  concrete AC7 accessibility receipt but does not close broader accessibility,
  V25, integration, or upstream-consumption requirements.
  At branch checkpoint d6bd60d15f22b630b9f661fb566837d0c1110674, the exact
  current backend sources passed the complete combined unit/integration
  coverage gate using Python 3.12 sys.monitoring: units 1622/1622, integration
  409/409, total app coverage 82.26% (above the 75% threshold). Testcontainers
  left no labeled containers; all six assigned services and four worktree
  volumes remained intact. This supersedes the earlier instrumented retry
  that exited 152 without a summary. The split diagnostic's isolated
  ETF-owned test-order failure remains documented, but the full ordered suite
  passes and TC must not alter ETF-owned behavior.
  At product source f0e946000e15336d972f33f24520d72b06e5cf7e, the latest
  unchanged pinned Playwright 1.62.1 seeded functional run against the assigned
  stack passed 175/177 with two documented skips and zero failures (18.1
  minutes). This supersedes the earlier 171/177 run with four intermittent
  failures, all of which passed isolated replay. Two subsequent full retries
  each had one different transient failure: F8s timed out in its login hook in
  one run and passed 1/1 isolated and in the later clean full run; F8k briefly
  had a null plot bounding box in another run and passed 3/3 with its adjacent
  Ctrl+wheel cases and in the later clean full run. No source, test, assertion,
  or browser configuration changed. The final full seeded run is the current
  functional receipt; keep the transient diagnostics as history and do not
  weaken acceptance. The four-profile visual matrix in the pinned
  Playwright 1.62.1 Noble image now passes 104/104 after ten deterministic
  local screenshots were refreshed to match the current product state asserted
  before capture: workspace-floating across four profiles, Study
  structured-result across four, and Study sandbox-error at two 1080p scales.
  The prior captures were stale/inconsistent with the seeded state (including
  five populated floating-window rows, current structured promotion controls,
  and the current sandbox lookback default). This is a local deterministic
  product-state oracle only, not exact V25 visual approval; REF-SHELL-V25 and
  REF-STUDY-LAB-V25 gaps remain open. No test assertion, reference-board source,
  mask, threshold, skip, or acceptance policy changed. A host-browser attempt
  produced broad text-only drift because Arial resolved to Nimbus Sans; the
  pinned Noble image is the canonical local visual environment. The refreshed
  full matrix passed against the assigned stack. Functional and earlier visual
  runs used the isolated tc2000-val-d6bd60 Compose project. Exact-project
  cleanup removed its six containers, four fixture volumes, network, and four
  generated images; the assigned six-service stack and four volumes remain
  intact. The
  repository's generic integration target remains open: Docker Buildx is
  unavailable and its cleanup trap targets the assigned stack, so do not invoke
  it directly. The current scoped migration check correctly skipped because no
  migrations changed; backend Ruff/check-format, frontend TypeScript, Compose
  contract, and no-provider-change probe checks pass. Isolated research-runner
  sandbox/resource probes passed at checkpoint 8e6a818: all expected denials,
  resource limits, and bounded concurrent-pressure containment were observed
  with zero restarts. The exact disposable project was removed. The assigned
  six-service stack was subsequently confirmed healthy through the approved
  host context; ordinary sandbox access to the Docker socket remains denied.
  At product source f0e946, the current workstation performance file also
  passes 4/4 with the 10,000-row fixture seeded at backend startup and
  50-round multi-window churn. It ran on an isolated Compose project; exact
  cleanup removed its four containers, four volumes, network, and two local
  images while preserving the assigned six-service stack. An earlier assigned
  stack attempt passed the first three checks but observed zero large-universe
  rows because the startup-only fixture flag was set only in the browser
  process; this setup diagnostic is superseded by the correctly seeded 4/4
  run and is not a product failure.
  A separate authenticated Chromium test now supplies 10,000 deterministic
  cells through the existing Market Map consumer contract and passes pointer
  hit-testing, keyboard search/selection, 125% zoom, and drag-pan; its painted
  canvas satisfies an explicit 5-second budget (focused test 1/1, total 8.9s).
  This proves frontend scale/interaction only, not canonical data readiness or
  native windows. Direct remote refs refreshed 2026-10-06: staging remains
  8b885a2f, provider remains 88132e91, and ETF remains 2bd22166; neither
  upstream dependency is in staging.
  Provider and ETF branches remain outside staging, so R2/R3 consumption and
  shared-path reconciliation are deferred.
  At pushed product commit 326a96bf0c7531356fae0db441405c1a951da8ac, Market
  Map clears a selected Boolean Python output and its stale run when Python is
  selected as the numeric tile-area metric; the user receives a polite prompt
  to select a series output. Focused MarketMapTool tests passed 58/58, the
  full frontend suite passed 129 files / 1,213 tests, type-check/build passed.
  The authenticated pinned Playwright flow F8s-market-map-python-output passed
  1/1 against a loopback Vite proxy and the assigned backend, with source
  read-only. The CLI wrapper initially stalled before browser startup; the
  repository's pinned Playwright runner then supplied the browser evidence.
  The generic exact integration gate and all other full-profile coverage remain
  open.
  At pushed product commit 0984717a9514d745908899e25ea9a7212638be09, global
  workstation and focused watchlist symbol traversal match the current TC2000 V25
  shortcut reference: Space advances and Ctrl+Space reverses; Shift+Space is not
  a traversal command. Focused watchlist Ctrl+Space does not toggle multi-select.
  Focused UI tests passed 117/117, the authenticated F8k-ctrl-space browser flow
  passed 1/1, type-check/production build passed, and the pinned single-profile
  keyboard-help visual test passed 1/1. A full Vitest run produced no test summary
  and was stopped after the constrained host became unresponsive; do not claim a
  full-suite pass at this tip. The generic integration gate, exact V25 visual
  review, broader criteria, and staging-dependent upstream consumption remain open.
  At pushed product commit c61246cca261f8dc33d88690c5f411983a8440c1, the
  workstation now implements the current V25 Backspace viewed-symbol history
  shortcut using a persisted 50-entry history that preserves repeated visits,
  walks backward without wrapping, and truncates the future branch on a new
  selection. Editor Backspace remains native. Focused store/workstation/watchlist
  tests passed 120/120, pinned authenticated F8k-backspace passed 1/1, Help
  visual coverage passed 4/4 pinned viewport profiles, and type-check/build
  passed. The complete frontend suite and generic integration gate remain open.
  At product commit a37ae3217, TC2000's official `[` / `]` one-bar and
  Shift+bracket five-bar chart navigation now uses the existing viewport
  logic. Workspace tool activation is reactive, and only the active chart
  installs keyboard handling. Pinned F8k-chart-brackets and F8k-help passed
  2/2; all four unchanged Help screenshot profiles passed; Vue type-check and
  production build passed. Scope/self-tests and final workstream validation
  passed. Full frontend coverage, generic integration, broader R1/R5/R6 and AC7,
  exact V25 review, and staging-gated provider/ETF consumer work remain open.
