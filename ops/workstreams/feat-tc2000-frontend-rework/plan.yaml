upstream_consumer_contracts:
  market_data:
    source_of_truth: feat/market-data-provider-platform
    preflight_statuses: [full, partial, deferred, stale-blocked, provider-unavailable, empty]
    tc_rules:
      - Preserve upstream status, provider/capability/entitlement evidence, coverage, and freshness.
      - Do not select providers, probe providers, retry, repair, or enqueue ingestion from TC read paths.
      - Treat only explicitly sufficient upstream coverage plus TC analytic requirements as analysis-ready; expose partial/deferred/stale/unavailable/empty distinctly.
  etf_holdings:
    source_of_truth: feat/etf-holdings-constituents
    availability: [current, degraded, stale, unavailable, not_applicable, unknown]
    tc_rules:
      - Preserve usable_for_current_analysis as the upstream eligibility authority.
      - displayable_last_known permits labelled last-known display only, never current analysis.
      - Preserve source tier, provider, composition/published/freshness dates, completeness, identity, and failure/audit metadata.
      - Do not implement adapters, provider probes, refresh routes/workers, or constituent resolution in TC.
