known_semantic_findings:
  - path: backend/app/services/etf_holdings_adapters.py
    disposition: upstream_transfer_required
    evidence: >-
      TC history modifies this ETF-owned provider adapter in 93 commits since
      staging. In particular, bb70fff14 and b375a4782 add dated-source behavior.
      Preserve history; reconcile the adapter implementation with the ETF owner
      after its branch reaches staging rather than continue provider/adapter work in TC.
  - path: backend/tests/unit/services/test_etf_holdings_adapters.py
    disposition: upstream_transfer_required
    evidence: Tests for the same ETF-owned adapter behavior; reconcile with the ETF owner after staging.
  - path: backend/app/services/etf_holdings_sec.py
    disposition: upstream_transfer_required
    evidence: >-
      Not committed in the measured branch intersection. An uncommitted parser
      investigation found the QQQE SEC N-PORT Dreyfus row: Item C.4 identifies
      DGCXX as a short-term investment vehicle and Item C.1 identifies a
      registered fund. Reported pctVal 0.8313234437 percent normalizes to
      0.008313234437. The focused exploratory parser suite passed 9/9. No parser
      fix is retained in TC; ETF-domain owner handoff/acceptance is required and
      has not yet been sent or acknowledged.
integration_order:
  - step: provider_platform
    rule: Promote feat/market-data-provider-platform through the staging coordinator; TC does not merge it directly.
  - step: etf_holdings
    rule: After provider-platform is in staging, promote feat/etf-holdings-constituents through the coordinator.
  - step: tc_consumer
    rule: Synchronize TC from the resulting staging tip through the prescribed workflow, review semantic conflicts, then run the exact-tip TC gate.
  - step: review_boundary
    rule: Stop TC at ready_for_human_review; no direct branch merge, deployment, or other-worktree mutation.
contract_ownership:
  provider_platform:
    owns: [instrument_identity, listings, ohlcv, provider_capability, entitlements, health, evaluator_preflight, generic_coverage_state, refresh_dispatch]
    tc_consumes: [status, source_or_provider_evidence, capability, coverage, freshness, eligibility]
    tc_must_not: [provider_selection, credential_management, live_provider_probes, retry_or_repair, generic_ingestion, refresh_workers]
  etf_holdings:
    owns: [etf_adapter_registry, holdings_acquisition, constituent_resolution, holdings_refresh, holdings_audit, holdings_capability]
    tc_consumes: [availability, usable_for_current_analysis, displayable_last_known, source_tier, provider, dates, completeness, failure_reason, audit_lineage]
    tc_must_not: [etf_provider_adapter, provider_probe, holdings_refresh_worker, constituent_resolution]
  tc:
    owns: [workstation_ui, visual_parity, tc_readiness_composition, market_map_and_breadth_consumers, python_dsl, study, strategy, compatible_artifact_promotion, tc_user_workflows]
    exclusion_rule: "TC composite readiness is derived only from explicit upstream evidence plus TC analytic requirements; stale displayable holdings are never current analysis input."
