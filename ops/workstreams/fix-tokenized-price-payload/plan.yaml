closure_summary: >-
  Production tokenized quote refresh. Since 2026-11-20 07:15Z every quarter-hour
  scheduled_tokenized_asset_refresh failed with PendingRollbackError: the gate_tradfi order-book quote kept
  Decimal values in its raw payload, the JSON observation/snapshot flush raised TypeError, the shared session
  was left in a failed transaction, and the batch cursor never advanced past that asset, so no tokenized quote
  could be refreshed again. Fix: the Gate quote keeps provider-style decimal strings; upsert_tokenized_asset
  stores a JSON-safe copy of any payload (Decimal to string, datetime to ISO); each asset's persistence runs in
  its own savepoint so one failure is recorded and the batch, commit and cursor proceed; batch values are read
  before the loop because a rolled-back savepoint expires ORM rows that an async session cannot lazy-load.
  Regressions: a real-PostgreSQL test reproduces the production PendingRollbackError on the old code and passes
  on the fix; unit tests cover the Gate payload and both service paths. Unit 865 pass; Ruff clean.
  Requires integration_capture: exact branch HEAD.
