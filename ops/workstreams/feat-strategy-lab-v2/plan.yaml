  - >-
      `conformance_fixtures.py` now exposes an executable
      `execute_conformance_suite(...)` boundary. It invokes every required
      fixture through an injected engine runner, canonicalizes observed output,
      reduces runner exceptions to deterministic failed evidence, and returns
      the fixture suite, engine evidence, and gated report as one identity-bound
      resolution. Authoritative local simulation requires a valid exact isolated
