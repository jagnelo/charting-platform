local_validation_reason: >-
  The final branch changes backend APIs, additive persistence, Redis-backed workers,
  content-addressed artifacts, and isolated Nautilus runtime services. The initial
  parallel-safe core can use unit validation, but branch completion changes the
  Compose stack and requires the repository's full-stack browser profile plus
  Docker-backed PostgreSQL/Redis, migration, worker, and backend API gates.
