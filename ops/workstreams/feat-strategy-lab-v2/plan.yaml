  - The package-owned restricted strategy invocation runner now binds source digests, repeats static preflight (including aliased wall-clock, module-introspection, and private import-form rejection), exposes only a vetted SDK/import surface, validates typed intents, and exposes a strict versioned canonical JSON request/result protocol (duplicate-field and non-finite-number rejection) plus atomic CLI output; worker image/entrypoint wiring, container activation, and application scheduling remain open.
  - PostgreSQL forward-state persistence semantics are now implemented in a registration-neutral additive adapter with owner-scoped instance checkpoints, deterministic authenticated instance listing, one-time warm-up receipts, content-addressed seen-event identities, authenticated compare-and-set transitions, and restart-safe duplicate/gap/out-of-order/correction accounting; the application adapter now exposes owner-normalized instance registration, transitions, warm-up completion, event/correction transaction methods, and live-state reads, while the API projects the restart-safe checkpoint. The engine-neutral `forward_account.py` contract now covers append-only shadow orders, fills, positions, and multi-currency cash transitions; account-state persistence, migrations, event-stream wiring, worker execution, and provider authorization remain open.
  - PostgreSQL shadow-account persistence now stores authenticated owner/instance state snapshots with deterministic canonical payloads, exact initialization replay, and typed load/apply outcomes. The application persistence bundle exposes initialize/load/apply account methods, and the additive migration creates the account table; event-stream admission, worker authorization/capacity binding, provider authorization, and Nautilus execution remain open.
  - >-
