  - PostgreSQL snapshot-coverage persistence now stores owner-scoped verified/rejected coverage resolutions with authenticated per-series reports, missing/unexpected digests, deterministic listing, exact replay, and changed-resolution conflicts; provider fetch/repair, snapshot creation, migrations, and application wiring remain open.
  - PostgreSQL execution-summary persistence now stores owner-scoped append-only status projections keyed by submission/attempt state identity with authenticated outcome/progress fields, latest-attempt reads, deterministic history, exact replay, and changed-checkpoint conflicts; submission/outcome wiring, result publication, migrations, authorization, and application integration remain open.
  - PostgreSQL result-completion persistence now resolves terminal runtime/outcome/progress/publication evidence with artifact publication plans in one locked transaction, inserting all new artifact commits and the completion receipt atomically; exact retries replay and artifact conflicts leave both ledgers unchanged. The application bridge now delegates accepted plans to this boundary after owner-scoped registration; artifact bytes, migrations, authorization, and worker activation remain open.
  - PostgreSQL result-publication persistence now stores owner-scoped immutable publish/replay/reject plans with authenticated plan fingerprints, attempt/result/reproduction/build identities, deterministic reason lists, exact retries, and separate audit evidence for changed decisions; the application bridge registers these plans before completion and retains rejected plans as evidence. Publication bytes, migrations, authorization, and worker activation remain open.
  - PostgreSQL runtime-execution persistence now stores owner-scoped accepted runtime state and immutable sandbox update receipts with authenticated fingerprints, exact sequence replay, monotonic compare-and-set transitions, and atomic running/terminal materialization; process execution, artifact publication integration, migrations, authorization, and application wiring remain open.
  - PostgreSQL result-manifest persistence now retains owner-scoped canonical `RunResultManifest` payload projections with authenticated payload/record fingerprints, single-attempt binding, exact retries, changed-content conflicts, pure materialization gating, and full typed rehydration through an allowlisted contracts/capabilities/rebalance canonical decoder. Rehydration also requires byte-for-byte canonical serialization, so reordered fields, malformed nested tags, or contract drift fail closed; artifact projections consume the validated manifest. The dedicated worker terminal callback now idempotently registers the successful manifest before completion publication; scheduled artifact cleanup, migrations, authorization, and full application wiring remain open.
  - PostgreSQL runtime-receipt persistence now stores owner-scoped canonical strategy-runtime request and isolation-preflight projections with independently authenticated payload/record fingerprints, exact retries, same-attempt/request conflict handling, and preserved rejection reasons. Typed `StrategyRuntimePreflight` reads now reuse the allowlisted contracts/runtime decoder, require canonical payload bytes, and verify request/profile/isolation/decision/rejection identities before returning admission evidence; process execution, migrations, authorization, and application wiring remain open.
  - PostgreSQL metric-set persistence now stores owner-scoped canonical metric-set payloads and value-summary projections with authenticated payload/record fingerprints, deterministic reads, exact retries, and same-attempt conflict handling. Typed `MetricSet` reads now reuse the allowlisted canonical decoder, require byte-for-byte canonical payloads, and verify every persisted identity, lineage, creation-time, and value-summary projection before returning contracts; the API persistence bundle projects `metric-sets` from those typed reads rather than raw summaries. The dedicated worker terminal callback now idempotently persists the result manifest's immutable MetricSet after successful completion before final summary/capacity settlement; metric calculation, migrations, authorization, and full application wiring remain open.
