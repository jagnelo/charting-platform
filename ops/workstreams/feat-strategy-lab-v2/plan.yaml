  - >-
      `conformance.py` now binds a `NautilusReleasePin` to conformance evidence,
      recording the exact v2 package/tag, source and runtime-image digests,
      Python/Rust versions, and legacy-runtime isolation. Complete stable or
      release-candidate fixture evidence with a valid isolated pin can become
      authoritative for local simulation; full scope additionally requires
      event-tape parity.
  - >-
      `resource_mutations.py` and the registration-neutral API router now expose
      strict idempotent creation for mutable Strategy Lab resources. Exact
      retries replay the existing resource receipt, changed content conflicts,
      rejected preconditions are typed, and artifact/metric-set creation stays
      read-only. Domain persistence and result-publication policy remain
      application-owned integration gates.
  - >-
      `PostgresStrategyLabV2Adapter.create_resource()` now supplies the first
      application-owned durable bridge for that generic mutation boundary. It
      maps the resource envelope onto the shared compare-and-set aggregate
      store, binds storage request identity to owner/resource/idempotency
      content, persists the mutation fingerprint and accepted timestamp for
      restart-safe receipt replay, and rejects foreign-owner or colliding
      aggregates without disclosing their documents. Domain-specific resource
      validation, outbox publication, and result policy remain separate gates.
  - >-
      `resource_domains.py` now decodes strategy, package, portfolio,
      experiment, attempt, snapshot, trial, metric-set, and forward-instance
      resource attributes into the immutable `StrategyVersion`,
      `StrategyPackage`, `PortfolioComposition`, `ExperimentDefinition`,
      `RunAttempt`, `DataSnapshot`, `ScientificTrial`, `MetricSet`, and
      `ForwardInstance` contracts before
      persistence. Source/archive/dependency digests, exact dependency
      versions, entrypoint/runtime ABI, frozen parameter maps, exact decimal
      capital/weights, component strategy links, shared risk models, calendar
      rebalance policy, seed/engine identity, lifecycle state/timestamps,
      capability preflight decisions, coverage evidence, series content,
      unknown fields, and API ID aliases are validated deterministically; the
      normalized domain fingerprint is projected in resource metadata.
      Remaining generic resource domain adapters are separate follow-up gates.
  - >-
      `worker_terminal_adapter.py` now requires the application-owned metrics
      adapter and persists the successful `RunResultManifest.metric_set` after
      result completion, before execution summary and worker-capacity release.
      Metric persistence is idempotent and retry-safe; a persistence failure
      leaves the Redis entry pending and cannot acknowledge a partially
      published metric result.
  - >-
      The dedicated terminal callback now also registers the successful
      `RunResultManifest` through the shared result-materialization adapter
      before result completion. Manifest persistence is owner-scoped,
      attempt-bound, immutable, and replay-safe; failures leave the transport
      entry pending and cannot acknowledge an unregistered result.
  - >-
      The dedicated terminal callback now re-registers the authenticated
      owner-scoped result-publication plan before invoking atomic result
      completion. Exact retries replay the immutable plan, rejected plans
      remain audit evidence and cannot complete, and publication registration
      is explicitly separate from the completion/artifact transaction.
  - >-
      Forward instances now require an immutable, instance-keyed execution-plan
      resource before warm-up activation. Each component binds the exact
      strategy and package fingerprints, frozen parameters, and random seed;
      owner-scoped application validation checks the instance, portfolio,
      strategy, and package links, and the runtime resolver verifies source
      archive bytes and SDK manifests before returning all component recipes.
      Persistent runtime integration and checkpoint-bound market-history
      resolution remain open.
