roadmap_acceptance_criteria:
  - id: AC-DOMAIN
    text: >-
      Immutable, typed, versioned public contracts distinguish strategy versions,
      packages, portfolio compositions, data snapshots, experiments, trials,
      run attempts, artifact manifests, metric sets, and forward instances;
      execution retries create attempts against the same immutable trial.
  - id: AC-SDK
    text: >-
      Strategy code uses a versioned engine-neutral SDK, declares all data/model/
      library dependencies, receives only frozen declared inputs, emits typed
      order or target-position intents, and cannot access providers, network,
      database, secrets, arbitrary files, or wall-clock time.
  - id: AC-DATA
    text: >-
      Preflight represents support by asset/product, event granularity,
      timeframe/history, adjustment/corporate-action semantics, session/feed,
      and execution/account model. Missing rigorous requirements fail closed;
      explicitly requested degraded trials are separately labelled with all
      substitutions and excluded from rigorous rankings by default.
  - id: AC-REPRODUCIBILITY
    text: >-
      Data is acquired through the shared platform before execution, verified,
      frozen as a content-addressed snapshot, and never fetched inside the
      simulator. A result manifest identifies strategy, portfolio, data,
      capability contract, engine/build, dependency catalog, assumptions, seed,
      and metric version sufficiently to reproduce the run.
  - id: AC-SEARCH
    text: >-
      Deterministic grid, seeded random/Latin-hypercube, scenario-matrix, and
      walk-forward trials are resumable and cancellable; walk-forward selection
      uses training data only, supports rolling/anchored windows and gap/embargo,
      freezes OOS evaluation, and aggregates OOS results only.
  - id: AC-PORTFOLIO
    text: >-
      A trial simulates all instruments and strategies together in one shared
      account. Immutable portfolio composition defines capital budgets, weights,
      rebalancing, priority/contention, shared risk, and component attribution;
      supported order intents are routed through platform allocation/risk before
      the engine and unsupported capability combinations fail preflight.
  - id: AC-METRICS
    text: >-
      Official results use native simulator orders, fills, positions, accounts,
      and equity. Versioned metrics cover return/P&L, risk/drawdown, risk-adjusted
      performance, trade quality, exposure/capital, execution costs, attribution,
      rolling series, distributions, sensitivity, and calendar periods. Every
      metric records units, calculation version, annualization/calendar basis,
      gross/net basis, sample size, and null reason; no profitability verdict is
      issued.
  - id: AC-ARTIFACTS
    text: >-
      PostgreSQL stores authoritative metadata/state/lineage/leases/compact
      metrics; Redis is dispatch/event transport only and is reconciled through a
      transactional outbox. Large inputs and outputs use immutable compressed
      content-addressed Parquet/Arrow artifacts with deduplication, pins, and
      tiered retention; manifests and metric summaries are retained permanently.
  - id: AC-WORKERS
    text: >-
      Backtests run in isolated, serial Nautilus worker processes scalable as
      Compose replicas. Forward workers have separately reserved capacity and
      obey one concurrent Nautilus node per process. Lease expiry, heartbeat,
      cancellation, crash recovery, idempotency, engine disposal, and artifact
      atomicity are covered; no Nautilus job runs in FastAPI or the general ARQ
      worker.
  - id: AC-NAUTILUS
    text: >-
      An exact-pinned stable or release-candidate Nautilus v2 build passes the
      four backtest checks for multi-instrument accounting, native
      order/fill/cost reports, deterministic replay, and engine lifecycle
      before it can publish authoritative local backtests. Every result records
      exact engine version/channel, wheel/image digests, conformance
      fingerprints, execution scope, and plan fingerprint. Forward-shadow
      execution additionally requires event-tape parity, completing the five
      checks required for full broker-free simulation; stable release labeling
      is not a gate. Pre-releases never control real capital or connect to a
      broker.
      The platform owns a Rust data adapter for canonical forward events;
      provider adapters are not used as a second data source.
  - id: AC-FORWARD
    text: >-
      Persistent broker-free shadow instances use immutable historical warm-up
      followed only by new canonical events; activation declares flat start or
      synthetic carry-in. Before warm-up, an owner-scoped immutable execution
      plan pins the exact strategy version/package, parameters, and random seed
      for every portfolio component; activation fails closed when any binding is
      missing or inconsistent. Orders, positions, cash, metrics, and events
      survive restart; duplicate, missing, late, corrected, stale, and
      out-of-order data are observable, and corrections create separately
      identified counterfactual replay without rewriting prior decisions.
  - id: AC-API
    text: >-
      Versioned REST APIs under /api/v1/strategy-lab/v2 support strategy/package
      validation, portfolios, capability preflight, snapshots, experiments,
      trials, attempts, metrics/artifacts, and forward instances with
      Idempotency-Key, 202 submissions, resumable progress, cursor pagination,
      and stable typed errors. Existing routes remain available during migration.
  - id: AC-LEGACY
    text: >-
      Legacy definitions and results remain inspectable. Explicit import returns
      a conversion/compatibility report for supported definitions, preserves
      original records, and makes no replay-equivalence claim.
  - id: AC-SECURITY
    text: >-
      Trusted local Python strategies and custom metrics execute in constrained
      isolated containers with no network, read-only root, dropped capabilities,
      resource/time/output limits, vetted pinned libraries, and no runtime
      secrets; malformed or escaping code is rejected by adversarial tests.
  - id: AC-COMPOSE
    text: >-
      The local Compose deployment uses existing PostgreSQL and Redis, separate
      simulation worker services, and bind-mountable content-addressed artifact
      storage. Single-host replicas scale independently; no cloud execution,
      Kubernetes, Kafka, MinIO, broker order route, or external testing service
      is required.
  - id: AC-UPSTREAM
    text: >-
      Provider-platform, ETF, and TC2000 dependencies are consumed only after
      their approved work reaches staging. Every overlapping path and contract
      receives line-level semantic reconciliation before shared-path changes;
      no other worktree is mutated and no branch is directly merged.
  - id: AC-UI-BOUNDARY
    text: >-
      Backend APIs and saved object identities support the later dockable
      TC2000-native Strategy Library/Builder, Experiment Designer, Run Queue,
      Results/Compare, Portfolio Composer, and Forward Monitor. Frontend product
      implementation remains a separate branch and authorization.
  - id: AC-VALIDATION
    text: >-
      Focused deterministic tests, database/Redis integration, migration
      compatibility, worker restart/retry/cancel, artifact integrity, API
      contracts, exact-pinned Nautilus v2 conformance, security/resource isolation,
      Compose scaling, and full exact-tip branch validation pass. Deployment,
      live shadow activation, human closure, integration, and promotion remain
      separately authorized.
branch_tests:
  - cd backend && uv run pytest app/strategy_lab_v2/tests -q --override-ini addopts=
  - uv run --project backend pytest backend/tests/unit/strategy_lab_v2/test_schema_migration.py -q --override-ini addopts=
  - cd backend && uv run ruff check app/strategy_lab_v2
  - cd backend && uv run mypy app/strategy_lab_v2 strategy_runtime
  - git diff --check
  - uv run --project backend python scripts/validate-workstream.py ops/workstreams
branch_tests_reason: >-
  The active provider workstream owns backend/tests, so v2-focused tests stay
  beside the new package and use an explicit pytest path. The executable branch
  checks cover the implemented engine-neutral package and durable workstream
  records; database/migration, PostgreSQL/Redis, isolated runtime, Nautilus,
  worker, API, Compose, and full exact-tip integration commands remain deferred
  until their shared-path gates are open.
live_test_impact: >-
  No real broker, broker paper account, or external test service is used. Forward
  validation consumes platform canonical events; activating a long-running
  deployed shadow instance is a separate human-authorized operational gate.
migration_impact: >-
  Additive Strategy Lab v2 tables and indexes only. Preserve current Strategy Lab
  rows and routes; do not rewrite historical results or claim replay parity.
deployment_impact: >-
  Add local Compose backtest/forward worker services and a persistent artifact
  volume with conservative defaults. No deployment, worker activation against
  real data, provider secret distribution, or broker connectivity is authorized.
