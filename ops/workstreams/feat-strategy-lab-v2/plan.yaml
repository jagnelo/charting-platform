  - Atomic PostgreSQL forward event/correction staging now persists counterfactual replay plans with the admitted event checkpoint in one transaction; exact retries return the stored replay identity, while malformed or contradictory replay rows fail closed. `PostgresForwardEventDispatchAdapter` now stages authenticated event payload bytes, forward dispatch identities, and the shared outbox over that checkpoint transaction, with owner/event/request uniqueness and typed second-dispatch conflicts. The authenticated forward handoff and bounded `ForwardEventWorkerService` bind Redis acknowledgement to a host-owned durable receipt. Worker authorization/capacity binding, event-stream activation, and scope-bound authoritative Nautilus v2 execution remain open.
