  - PostgreSQL result-manifest persistence now retains owner-scoped canonical `RunResultManifest` payload projections with authenticated payload/record fingerprints, single-attempt binding, exact retries, changed-content conflicts, pure materialization gating, and full typed rehydration through an allowlisted contracts/capabilities/rebalance canonical decoder. Rehydration also requires byte-for-byte canonical serialization, so reordered fields, malformed nested tags, or contract drift fail closed; artifact projections consume the validated manifest. The dedicated worker terminal callback now idempotently registers the successful manifest before completion publication; scheduled artifact cleanup, migrations, authorization, and full application wiring remain open.
  - PostgreSQL runtime-receipt persistence now stores owner-scoped canonical strategy-runtime request and isolation-preflight projections with independently authenticated payload/record fingerprints, exact retries, same-attempt/request conflict handling, and preserved rejection reasons. Typed `StrategyRuntimePreflight` reads now reuse the allowlisted contracts/runtime decoder, require canonical payload bytes, and verify request/profile/isolation/decision/rejection identities before returning admission evidence; process execution, migrations, authorization, and application wiring remain open.
  - PostgreSQL metric-set persistence now stores owner-scoped canonical metric-set payloads and value-summary projections with authenticated payload/record fingerprints, deterministic reads, exact retries, and same-attempt conflict handling. Typed `MetricSet` reads now reuse the allowlisted canonical decoder, require byte-for-byte canonical payloads, and verify every persisted identity, lineage, creation-time, and value-summary projection before returning contracts; the API persistence bundle projects `metric-sets` from those typed reads rather than raw summaries. The dedicated worker terminal callback now idempotently persists the result manifest's immutable MetricSet after successful completion before final summary/capacity settlement; metric calculation, migrations, authorization, and full application wiring remain open.
  - Execution and audit event contracts now normalize aware occurrence timestamps to UTC before identity and append/replay comparison, preventing offset-only retries from becoming false content conflicts; persistence, transport, and application wiring remain open.
  - Artifact manifests and integrity receipts now reject untyped lengths/retention values and forged verified mismatches, while canonicalizing failure evidence before publication; guarded retention-authorized byte collection and commit-ledger-based orphan cleanup are implemented, while migrations, authorization, and application wiring remain open.
  - A restricted custom-metric boundary now executes source-bound callables over frozen Decimal observations, emits versioned typed metrics with input evidence, and strips exception text; container worker activation and API/persistence wiring remain open.
  - Custom-metric execution now has a strict tagged-JSON request/result protocol and mounted-file CLI with duplicate-field rejection, source/definition identity, result fingerprints, and atomic typed-result publication; worker image activation, persistence, API wiring, and scheduling remain open.
  - Custom-metric entrypoint validation now rejects non-string declarations and resolves dotted callable paths through the restricted namespace; wire-helper exports are lazy to preserve package import safety.
  - Custom metrics now support immutable uniquely fingerprinted ordered batches, strict batch request/result envelopes, and a batch CLI mode for deterministic metric sweeps; container worker activation and application wiring remain open.
  - Strategy runtime batch requests now reject duplicate or out-of-order `(event_time, event_sequence)` contexts during serialization, decoding, and direct execution before strategy invocation; worker image activation, persistence, and application wiring remain open.
  - REST cursor decoding now rejects duplicate object fields and non-finite JSON constants before checksum or snapshot validation; cursor checksums remain integrity aids rather than authentication, and route ownership checks remain open.
  - REST resource serialization now canonicalizes dates, normalizes aware timestamps to UTC, preserves Decimal values as exact strings, and rejects non-finite or unsupported scalar values before JSON publication; application registration and authentication remain open.
  - REST request metadata now rejects control characters in request IDs and idempotency keys before response headers or durable identity calculations; authentication, persistence, and application registration remain open.
  - REST POST routes now reparse raw JSON bodies with duplicate-field and non-finite-value rejection before strategy validation, submission idempotency, or command dispatch; application registration and authentication remain open.
  - Cursor-paginated collection responses now reject adapter snapshot drift against the incoming cursor, preserving snapshot-bound page traversal; persistence and application registration remain open.
  - Strategy-validation request metadata failures now return typed 400 errors rather than escaping as unstructured exceptions; authentication and application registration remain open.
  - Restricted strategy-runtime wire decoders and both mounted strategy/custom-metric CLIs now reject request files larger than 16 MiB before unbounded text decoding; mounted worker activation and application wiring remain open.
  - Sandbox process-start failures now use versioned exception-type evidence instead of host-specific OS error text, preserving deterministic run identities; worker activation and application wiring remain open.
  - Forward admission now validates observation structure and cursor/disposition semantics against live state, and content-checks buffered event retries before mutation; persistence and event-stream wiring remain open.
  - Strategy and custom-metric single/batch serializers now enforce the 16 MiB wire bound before emitting request or result envelopes; worker activation and application wiring remain open.
  - Canonical forward event and cursor timestamps now normalize aware offsets to UTC before comparison and fingerprinting; persistence migration and event-stream wiring remain open.
  - Forward instance lifecycle, warm-up receipt, correction-command, and counterfactual replay-plan timestamps now normalize aware offsets to UTC before identity checks; persistence migration, event-stream wiring, and worker/application wiring remain open.
  - Asynchronous submission, admission, runtime, outcome, progress, command, authorization, and execution-summary timestamps now normalize aware offsets to UTC before identity checks; application persistence and worker wiring remain open.
  - Run-attempt and worker-lease lifecycle timestamps now normalize aware offsets to UTC before transition, capacity, and retry-lineage identity checks; application persistence and worker wiring remain open.
  - PostgreSQL execution-event transaction persistence now exposes authenticated outbox loading and compare-and-set publication acknowledgement; `outbox_application.py` relays available messages to Redis with idempotent replay and leaves failed acknowledgements pending for retry. `redis_application.py` now exposes the bounded scheduler factory, and the dedicated worker lifecycle runs/cancels that scheduler beside the Redis pump when the persistence/runtime surfaces are available. Redis production client lifecycle, migration startup, and runtime activation remain open.
  - PostgreSQL submission/dispatch staging now atomically creates or repairs an owner-derived message in the shared execution outbox alongside the owner-scoped receipt and dispatch intent, preserving idempotent retry and making API submissions visible to the Redis relay; worker payload materialization and runtime execution remain open.
  - >-
      `OutboxRelayScheduler` now provides bounded periodic relay cycles with
      finite interval/batch validation, injected clock/sleep controls, and
      explicit cancellation; Redis client construction, process lifecycle,
      migration startup, worker entrypoints, and runtime activation remain
      open.
  - >-
      `redis_application.py` now owns explicit local Redis client construction
      and idempotent closure, forces text-decoding responses, and composes the
      outbox relay and bounded worker-pump transports. Health checks, worker
      process/task lifecycle, migration startup, and runtime activation remain
      caller-owned.
  - >-
      `dispatch_payload.py` and the additive `ff1a2b3c4d5e` migration retain
      canonical, content-addressed submission payload bytes separately from
      Redis. Submission receipt, dispatch intent, payload record, and outbox
      row are staged atomically; workers can resolve and re-authenticate a
      payload by digest before invoking a materialized handler. Missing or
      malformed payloads remain unacknowledged for retry/poison handling.
  - >-
      `artifact_store.py` now verifies manifest-bound bytes before evaluating
      an explicit PostgreSQL retention resolution and deletes only
      tier/expiry-eligible, unpinned content addresses with directory fsync.
      Missing bytes are idempotent, retained bytes are reported without
      mutation, and manifest/digest drift or corruption fails closed.
      `LocalArtifactRetentionService` and the shared persistence bundle wire
      this lifecycle to the existing retention adapter. The cleanup service
      reconciles aged uncommitted content and recognized crash-left temporary
      files against the authoritative commit ledger; unknown paths are left
      untouched and the scheduler is cancellable and bounded.
  - >-
      `RedisDispatchWorkerScheduler` now runs bounded Redis worker cycles until
      explicit cancellation, with finite interval validation, optional durable
      payload materialization, injected sleep, and a deterministic cycle cap.
      `RedisDispatchRuntime.worker_scheduler()` composes this seam while
      handler execution, process lifecycle, lease heartbeats, and engine
      disposal remain injected worker responsibilities.
  - >-
      `LocalArtifactStore` now rejects dangling target symlinks before missing
      content handling, preserving fail-closed path and digest verification;
      the regression is covered at the exact branch tip.
  - >-
      `LocalArtifactStore.cleanup_uncommitted()` and
      `LocalArtifactCleanupService` reconcile digest-verified aged orphans and
      crash-left temporary publication files against PostgreSQL commit records.
      `ArtifactCleanupScheduler` adds explicit-time, cancellable periodic runs
      with a deterministic cycle cap; unknown files and fresh entries remain
      untouched.
  - >-
      `worker_process.py` now runs each immutable execution handoff in a fresh
      spawn-based child process and returns only typed worker evidence over a
      one-way pipe. Parent-owned timeout, termination, reaping, and stable
      child-error digests provide the dedicated serial process boundary;
      Redis service entrypoint, lease-heartbeat integration, and Compose
      activation remain caller-owned.
  - >-
      `worker_service.py` composes the authenticated Redis payload loader,
      bounded scheduler, fresh serial worker process, and injected durable
      completion writer. Process execution runs off the event loop and the
      transport is acknowledged only after the writer returns a matching
      receipt; Redis runtime construction remains explicit and non-starting.
  - >-
      `migration_startup.py` provides an explicit application-owned Alembic
      upgrade service with PostgreSQL URL/script validation, serialized
      idempotent calls, off-event-loop execution, and stable redacted failure
      evidence. The FastAPI lifespan and dedicated worker entrypoint invoke it
      only when their explicit namespaced settings enable startup migration;
      importing the router still performs no migration.
  - >-
      `worker_entrypoint.py` now owns the explicit local worker lifecycle:
      validated namespaced configuration, startup migration before Redis,
      shared PostgreSQL persistence construction, callback-factory loading,
      bounded Redis worker-service composition, signal-driven cancellation, and
      idempotent runtime closure. Terminal/result callback implementations,
      Compose activation and scope-bound authoritative Nautilus v2 execution
      remain separate integration gates; neither requires a stable upstream
      release when an exact-pinned pre-release passes the same conformance.
  - >-
      Root Compose now exposes the dedicated worker as an explicit opt-in
      `strategy-lab-v2` profile, separate from the general ARQ worker. The
      profile uses a named artifact volume, health-gated PostgreSQL/Redis,
      read-only root, dropped capabilities, bounded `/tmp`, and a non-creating
      bind for the local Docker socket required by sandbox plans. An empty
      callback factory fails closed at worker startup; the default stack never
      enables this profile.
  - >-
      `worker_handoff.py` now defines a versioned, content-addressed dispatch
      envelope for `WorkerExecutionRequest`. The envelope decoder rehydrates
      the complete execution contract through the allowlisted decoder,
      verifies request identity and outer payload binding, and exposes an
      async materializer compatible with the dedicated worker callback seam;
      terminal/result evidence resolution remains application-owned.
  - >-
      `worker_evidence_resolution.py` keeps the default sandbox mapper
      fail-closed for its single `/outputs/result` mount and now accepts an
      explicit application-owned artifact-path mapping for multi-artifact
      manifests. Every manifest artifact is mapped exactly once and published
      through the byte-verifying artifact service; worker payloads cannot infer
      host paths.
  - >-
      `worker_callbacks.py` now composes the typed handoff materializer with
      `PostgresWorkerTerminalAdapter` through a namespaced
      `STRATEGY_LAB_V2_EVIDENCE_RESOLVER` module/attribute factory. Missing or
      malformed resolver configuration fails before Redis opens, and the
      legacy completion path can only return a retry; application evidence
      resolution remains explicit rather than inferred from transport payloads.
  - >-
      `worker_service.py` now optionally emits ordered, content-addressed lease
      heartbeats during each serial process handoff and fails closed on an
      unexpected sequence/state or durable observation rejection. The local
      entrypoint and Redis runtime pass a third heartbeat callback plus explicit
      interval/extension limits; forward-capacity settlement and Compose
      activation remain separate integration gates.
  - >-
      `PostgresWorkerStateAdapter.release_capacity()` now applies a release
      observation and serial reservation release in one locked transaction for
      backtest or forward profiles. It authenticates all identities, performs
      lease and reservation compare-and-set updates, replays exact releases,
      and leaves both state families unchanged on a rejected observation or
      missing/foreign row.
  - >-
      `WorkerCompletionContext` and the optional terminal writer now bind the
      exact Redis entry, immutable process request/resolution, and UTC
      observation time before acknowledgement. The entrypoint and Redis runtime
      pass this fourth callback while preserving the legacy completion writer;
      concrete result/outcome/publication adapters remain application-owned.
  - >-
      `conformance_fixtures.py` now exposes an executable
      `execute_conformance_suite(...)` boundary. It invokes every required
      fixture through an injected engine runner, canonicalizes observed output,
      reduces runner exceptions to deterministic failed evidence, and returns
      the fixture suite, engine evidence, and gated report as one identity-bound
      resolution. Authoritative local simulation requires a valid exact isolated
      stable or release-candidate v2 pin and all checks for the requested scope.
  - >-
      `conformance.py` now binds a `NautilusReleasePin` to conformance evidence,
      recording the exact v2 package/tag, source and runtime-image digests,
      Python/Rust versions, and legacy-runtime isolation. Complete stable or
      release-candidate fixture evidence with a valid isolated pin can become
      authoritative for local simulation; full scope additionally requires
      event-tape parity.
  - >-
      `resource_mutations.py` and the registration-neutral API router now expose
      strict idempotent creation for mutable Strategy Lab resources. Exact
      retries replay the existing resource receipt, changed content conflicts,
      rejected preconditions are typed, and artifact/metric-set creation stays
      read-only. Domain persistence and result-publication policy remain
      application-owned integration gates.
  - >-
      `PostgresStrategyLabV2Adapter.create_resource()` now supplies the first
      application-owned durable bridge for that generic mutation boundary. It
      maps the resource envelope onto the shared compare-and-set aggregate
      store, binds storage request identity to owner/resource/idempotency
      content, persists the mutation fingerprint and accepted timestamp for
      restart-safe receipt replay, and rejects foreign-owner or colliding
      aggregates without disclosing their documents. Domain-specific resource
      validation, outbox publication, and result policy remain separate gates.
  - >-
      `resource_domains.py` now decodes strategy, package, portfolio,
      experiment, attempt, snapshot, trial, metric-set, and forward-instance
      resource attributes into the immutable `StrategyVersion`,
      `StrategyPackage`, `PortfolioComposition`, `ExperimentDefinition`,
      `RunAttempt`, `DataSnapshot`, `ScientificTrial`, `MetricSet`, and
      `ForwardInstance` contracts before
      persistence. Source/archive/dependency digests, exact dependency
      versions, entrypoint/runtime ABI, frozen parameter maps, exact decimal
      capital/weights, component strategy links, shared risk models, calendar
      rebalance policy, seed/engine identity, lifecycle state/timestamps,
      capability preflight decisions, coverage evidence, series content,
      unknown fields, and API ID aliases are validated deterministically; the
      normalized domain fingerprint is projected in resource metadata.
      Remaining generic resource domain adapters are separate follow-up gates.
  - >-
      `worker_terminal_adapter.py` now requires the application-owned metrics
      adapter and persists the successful `RunResultManifest.metric_set` after
      result completion, before execution summary and worker-capacity release.
      Metric persistence is idempotent and retry-safe; a persistence failure
      leaves the Redis entry pending and cannot acknowledge a partially
      published metric result.
  - >-
      The dedicated terminal callback now also registers the successful
      `RunResultManifest` through the shared result-materialization adapter
      before result completion. Manifest persistence is owner-scoped,
      attempt-bound, immutable, and replay-safe; failures leave the transport
      entry pending and cannot acknowledge an unregistered result.
  - >-
      The dedicated terminal callback now re-registers the authenticated
      owner-scoped result-publication plan before invoking atomic result
      completion. Exact retries replay the immutable plan, rejected plans
      remain audit evidence and cannot complete, and publication registration
      is explicitly separate from the completion/artifact transaction.
  - >-
      Forward instances now require an immutable, instance-keyed execution-plan
      resource before warm-up activation. Each component binds the exact
      strategy and package fingerprints, frozen parameters, and random seed;
      owner-scoped application validation checks the instance, portfolio,
      strategy, and package links, and the runtime resolver verifies source
      archive bytes and SDK manifests before returning all component recipes.
      Persistent runtime integration and checkpoint-bound market-history
      resolution remain open.
