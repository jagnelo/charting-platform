closure_summary: >-
  Intermittent staging failures of the research-runner concurrent-memory probe (all eight pressure processes
  exit 137 and the container is OOM-killed and restarted). The memcg OOM killer picks the largest task; the idle
  service keeps about 156 MiB resident (numpy/pandas/scipy/statsmodels), so when the probe's processes grow in
  parallel without swap headroom the service is the victim. A container oom_score_adj is inherited by docker
  exec processes and the service has no CAP_SYS_RESOURCE and cannot fork, so the runner now raises every other
  process in its PID namespace to oom_score_adj 1000 (idle loop every 50 ms and during jobs). The unmodified
  probe went from 0/6 to 10/10 in the no-swap reproduction; the probe, its assertions, compose limits,
  seccomp and job rlimits are unchanged. Requires integration_capture: exact branch HEAD.
