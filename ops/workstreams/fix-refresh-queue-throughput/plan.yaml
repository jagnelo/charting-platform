acceptance_criteria:
  - id: AC1
    text: >-
      An additive Alembic revision and the model declare a partial index for claimable jobs (priority,
      next_attempt_at, id where status is queued, retry, deferred or leased). On real PostgreSQL the production
      claim query uses it with many completed rows present, and the revision reverses cleanly.
  - id: AC2
    text: >-
      The drain chain cap defaults to 6 and the worker's job slots come from a setting (default 10). The
      effective chain cap always leaves slots for the scheduled jobs. The quarter-hour tick tops live drains up
      to the cap only when due work exists.
  - id: AC3
    text: >-
      A later-hour ensure of the same identity tuple reuses the open queued, deferred or retry identity child
      and records both parents. A completed negative child keeps the hourly recovery behaviour, and a leased
      child is not reused.
  - id: AC4
    text: >-
      A later maintenance pass for the same instrument, timeframe, adjustment and deepest range reuses the open
      history child, extends its end to the later end (open-ended counts as latest) and records both parents.
      Explicit-start ranges, derived-only children and leased children are not merged, and a sibling with a
      later end is reused unchanged.
  - id: AC5
    text: Exact-source feature CI and the staging exhaustive gate are green before promotion; production deployment waits for the human's approval.
