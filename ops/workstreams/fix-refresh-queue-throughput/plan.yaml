goal: >-
  Raise the production refresh queue's throughput so the self-sustaining whole-market universe (34k active
  instruments, ~76k queued jobs on 2026-11-20) can be prepared and kept fresh: cheap claims, more concurrent
  drains, and no duplicate children per maintenance pass.
scope:
  - A partial index serves the claim query instead of scanning every completed and tracking row.
  - More drains run concurrently, and the quarter-hour tick tops live drains back up to the cap.
  - Later maintenance passes coalesce into an instrument's open identity and history children instead of forking new ones.
