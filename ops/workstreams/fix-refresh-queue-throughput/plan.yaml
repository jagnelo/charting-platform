closure_summary: >-
  Production refresh-queue throughput. After the liveness fix the queue drained again but could not keep up
  with the 34k-instrument discovered universe (~76k queued, ~1-3k completions/h): drains were serial and
  capped at two, every one-job claim walked all 232k rows (105 ms, mostly disk reads), and each maintenance
  pass forked new hour/session-keyed identity and history children while earlier ones still waited (45,948
  identity jobs for 32,472 instruments; ~100 waiting lookups for one instrument). Fix: partial claim index
  (Alembic a7c3e5f9b2d4) plus a top-level status conjunct so PostgreSQL uses it; 6 drain chains on 10 worker
  slots with 4 always reserved, topped up by the quarter-hour tick when due work exists; later passes join an
  instrument's waiting identity child and its waiting deepest-range history child (widening the end) under
  FOR UPDATE SKIP LOCKED. Unit 4561 pass (the joining cases fail on the old code); PostgreSQL plan, migration
  and locking tests pass; Ruff clean. Requires integration_capture: exact branch HEAD.
