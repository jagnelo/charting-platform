closure_summary: >-
  Options were discovered on demand only and never refreshed; production holds no option rows. A daily
  cron scheduled_options_refresh (14:45 UTC, after the MarketData.app credit reset) now refreshes
  expirations and the nearest chain (within the 45-day horizon) for up to 2 underlyings per day, stalest
  first (core workstation, watchlisted, or already-held), then 7-day quote/greeks/OI history for up to 10
  active contracts. Expired contracts are deactivated and never selected; per-day caps are counted from
  dataset-state fetched_at so reruns do not multiply calls; quota or rate-limit errors stop the pass;
  every call goes through execute_provider_call quota admission. With the production chain cap of 20
  contracts the worst case is about 52 of the 100 free daily credits, leaving the rest for on-demand use.
  It is on by default (orchestrator decision under the standing no-blanket-disables direction). Option
  contracts are also excluded from the core D1 history planner, which would otherwise have queued them as
  stock OHLCV work. Requires integration_capture: exact branch HEAD.
