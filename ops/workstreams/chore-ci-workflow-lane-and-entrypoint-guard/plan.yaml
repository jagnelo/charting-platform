closure_summary: >-
  tests/workflow (234 tests, ~5 s) ran in CI only for workflow-scope changes, so the provider
  live-acceptance contract test went unchecked on ordinary branches; it now runs in the backend job on
  every broad-scope run. backend/docker-entrypoint.sh ran alembic upgrade before any command, so `docker
  run <backend image> python script.py` with a production DATABASE_URL tried to migrate production (seen
  2026-11-27 during the dedup dry-run). It now migrates only for the API server (uvicorn/gunicorn, the
  image default CMD used by the compose backend service in production) or when RUN_MIGRATIONS=true;
  RUN_MIGRATIONS=false always skips; invalid values exit 64. The arq worker already waits for a healthy
  backend; the two strategy-lab-v2 workers set RUN_MIGRATIONS=true to keep their behaviour. Requires
  integration_capture: exact branch HEAD. Requires integration_capture: exact branch HEAD.
