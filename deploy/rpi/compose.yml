name: charting-platform

volumes:
  postgres_data:
  redis_data:
  research_jobs:
  research_results:

networks:
  charting:
    driver: bridge

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chartingdb}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [charting]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    networks: [charting]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chartingdb}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chartingdb}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
      PROVIDER_AVAILABILITY_MONITOR_ENABLED: ${PROVIDER_AVAILABILITY_MONITOR_ENABLED:-false}
      PROVIDER_AVAILABILITY_LIVE_ENABLED: ${PROVIDER_AVAILABILITY_LIVE_ENABLED:-false}
      PROVIDER_AVAILABILITY_NOTIFICATIONS_ENABLED: ${PROVIDER_AVAILABILITY_NOTIFICATIONS_ENABLED:-true}
      PROVIDER_AVAILABILITY_NOTIFICATION_COOLDOWN_SECONDS: ${PROVIDER_AVAILABILITY_NOTIFICATION_COOLDOWN_SECONDS:-86400}
      PROXY_ENABLED: "false"
    volumes:
      - research_jobs:/jobs
      - research_results:/results
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [charting]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "app.workers.arq_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chartingdb}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chartingdb}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PROVIDER_AVAILABILITY_MONITOR_ENABLED: ${PROVIDER_AVAILABILITY_MONITOR_ENABLED:-false}
      PROVIDER_AVAILABILITY_LIVE_ENABLED: ${PROVIDER_AVAILABILITY_LIVE_ENABLED:-false}
      PROVIDER_AVAILABILITY_NOTIFICATIONS_ENABLED: ${PROVIDER_AVAILABILITY_NOTIFICATIONS_ENABLED:-true}
      PROVIDER_AVAILABILITY_NOTIFICATION_COOLDOWN_SECONDS: ${PROVIDER_AVAILABILITY_NOTIFICATION_COOLDOWN_SECONDS:-86400}
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [charting]

  research-runner:
    image: ${RESEARCH_RUNNER_IMAGE}
    restart: unless-stopped
    network_mode: none
    read_only: true
    mem_limit: ${RESEARCH_CONTAINER_MEMORY_LIMIT:-768m}
    cpus: ${RESEARCH_CONTAINER_CPUS:-1.0}
    pids_limit: ${RESEARCH_CONTAINER_PIDS_LIMIT:-128}
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      RESEARCH_JOB_DIR: /jobs
      RESEARCH_RESULT_DIR: /results
    volumes:
      - research_jobs:/jobs
      - research_results:/results

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports: ["${RPI_HTTP_PORT}:80"]
    depends_on: [backend]
    networks: [charting]
