      - research_jobs:/jobs
      - research_results:/results
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [charting]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

