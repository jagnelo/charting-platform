    mem_limit: ${RESEARCH_CONTAINER_MEMORY_LIMIT:-768m}
    cpus: ${RESEARCH_CONTAINER_CPUS:-1.0}
    pids_limit: ${RESEARCH_CONTAINER_PIDS_LIMIT:-128}
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      RESEARCH_JOB_DIR: /jobs
      RESEARCH_RESULT_DIR: /results
    volumes:
      - research_jobs:/jobs
      - research_results:/results

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports: ["${RPI_HTTP_PORT}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on: [backend]
    networks: [charting]
