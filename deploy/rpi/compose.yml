name: charting-platform

volumes:
  postgres_data:
  redis_data:
  research_jobs:
  research_results:

networks:
  charting:
    driver: bridge

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chartingdb}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [charting]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    networks: [charting]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chartingdb}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chartingdb}
      REDIS_URL: redis://redis:6379/0
      OHLCV_DISTRIBUTED_LOCK_ENABLED: ${OHLCV_DISTRIBUTED_LOCK_ENABLED:-false}
      OHLCV_DISTRIBUTED_LOCK_TTL_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_TTL_SECONDS:-900}
      OHLCV_DISTRIBUTED_LOCK_WAIT_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_WAIT_SECONDS:-30}
      OHLCV_DISTRIBUTED_LOCK_RETRY_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_RETRY_SECONDS:-0.25}
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEFAULT_MARKET_DATA_PROVIDER: ${DEFAULT_MARKET_DATA_PROVIDER:-alpaca}
      DEFAULT_METADATA_PROVIDER: ${DEFAULT_METADATA_PROVIDER:-edgar}
      DEFAULT_EVENT_PROVIDER: ${DEFAULT_EVENT_PROVIDER:-alpaca}
      DEFAULT_DISCOVERY_PROVIDER: ${DEFAULT_DISCOVERY_PROVIDER:-alpaca}
      DEFAULT_OPTIONS_PROVIDER: ${DEFAULT_OPTIONS_PROVIDER:-yfinance}
      IDENTIFIER_PROVIDER_PRIORITY: ${IDENTIFIER_PROVIDER_PRIORITY:-["openfigi"]}
      OPTION_QUOTE_HISTORY_PROVIDER_PRIORITY: ${OPTION_QUOTE_HISTORY_PROVIDER_PRIORITY:-["yfinance"]}
      TOKENIZED_PROVIDER_PRIORITY: ${TOKENIZED_PROVIDER_PRIORITY:-["robinhood_tokens","xstocks","bybit_xstocks","gate_tradfi","kraken_xstocks","dinari","ondo_global_markets"]}
      PROVIDER_CHAIN_SEEDS: ${PROVIDER_CHAIN_SEEDS:-{"price_history":["alpaca","alpha_vantage"],"latest_price":["alpaca","alpha_vantage"],"universe_discovery":["alpaca","edgar","massive","nasdaq","finra_otc_directory","alpha_vantage"],"instrument_events":["alpaca","edgar"],"instrument_metadata":["edgar"],"instrument_search":["edgar","massive","alpha_vantage"],"option_chain":["yfinance"],"tokenized_corporate_actions":["robinhood_tokens","xstocks"]}}
      ALLOW_PAID_PROVIDER_ROUTING: ${ALLOW_PAID_PROVIDER_ROUTING:-false}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      OPENFIGI_TIMEOUT_SECONDS: ${OPENFIGI_TIMEOUT_SECONDS:-10}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_TRADING_BASE_URL: ${ALPACA_TRADING_BASE_URL:-https://paper-api.alpaca.markets/v2}
      ALPACA_CORPORATE_ACTIONS_MAX_PAGES: ${ALPACA_CORPORATE_ACTIONS_MAX_PAGES:-0}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
