# Browser tests use local fixtures only. Keep application containers on an
# internal-only network and expose only a fixed-destination host-port relay on
# a separate bridge. This blocks direct egress even when a client ignores
# proxy variables, while Playwright can still reach the local app.
networks:
  charting:
    internal: true
  host-access:
    driver: bridge

services:
  backend:
    environment: &provider_egress_denied
      HTTP_PROXY: http://provider-egress-deny:3128
      HTTPS_PROXY: http://provider-egress-deny:3128
      ALL_PROXY: http://provider-egress-deny:3128
      NO_PROXY: postgres,redis,backend,worker,frontend,provider-egress-deny,localhost,127.0.0.1,::1
      PROVIDER_ROUTING_ENABLED: "false"
    depends_on:
      provider-egress-deny:
        condition: service_healthy

  worker:
    environment: *provider_egress_denied
    depends_on:
      provider-egress-deny:
        condition: service_healthy

  provider-egress-deny:
    image: python:3.12-slim
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    command: ["python", "-u", "/egress_deny_proxy.py"]
    volumes:
      - ./tests/e2e/egress_deny_proxy.py:/egress_deny_proxy.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.socket(); sys.exit(s.connect_ex(('127.0.0.1',3128)))"
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s
    networks: [charting]

  host-port-relay:
    image: python:3.12-slim
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    command: ["python", "-u", "/host_port_relay.py"]
    volumes:
      - ./tests/e2e/host_port_relay.py:/host_port_relay.py:ro
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
      - "${BACKEND_HOST_PORT:-8000}:8000"
    networks: [charting, host-access]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; ports=(80,8000); results=[]; [(lambda s,p: (results.append(s.connect_ex(('127.0.0.1',p))),s.close()))(socket.socket(),p) for p in ports]; sys.exit(0 if all(code==0 for code in results) else 1)"
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s
