name: Credentialed Provider Live Validation

on:
  workflow_dispatch:

concurrency:
  group: provider-live-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provider-live:
    name: Bounded credentialed provider probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: provider-live-validation
    env:
      RUN_LIVE_PROVIDER_TESTS: "1"
      FORCE_LIVE_PROVIDER_PROBES: "1"
      # The live suite writes aggregate-only, credential-free usage telemetry.
      # Keep it in the runner temp area and upload it as a redacted artifact
      # below; never place provider credentials or payloads in the artifact.
      PROVIDER_LIVE_USAGE_LEDGER: ${{ runner.temp }}/provider-live-usage.jsonl
      PROVIDER_LIVE_USAGE_SCOPE: github:${{ github.repository }}:${{ github.environment }}
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
      FINRA_OTC_SYMBOL_DIRECTORY_URL: ${{ vars.FINRA_OTC_SYMBOL_DIRECTORY_URL }}
      FINRA_OTC_OPERATION_COSTS: ${{ vars.FINRA_OTC_OPERATION_COSTS || '{}' }}
      FINRA_OTC_TERMS_REVIEWED: ${{ vars.FINRA_OTC_TERMS_REVIEWED || 'false' }}
      FINRA_OTC_COMPLETENESS_REVIEWED: ${{ vars.FINRA_OTC_COMPLETENESS_REVIEWED || 'false' }}
      FINRA_OTC_REDISTRIBUTION_REVIEWED: ${{ vars.FINRA_OTC_REDISTRIBUTION_REVIEWED || 'false' }}
      FINRA_OTC_POLL_INTERVAL_SECONDS: ${{ vars.FINRA_OTC_POLL_INTERVAL_SECONDS || '0' }}
      MARKETSTACK_DISCOVERY_EXCHANGE: ${{ vars.MARKETSTACK_DISCOVERY_EXCHANGE || '' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      ALPACA_TRADING_BASE_URL: ${{ vars.ALPACA_TRADING_BASE_URL || 'https://paper-api.alpaca.markets/v2' }}
      ALPACA_CORPORATE_ACTIONS_MAX_PAGES: ${{ vars.ALPACA_CORPORATE_ACTIONS_MAX_PAGES || '0' }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_REVIEWED_LIMIT_SCOPE: ${{ vars.FRED_REVIEWED_LIMIT_SCOPE || '' }}
      FRED_REVIEWED_REQUESTS_PER_MINUTE: ${{ vars.FRED_REVIEWED_REQUESTS_PER_MINUTE || '0' }}
      FRED_SERIES_TERMS_REVIEWED: ${{ vars.FRED_SERIES_TERMS_REVIEWED || 'false' }}
      FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
      FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
      FINRA_ASYNC_MAX_RESULT_BYTES: ${{ vars.FINRA_ASYNC_MAX_RESULT_BYTES || '0' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE || 'disabled' }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TIINGO_OPERATION_BYTE_BOUNDS: ${{ vars.TIINGO_OPERATION_BYTE_BOUNDS || '{}' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FMP_OPERATION_BYTE_BOUNDS: ${{ vars.FMP_OPERATION_BYTE_BOUNDS || '{}' }}
      TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
      MARKETDATA_APP_API_KEY: ${{ secrets.MARKETDATA_APP_API_KEY }}
      MARKETDATA_APP_REVIEWED_PLAN: ${{ vars.MARKETDATA_APP_REVIEWED_PLAN || '' }}
      MARKETDATA_APP_REVIEWED_DAILY_CREDIT_LIMIT: ${{ vars.MARKETDATA_APP_REVIEWED_DAILY_CREDIT_LIMIT || '0' }}
      MARKETDATA_APP_OPTION_CHAIN_MAX_SYMBOLS: ${{ vars.MARKETDATA_APP_OPTION_CHAIN_MAX_SYMBOLS || '0' }}
      DINARI_API_KEY_ID: ${{ secrets.DINARI_API_KEY_ID }}
      DINARI_API_SECRET_KEY: ${{ secrets.DINARI_API_SECRET_KEY }}
      DINARI_API_BASE_URL: ${{ vars.DINARI_API_BASE_URL || 'https://api-enterprise.sandbox.dinari.com/api/v2' }}
      ONDO_GLOBAL_MARKETS_API_KEY: ${{ secrets.ONDO_GLOBAL_MARKETS_API_KEY }}
      IBKR_READ_ONLY_URL: ${{ vars.IBKR_READ_ONLY_URL || '' }}
      IBKR_READ_ONLY_SESSION_COOKIE: ${{ secrets.IBKR_READ_ONLY_SESSION_COOKIE }}
      IBKR_READ_ONLY_VERIFY_TLS: ${{ vars.IBKR_READ_ONLY_VERIFY_TLS || 'true' }}
      IBKR_READ_ONLY_TIMEOUT_SECONDS: ${{ vars.IBKR_READ_ONLY_TIMEOUT_SECONDS || '30' }}
      IBKR_CONID_MAP: ${{ vars.IBKR_CONID_MAP || '{}' }}
      XSTOCKS_API_KEY: ${{ secrets.XSTOCKS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: bash scripts/ci-retry.sh -- bash -c 'cd backend && uv sync --frozen --dev'

      - name: Run one bounded live read per provider
        run: uv run --project backend python scripts/run-live-provider-probes.py

      - name: Preserve redacted live usage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-live-usage-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-live-usage.jsonl
          if-no-files-found: ignore
          retention-days: 90
