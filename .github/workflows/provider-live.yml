name: Credentialed Provider Live Validation

on:
  workflow_dispatch:
    inputs:
      dinari_sandbox_canary:
        description: "Run only the explicit non-persisting Dinari Sandbox canary"
        required: false
        default: false
        type: boolean

concurrency:
  group: provider-live-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provider-live:
    name: Bounded credentialed provider probes
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/staging' && 'provider-live-staging' || 'provider-live-master' }}
    env:
      RUN_LIVE_PROVIDER_TESTS: "1"
      FORCE_LIVE_PROVIDER_PROBES: "1"
      # The live suite writes aggregate-only, credential-free usage telemetry.
      # Keep it in the runner temp area and upload it as a redacted artifact
      # below; never place provider credentials or payloads in the artifact.
      PROVIDER_LIVE_USAGE_LEDGER: ${{ runner.temp }}/provider-live-usage.jsonl
      PROVIDER_LIVE_USAGE_SCOPE: github:${{ github.repository }}:${{ github.ref_name }}
      # GitHub runners are ephemeral. The environment-specific durable
      # coordinator is required before any provider call; a temp SQLite file
      # or uploaded receipt is not cross-run quota admission.
      PROVIDER_QUOTA_LEDGER_DATABASE_URL: ${{ secrets.PROVIDER_QUOTA_LEDGER_DATABASE_URL }}
      PROVIDER_QUOTA_ACCOUNT_SCOPES: ${{ vars.PROVIDER_QUOTA_ACCOUNT_SCOPES || '{}' }}
      PROVIDER_QUOTA_EXCLUSIVE_ACCOUNT_SCOPES: ${{ vars.PROVIDER_QUOTA_EXCLUSIVE_ACCOUNT_SCOPES || '{}' }}
      PROVIDER_QUOTA_CONCURRENCY_LEASE_GRACE_SECONDS: ${{ vars.PROVIDER_QUOTA_CONCURRENCY_LEASE_GRACE_SECONDS || '10' }}
      PROVIDER_RATE_LIMIT_SEEDS: ${{ vars.PROVIDER_RATE_LIMIT_SEEDS || '__CODE_DEFAULT__' }}
      PROVIDER_FRESHNESS_SEEDS: ${{ vars.PROVIDER_FRESHNESS_SEEDS || '__CODE_DEFAULT__' }}
      PROVIDER_USAGE_PROFILE_SEEDS: ${{ vars.PROVIDER_USAGE_PROFILE_SEEDS || '__CODE_DEFAULT__' }}
      PROVIDER_ACCOUNT_USAGE_REFRESH_ENABLED: ${{ vars.PROVIDER_ACCOUNT_USAGE_REFRESH_ENABLED || 'false' }}
      PROVIDER_ACCOUNT_USAGE_REFRESH_PROVIDERS: ${{ vars.PROVIDER_ACCOUNT_USAGE_REFRESH_PROVIDERS || '[]' }}
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
      NASDAQ_USER_AGENT: ${{ vars.NASDAQ_USER_AGENT || 'charting-platform market-data-universe' }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      OPENFIGI_TIMEOUT_SECONDS: ${{ vars.OPENFIGI_TIMEOUT_SECONDS || '10' }}
      FINRA_OTC_SOURCE_KIND: ${{ vars.FINRA_OTC_SOURCE_KIND || 'legacy_candidate' }}
      FINRA_OTC_SYMBOL_DIRECTORY_URL: ${{ vars.FINRA_OTC_SYMBOL_DIRECTORY_URL }}
      FINRA_OTC_INACTIVE_SECURITY_MASTER_URL: ${{ vars.FINRA_OTC_INACTIVE_SECURITY_MASTER_URL || '' }}
      FINRA_TOKEN_URL: ${{ vars.FINRA_TOKEN_URL || 'https://ews.fip.finra.org/fip/rest/ews/oauth2/access_token' }}
      FINRA_API_BASE_URL: ${{ vars.FINRA_API_BASE_URL || 'https://api.finra.org' }}
      FINRA_SHORT_INTEREST_URL: ${{ vars.FINRA_SHORT_INTEREST_URL || '' }}
      FINRA_OTC_DAILY_LIST_URL: ${{ vars.FINRA_OTC_DAILY_LIST_URL || '' }}
      FINRA_OTC_OPERATION_COSTS: ${{ vars.FINRA_OTC_OPERATION_COSTS || '{}' }}
      FINRA_OTC_SOURCE_REVIEWED: ${{ vars.FINRA_OTC_SOURCE_REVIEWED || 'false' }}
      FINRA_OTC_SOURCE_EVIDENCE: ${{ vars.FINRA_OTC_SOURCE_EVIDENCE || '' }}
      FINRA_OTC_REVIEWED_SOURCE_URL: ${{ vars.FINRA_OTC_REVIEWED_SOURCE_URL || '' }}
      FINRA_OTC_REVIEWED_INACTIVE_SOURCE_URL: ${{ vars.FINRA_OTC_REVIEWED_INACTIVE_SOURCE_URL || '' }}
      FINRA_OTC_TERMS_REVIEWED: ${{ vars.FINRA_OTC_TERMS_REVIEWED || 'false' }}
      FINRA_OTC_COMPLETENESS_REVIEWED: ${{ vars.FINRA_OTC_COMPLETENESS_REVIEWED || 'false' }}
      FINRA_OTC_REDISTRIBUTION_REVIEWED: ${{ vars.FINRA_OTC_REDISTRIBUTION_REVIEWED || 'false' }}
      FINRA_OTC_POLL_INTERVAL_SECONDS: ${{ vars.FINRA_OTC_POLL_INTERVAL_SECONDS || '0' }}
      MARKETSTACK_DISCOVERY_EXCHANGE: ${{ vars.MARKETSTACK_DISCOVERY_EXCHANGE || '' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      ALPACA_TRADING_BASE_URL: ${{ vars.ALPACA_TRADING_BASE_URL || 'https://paper-api.alpaca.markets/v2' }}
      ALPACA_CORPORATE_ACTIONS_MAX_PAGES: ${{ vars.ALPACA_CORPORATE_ACTIONS_MAX_PAGES || '0' }}
      MASSIVE_CORPORATE_ACTIONS_MAX_PAGES: ${{ vars.MASSIVE_CORPORATE_ACTIONS_MAX_PAGES || '0' }}
      MASSIVE_MARKET_DATA_USE_AUTHORIZED: ${{ vars.MASSIVE_MARKET_DATA_USE_AUTHORIZED || 'false' }}
      MASSIVE_MARKET_DATA_USE_AUTHORITY_REFERENCE: ${{ vars.MASSIVE_MARKET_DATA_USE_AUTHORITY_REFERENCE || '' }}
      MASSIVE_MARKET_DATA_USE_AUTHORITY_SCOPE: ${{ vars.MASSIVE_MARKET_DATA_USE_AUTHORITY_SCOPE || '' }}
      MASSIVE_MARKET_DATA_USE_REVIEWED_AT: ${{ vars.MASSIVE_MARKET_DATA_USE_REVIEWED_AT || '' }}
      MASSIVE_MARKET_DATA_USE_EXPIRES_AT: ${{ vars.MASSIVE_MARKET_DATA_USE_EXPIRES_AT || '' }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MARKETDATA_API_KEY: ${{ secrets.MARKETDATA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ALPHA_VANTAGE_REVIEWED_RESET: ${{ vars.ALPHA_VANTAGE_REVIEWED_RESET || '' }}
      ALPHA_VANTAGE_QUOTA_EVIDENCE: ${{ vars.ALPHA_VANTAGE_QUOTA_EVIDENCE || '' }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_REVIEWED_LIMIT_SCOPE: ${{ vars.FRED_REVIEWED_LIMIT_SCOPE || '' }}
      FRED_REVIEWED_REQUESTS_PER_MINUTE: ${{ vars.FRED_REVIEWED_REQUESTS_PER_MINUTE || '0' }}
      FRED_REVIEWED_QUOTA_EVIDENCE: ${{ vars.FRED_REVIEWED_QUOTA_EVIDENCE || '' }}
      FRED_PERSISTED_STORAGE_AUTHORIZED: ${{ vars.FRED_PERSISTED_STORAGE_AUTHORIZED || 'false' }}
      FRED_PERSISTED_STORAGE_AUTHORITY_EVIDENCE: ${{ vars.FRED_PERSISTED_STORAGE_AUTHORITY_EVIDENCE || '' }}
      FRED_AUTOMATED_USE_AUTHORIZED: ${{ vars.FRED_AUTOMATED_USE_AUTHORIZED || 'false' }}
      FRED_AUTOMATED_USE_AUTHORITY_EVIDENCE: ${{ vars.FRED_AUTOMATED_USE_AUTHORITY_EVIDENCE || '' }}
      FRED_SERIES_RIGHTS_EVIDENCE: ${{ vars.FRED_SERIES_RIGHTS_EVIDENCE || '{}' }}
      FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
      FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
      FINRA_ASYNC_MAX_RESULT_BYTES: ${{ vars.FINRA_ASYNC_MAX_RESULT_BYTES || '0' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ENABLED: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ENABLED || 'false' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_ISSUERS: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_ISSUERS || '50' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_EVENTS_PER_ISSUER: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_EVENTS_PER_ISSUER || '100' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_SUBMISSIONS_REQUESTS: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_SUBMISSIONS_REQUESTS || '0' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE || 'disabled' }}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_REVIEWED_CYCLE_COUNT: ${{ vars.MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_REVIEWED_CYCLE_COUNT || '0' }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TIINGO_OPERATION_BYTE_BOUNDS: ${{ vars.TIINGO_OPERATION_BYTE_BOUNDS || '{}' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FMP_OPERATION_BYTE_BOUNDS: ${{ vars.FMP_OPERATION_BYTE_BOUNDS || '{}' }}
      TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
      MARKETDATA_APP_API_KEY: ${{ secrets.MARKETDATA_APP_API_KEY }}
      MARKETDATA_APP_REVIEWED_PLAN: ${{ vars.MARKETDATA_APP_REVIEWED_PLAN || '' }}
      MARKETDATA_APP_REVIEWED_DAILY_CREDIT_LIMIT: ${{ vars.MARKETDATA_APP_REVIEWED_DAILY_CREDIT_LIMIT || '0' }}
      MARKETDATA_APP_REVIEWED_PLAN_EXPIRES_AT: ${{ vars.MARKETDATA_APP_REVIEWED_PLAN_EXPIRES_AT || '' }}
      MARKETDATA_APP_OPTION_CHAIN_MAX_SYMBOLS: ${{ vars.MARKETDATA_APP_OPTION_CHAIN_MAX_SYMBOLS || '0' }}
      ALLOW_PAID_PROVIDER_ROUTING: ${{ vars.ALLOW_PAID_PROVIDER_ROUTING || 'false' }}
      DINARI_API_KEY_ID: ${{ secrets.DINARI_API_KEY_ID }}
      DINARI_API_SECRET_KEY: ${{ secrets.DINARI_API_SECRET_KEY }}
      DINARI_API_BASE_URL: ${{ vars.DINARI_API_BASE_URL || 'https://api-enterprise.sandbox.dinari.com/api/v2' }}
      DINARI_SANDBOX_CANARY_AUTHORIZED: ${{ vars.DINARI_SANDBOX_CANARY_AUTHORIZED || 'false' }}
      DINARI_SANDBOX_CANARY_AUTHORITY_REFERENCE: ${{ vars.DINARI_SANDBOX_CANARY_AUTHORITY_REFERENCE || '' }}
      DINARI_SANDBOX_CANARY_MAX_REQUESTS: ${{ vars.DINARI_SANDBOX_CANARY_MAX_REQUESTS || '' }}
      ONDO_GLOBAL_MARKETS_API_KEY: ${{ secrets.ONDO_GLOBAL_MARKETS_API_KEY }}
      IBKR_READ_ONLY_URL: ${{ vars.IBKR_READ_ONLY_URL || '' }}
      IBKR_READ_ONLY_SESSION_COOKIE: ${{ secrets.IBKR_READ_ONLY_SESSION_COOKIE }}
      IBKR_READ_ONLY_VERIFY_TLS: ${{ vars.IBKR_READ_ONLY_VERIFY_TLS || 'true' }}
      IBKR_READ_ONLY_TIMEOUT_SECONDS: ${{ vars.IBKR_READ_ONLY_TIMEOUT_SECONDS || '30' }}
      IBKR_CONID_MAP: ${{ vars.IBKR_CONID_MAP || '{}' }}
      XSTOCKS_API_KEY: ${{ secrets.XSTOCKS_API_KEY }}
      XSTOCKS_MARKET_DATA_USE_AUTHORIZED: ${{ vars.XSTOCKS_MARKET_DATA_USE_AUTHORIZED || 'false' }}
      XSTOCKS_MARKET_DATA_USE_AUTHORITY_REFERENCE: ${{ vars.XSTOCKS_MARKET_DATA_USE_AUTHORITY_REFERENCE || '' }}
      XSTOCKS_MARKET_DATA_USE_AUTHORITY_SCOPE: ${{ vars.XSTOCKS_MARKET_DATA_USE_AUTHORITY_SCOPE || '' }}
      XSTOCKS_MARKET_DATA_USE_REVIEWED_AT: ${{ vars.XSTOCKS_MARKET_DATA_USE_REVIEWED_AT || '' }}
      XSTOCKS_MARKET_DATA_USE_EXPIRES_AT: ${{ vars.XSTOCKS_MARKET_DATA_USE_EXPIRES_AT || '' }}
      XSTOCKS_MARKET_DATA_USE_JURISDICTION_AUTHORIZED: ${{ vars.XSTOCKS_MARKET_DATA_USE_JURISDICTION_AUTHORIZED || 'false' }}
      XSTOCKS_MARKET_DATA_USE_JURISDICTION_EVIDENCE: ${{ vars.XSTOCKS_MARKET_DATA_USE_JURISDICTION_EVIDENCE || '' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_AUTHORIZED: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_AUTHORIZED || 'false' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_AUTHORITY_REFERENCE: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_AUTHORITY_REFERENCE || '' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_AUTHORITY_SCOPE: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_AUTHORITY_SCOPE || '' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_REVIEWED_AT: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_REVIEWED_AT || '' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_EXPIRES_AT: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_EXPIRES_AT || '' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_EGRESS_JURISDICTION_AUTHORIZED: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_EGRESS_JURISDICTION_AUTHORIZED || 'false' }}
      BYBIT_XSTOCKS_MARKET_DATA_USE_EGRESS_JURISDICTION_EVIDENCE: ${{ vars.BYBIT_XSTOCKS_MARKET_DATA_USE_EGRESS_JURISDICTION_EVIDENCE || '' }}
      COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
      COINBASE_MARKET_DATA_USE_AUTHORIZED: ${{ vars.COINBASE_MARKET_DATA_USE_AUTHORIZED || 'false' }}
      COINBASE_MARKET_DATA_USE_AUTHORITY_REFERENCE: ${{ vars.COINBASE_MARKET_DATA_USE_AUTHORITY_REFERENCE || '' }}
      COINBASE_MARKET_DATA_USE_AUTHORITY_SCOPE: ${{ vars.COINBASE_MARKET_DATA_USE_AUTHORITY_SCOPE || '' }}
      COINBASE_MARKET_DATA_USE_REVIEWED_AT: ${{ vars.COINBASE_MARKET_DATA_USE_REVIEWED_AT || '' }}
      COINBASE_MARKET_DATA_USE_EXPIRES_AT: ${{ vars.COINBASE_MARKET_DATA_USE_EXPIRES_AT || '' }}
      KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: bash scripts/ci-retry.sh -- bash -c 'cd backend && uv sync --frozen --dev'

      - name: Run one bounded live read per provider
        run: |
          if [ "${{ inputs.dinari_sandbox_canary }}" = "true" ]; then
            uv run --project backend python scripts/run-live-provider-probes.py \
              --provider dinari --dinari-sandbox-canary
          else
            uv run --project backend python scripts/run-live-provider-probes.py
          fi

      - name: Preserve redacted live usage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-live-usage-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-live-usage.jsonl
          if-no-files-found: ignore
          retention-days: 90
