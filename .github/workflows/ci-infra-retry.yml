name: CI infrastructure retry coordinator

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  retry:
    name: Retry classified infrastructure failures
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes trusted default-branch code, never the failed
      # branch's potentially untrusted workflow contents.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Evaluate and optionally rerun failed setup jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_RETRY_EVENT: ${{ github.event.workflow_run.event }}
          CI_RETRY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python scripts/ci-retry-coordinator.py

      - name: Preserve retry decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-retry-decision-${{ github.event.workflow_run.id }}
          path: ci-retry-decision.json
          if-no-files-found: error
          retention-days: 14
