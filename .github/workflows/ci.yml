name: CI

on:
  push:
    branches: [master, staging, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'test/**']
  pull_request:
    branches: [staging, master]

concurrency:
  group: charting-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  changed-scope:
    name: Changed-path validation scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate branch test manifest before product jobs
        if: >-
          github.event_name == 'pull_request' ||
          (github.ref != 'refs/heads/master' && github.ref != 'refs/heads/staging')
        run: >-
          python scripts/run-branch-tests.py
          "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --validate-only
      - name: Classify exact changed paths
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          base="$BEFORE"
          if [ -n "$PR_BASE" ]; then base="$PR_BASE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git merge-base HEAD origin/staging)" || base_sha=""
          else
            base_sha="$(git rev-parse --verify "${base}^{commit}")" || base_sha=""
          fi
          if [ -z "$base_sha" ]; then
            python scripts/ci-change-scope.py --base "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
          else
            candidate="$(python scripts/ci-change-scope.py --base "$base_sha" --candidate)" || candidate="broad"
            if [ "$candidate" != "broad" ] && python scripts/verify-prior-qualification.py --sha "$base_sha"; then
              python scripts/ci-change-scope.py --base "$base_sha" --prior-qualified --github-output "$GITHUB_OUTPUT"
            else
              fallback_sha="$(git merge-base HEAD origin/staging)" || fallback_sha=""
              if [ -n "$fallback_sha" ] && [ "$fallback_sha" != "$base_sha" ]; then
                fallback_candidate="$(python scripts/ci-change-scope.py --base "$fallback_sha" --candidate)" || fallback_candidate="broad"
                if [ "$fallback_candidate" != "broad" ] && python scripts/verify-prior-qualification.py --sha "$fallback_sha"; then
                  python scripts/ci-change-scope.py --base "$fallback_sha" --prior-qualified --github-output "$GITHUB_OUTPUT"
                else
                  python scripts/ci-change-scope.py --base "$fallback_sha" --github-output "$GITHUB_OUTPUT"
                fi
              else
                python scripts/ci-change-scope.py --base "$base_sha" --github-output "$GITHUB_OUTPUT"
              fi
            fi
          fi

  # ── Backend tests ─────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [changed-scope]
    if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/staging' && needs.changed-scope.outputs.scope == 'broad'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: bash scripts/ci-retry.sh -- bash -c 'cd backend && uv sync --frozen --dev'

      - name: Verify compatibility export
        run: |
          cd backend
          uv export --locked --format requirements-txt --output-file /tmp/requirements.lock
          # uv embeds the output path in its two-line generated header.  Compare
          # the dependency body so the compatibility export is path-independent.
          sed '1,2d' /tmp/requirements.lock > /tmp/requirements.generated
          sed '1,2d' requirements.txt > /tmp/requirements.current
          cmp -s /tmp/requirements.generated /tmp/requirements.current

      - name: Run unit tests
        run: |
          cd backend
          set -- tests/unit
          # Strategy Lab v2 keeps its package-owned unit suite under app/; include
          # it in the same coverage measurement whenever that package is present.
          if [ -d app/strategy_lab_v2/tests ]; then
            set -- "$@" app/strategy_lab_v2/tests
          fi
          ENV_FILE=.env.dev uv run pytest "$@" \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --no-header -q

      - name: Run integration tests (with testcontainers)
        run: |
          cd backend
          ENV_FILE=.env.dev uv run pytest tests/integration \
            --override-ini addopts= \
            --cov-append \
            --cov=app --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=0 \
            --no-header -q

      - name: Enforce combined backend coverage
        run: cd backend && uv run coverage report --fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml,backend/coverage-integration.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend unit tests ───────────────────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [changed-scope]
    if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/staging' && needs.changed-scope.outputs.scope == 'broad'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: bash scripts/ci-retry.sh -- bash -c 'cd frontend && npm ci'

      - name: Run Vitest
        run: cd frontend && npx vitest run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  branch-declared:
    name: Branch-declared Tests
    needs: [changed-scope, backend]
    if: >-
      always() && needs.changed-scope.result == 'success' &&
      ((github.event_name == 'push' && github.ref != 'refs/heads/master' &&
      github.ref != 'refs/heads/staging') || github.event_name == 'pull_request') &&
      (needs.changed-scope.outputs.scope != 'broad' || needs.backend.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        if: needs.changed-scope.outputs.scope == 'broad'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          bash scripts/ci-retry.sh -- bash -c 'cd backend && uv sync --frozen --dev'
      - name: Install frontend dependencies
        if: needs.changed-scope.outputs.scope == 'broad'
        run: bash scripts/ci-retry.sh -- bash -c 'cd frontend && npm ci'

      - name: Run tests declared by this branch
        if: needs.changed-scope.outputs.scope == 'broad'
        run: make branch-tests INTEGRATION_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        env:
          BRANCH_TESTS_CI_COVERED_COMMANDS: full-backend-suite
          INTEGRATION_BASE_SHA: origin/master
      - name: Validate workstream records
        if: needs.changed-scope.outputs.scope != 'broad'
        run: uv run --project backend python scripts/validate-workstream.py ops/workstreams
      - name: Check workstream narrative inputs
        if: needs.changed-scope.outputs.scope != 'broad'
        run: uv run --project backend python -m pytest --no-cov backend/tests/unit/services/test_etf_holdings_adapters.py::test_current_workstream_narrative_counts_match_runtime_and_yaml_ledgers -q
      - name: Check workflow behavior
        if: needs.changed-scope.outputs.scope == 'workflow'
        run: uv run --project backend python -m pytest tests/workflow -q

  # ── E2E tests ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changed-scope]
    if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/staging' && needs.changed-scope.outputs.scope == 'broad'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: bash scripts/ci-retry.sh -- bash -c 'cd frontend && npm ci'

      - name: Install Playwright browsers
        run: bash scripts/ci-retry.sh -- bash -c 'cd frontend && npx playwright install --with-deps chromium'

      - name: Build stack images
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p charting-platform-ci build
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-secret-key-not-used-in-production' }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chartingdb
          CORS_ORIGINS: '["http://localhost"]'
          E2E_SEED_INSTRUMENTS: "true"
          E2E_SEED_MARKET_DATA: "true"

      - name: Start stack
        # Vars are provided inline — no .env file needed
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p charting-platform-ci up -d --wait --no-build
        timeout-minutes: 5
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-secret-key-not-used-in-production' }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chartingdb
          CORS_ORIGINS: '["http://localhost"]'
          E2E_SEED_INSTRUMENTS: "true"
          E2E_SEED_MARKET_DATA: "true"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          STACK_URL: http://localhost

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p charting-platform-ci down -v

  # Staging owns the full integration gate. Master reuses exact same-SHA evidence.
  platform-gate:
    name: Exhaustive Integration Gate
    runs-on: ubuntu-latest
    # Keep the exhaustive gate authoritative while preventing a hung
    # container build or browser process from occupying the integration lane
    # indefinitely. This is above the previously observed green replay time;
    # timeout failure remains red and preserves the diagnostics step.
    timeout-minutes: 180
    needs: [changed-scope]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and browsers
        run: |
          bash scripts/ci-retry.sh -- bash -c 'cd frontend && npm ci'
          bash scripts/ci-retry.sh -- bash -c 'cd frontend && npx playwright install --with-deps chromium'

      - name: Run exhaustive integration gate
        run: make validate-integration
        env:
          INTEGRATION_BASE_SHA: ${{ github.ref == 'refs/heads/staging' && 'origin/master' || github.event.before }}
          SECRET_KEY: ci-exhaustive-gate-secret
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chartingdb
          CORS_ORIGINS: '["http://localhost"]'

      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/coverage-combined.xml
          retention-days: 7

  master-release:
    name: Master Release Provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact green staging evidence and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-master-promotion.py
