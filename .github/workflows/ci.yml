name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Backend tests ─────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          ENV_FILE=.env.dev python -m pytest tests/unit \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --no-header -q

      - name: Run integration tests (with testcontainers)
        run: |
          cd backend
          ENV_FILE=.env.dev python -m pytest tests/integration \
            --cov=app --cov-report=xml:coverage-integration.xml \
            --no-header -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml,backend/coverage-integration.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend unit tests ───────────────────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Vitest
        run: cd frontend && npx vitest run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ── E2E tests ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start stack
        # Vars are provided inline — no .env file needed
        run: docker compose up -d --wait
        timeout-minutes: 5
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-secret-key-not-used-in-production' }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chartingdb
          CORS_ORIGINS: '["http://localhost"]'

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          STACK_URL: http://localhost

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
