name: CI

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'test/**']
  pull_request:
    branches: [master]

concurrency:
  group: charting-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend tests ─────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: cd backend && uv sync --frozen --dev

      - name: Verify compatibility export
        run: |
          cd backend
          uv export --locked --format requirements-txt --output-file /tmp/requirements.lock
          # uv embeds the output path in its two-line generated header.  Compare
          # the dependency body so the compatibility export is path-independent.
          sed '1,2d' /tmp/requirements.lock > /tmp/requirements.generated
          sed '1,2d' requirements.txt > /tmp/requirements.current
          cmp -s /tmp/requirements.generated /tmp/requirements.current

      - name: Run unit tests
        run: |
          cd backend
          ENV_FILE=.env.dev uv run pytest tests/unit \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --no-header -q

      - name: Run integration tests (with testcontainers)
        run: |
          cd backend
          ENV_FILE=.env.dev uv run pytest tests/integration \
            --cov=app --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=0 \
            --no-header -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml,backend/coverage-integration.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend unit tests ───────────────────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Vitest
        run: cd frontend && npx vitest run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ── E2E tests ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start stack
        # Vars are provided inline — no .env file needed
        run: docker compose -p charting-platform-ci up -d --wait
        timeout-minutes: 5
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-secret-key-not-used-in-production' }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chartingdb
          CORS_ORIGINS: '["http://localhost"]'
          E2E_SEED_INSTRUMENTS: "true"
          E2E_SEED_MARKET_DATA: "true"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          STACK_URL: http://localhost

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -p charting-platform-ci down -v

  # Master receives the independent replay of the complete local integration
  # gate.  Branch pushes keep the faster deterministic jobs above; promotion
  # cannot be considered healthy until this exhaustive replay is green.
  platform-gate:
    name: Exhaustive Integration Gate (master)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run exhaustive integration gate
        run: make validate-integration
        env:
          SECRET_KEY: ci-exhaustive-gate-secret
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chartingdb
          CORS_ORIGINS: '["http://localhost"]'

      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/coverage-combined.xml
          retention-days: 7
