reference_policy:
  # An authorised live capture may be permission-cleared online evidence or controlled
  # storage; it need not be captured on the implementation machine. Approval still
  # requires verifiable V25 build/state, environment, source hash, permissions, and review.
  source_order:
    - authorised_live_capture
    - official_v25_help
    - confirmed_v23_v24_surface
    - v20_behavioral_history
  # Board-covered states are accepted against the composed reference board and
  # local measured regression baselines. `approved` remains reserved for a
  # stronger exact-build baseline, or for a state the board does not represent.
  acceptance_requires: approved_or_board_covered
  visual_thresholds:
    # These values are the deterministic local-regression contract. They do
    # not turn board evidence into an exact-build approval.
    max_diff_pixel_ratio: 0.005
    geometry_tolerance_css_px: 1
    solid_color_delta_e2000: 2
