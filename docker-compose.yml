# The full application stack is expected to run with an explicit
# COMPOSE_PROJECT_NAME. Makefile targets and local docs route this through
# `./scripts/dev-stack.sh project-name stack` so each git branch gets its own
# containers, networks, and volumes.

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  postgres_data:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    # To bind-mount to a specific NAS path instead, replace with:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /volume1/docker/charting/pgdata   # Synology example
    #   device: /mnt/pool/charting/pgdata         # TrueNAS example
  redis_data:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  research_jobs:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  research_results:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}

networks:
  charting:
    driver: bridge
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-chartingdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"   # expose for pgAdmin / direct access — remove in production
    networks: [charting]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (ARQ task queue) ──────────────────────────────────────────────────
  redis:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks: [charting]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      # Infrastructure — always Docker-internal hostnames in this context
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      REDIS_URL:         redis://redis:6379/0
      OHLCV_DISTRIBUTED_LOCK_ENABLED: ${OHLCV_DISTRIBUTED_LOCK_ENABLED:-false}
      OHLCV_DISTRIBUTED_LOCK_TTL_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_TTL_SECONDS:-900}
      OHLCV_DISTRIBUTED_LOCK_WAIT_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_WAIT_SECONDS:-30}
      OHLCV_DISTRIBUTED_LOCK_RETRY_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_RETRY_SECONDS:-0.25}
      RESEARCH_JOB_DIR:  /jobs
      RESEARCH_RESULT_DIR: /results
      APP_ENV:           production
      E2E_SEED_INSTRUMENTS: ${E2E_SEED_INSTRUMENTS:-false}
      E2E_SEED_MARKET_DATA: ${E2E_SEED_MARKET_DATA:-false}
      TOKENIZED_ASSET_REFRESH_ENABLED: ${TOKENIZED_ASSET_REFRESH_ENABLED:-false}
      TOKENIZED_ASSET_REFRESH_MAX_ASSETS: ${TOKENIZED_ASSET_REFRESH_MAX_ASSETS:-100}
      TOKENIZED_EVENT_REFRESH_ENABLED: ${TOKENIZED_EVENT_REFRESH_ENABLED:-false}
      TOKENIZED_EVENT_REFRESH_MAX_PROVIDERS: ${TOKENIZED_EVENT_REFRESH_MAX_PROVIDERS:-2}
      TOKENIZED_EVENT_REFRESH_PAGE_SIZE: ${TOKENIZED_EVENT_REFRESH_PAGE_SIZE:-100}
      MARKET_DATA_REFRESH_SCHEDULE_ENABLED: ${MARKET_DATA_REFRESH_SCHEDULE_ENABLED:-false}
      MARKET_DATA_SHADOW_REPORT_ENABLED: ${MARKET_DATA_SHADOW_REPORT_ENABLED:-false}
      MARKET_EVENTS_REFRESH_ENABLED: ${MARKET_EVENTS_REFRESH_ENABLED:-false}
      MARKET_EVENTS_REFRESH_LOOKAHEAD_DAYS: ${MARKET_EVENTS_REFRESH_LOOKAHEAD_DAYS:-90}
      MARKET_EVENTS_REFRESH_MAX_PROVIDERS: ${MARKET_EVENTS_REFRESH_MAX_PROVIDERS:-8}
      MARKET_EVENTS_PRELISTING_ENABLED: ${MARKET_EVENTS_PRELISTING_ENABLED:-false}
      MARKET_EVENTS_PRELISTING_LOOKAHEAD_DAYS: ${MARKET_EVENTS_PRELISTING_LOOKAHEAD_DAYS:-90}
      MARKET_EVENTS_PRELISTING_MAX_EVENTS: ${MARKET_EVENTS_PRELISTING_MAX_EVENTS:-500}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_ENABLED: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_ENABLED:-false}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_LOOKBACK_DAYS: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_LOOKBACK_DAYS:-365}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_ISSUERS: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_ISSUERS:-50}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_EVENTS_PER_ISSUER: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_EVENTS_PER_ISSUER:-100}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ENABLED: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ENABLED:-false}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_ISSUERS: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_ISSUERS:-50}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_EVENTS_PER_ISSUER: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_EVENTS_PER_ISSUER:-100}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_SUBMISSIONS_REQUESTS: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_SUBMISSIONS_REQUESTS:-0}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE:-disabled}
      MARKET_UNIVERSE_RECONCILIATION_ENABLED: ${MARKET_UNIVERSE_RECONCILIATION_ENABLED:-false}
      MARKET_UNIVERSE_MISSING_CONFIRMATIONS: ${MARKET_UNIVERSE_MISSING_CONFIRMATIONS:-3}
      APP_HOST:          "0.0.0.0"
      APP_PORT:          "8000"
      # Secrets / deployment-specific — set these in a root-level .env file
      # (copy .env.example to .env and fill in your values)
      SECRET_KEY:              ${SECRET_KEY:-change-me-insecure-default-do-not-use-in-production}
      CORS_ORIGINS:            ${CORS_ORIGINS:-["http://localhost"]}
      ONESIGNAL_APP_ID:        ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY:  ${ONESIGNAL_REST_API_KEY:-}
      ALERT_POLL_INTERVAL:     ${ALERT_POLL_INTERVAL:-60}
      DEFAULT_MARKET_DATA_PROVIDER: ${DEFAULT_MARKET_DATA_PROVIDER:-alpaca}
      DEFAULT_METADATA_PROVIDER: ${DEFAULT_METADATA_PROVIDER:-edgar}
      DEFAULT_EVENT_PROVIDER: ${DEFAULT_EVENT_PROVIDER:-alpaca}
      DEFAULT_DISCOVERY_PROVIDER: ${DEFAULT_DISCOVERY_PROVIDER:-alpaca}
      DEFAULT_OPTIONS_PROVIDER: ${DEFAULT_OPTIONS_PROVIDER:-yfinance}
      IDENTIFIER_PROVIDER_PRIORITY: ${IDENTIFIER_PROVIDER_PRIORITY:-["openfigi"]}
      TOKENIZED_PROVIDER_PRIORITY: ${TOKENIZED_PROVIDER_PRIORITY:-["robinhood_tokens","xstocks","bybit_xstocks","gate_tradfi","kraken_xstocks","dinari","ondo_global_markets"]}
      PROVIDER_CHAIN_SEEDS:      ${PROVIDER_CHAIN_SEEDS:-{"price_history":["alpaca","alpha_vantage"],"latest_price":["alpaca","alpha_vantage"],"universe_discovery":["alpaca","edgar","massive","nasdaq","finra_otc_directory","alpha_vantage"],"instrument_events":["alpaca","edgar"],"instrument_metadata":["edgar"],"instrument_search":["edgar","massive","alpha_vantage"],"option_chain":["yfinance"],"tokenized_corporate_actions":["robinhood_tokens","xstocks","dinari"]}}
      OPTION_QUOTE_HISTORY_PROVIDER_PRIORITY: ${OPTION_QUOTE_HISTORY_PROVIDER_PRIORITY:-["yfinance"]}
      ALLOW_PAID_PROVIDER_ROUTING: ${ALLOW_PAID_PROVIDER_ROUTING:-false}
      OPENFIGI_API_KEY:        ${OPENFIGI_API_KEY:-}
      OPENFIGI_TIMEOUT_SECONDS: ${OPENFIGI_TIMEOUT_SECONDS:-10}
      ALPACA_API_KEY:           ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY:        ${ALPACA_SECRET_KEY:-}
      ALPACA_DATA_FEED:         ${ALPACA_DATA_FEED:-iex}
      ALPACA_TRADING_BASE_URL:  ${ALPACA_TRADING_BASE_URL:-https://paper-api.alpaca.markets/v2}
      ALPACA_CORPORATE_ACTIONS_MAX_PAGES: ${ALPACA_CORPORATE_ACTIONS_MAX_PAGES:-0}
      MASSIVE_API_KEY:          ${MASSIVE_API_KEY:-}
      ALPHA_VANTAGE_API_KEY:    ${ALPHA_VANTAGE_API_KEY:-}
      MARKETDATA_API_KEY:       ${MARKETDATA_API_KEY:-}
      FRED_API_KEY:             ${FRED_API_KEY:-}
      FRED_REVIEWED_LIMIT_SCOPE: ${FRED_REVIEWED_LIMIT_SCOPE:-}
      FRED_REVIEWED_REQUESTS_PER_MINUTE: ${FRED_REVIEWED_REQUESTS_PER_MINUTE:-0}
      FRED_SERIES_TERMS_REVIEWED: ${FRED_SERIES_TERMS_REVIEWED:-false}
      COINGECKO_API_KEY:        ${COINGECKO_API_KEY:-}
      EDGAR_USER_AGENT:         ${EDGAR_USER_AGENT:-}
      NASDAQ_USER_AGENT:        ${NASDAQ_USER_AGENT:-charting-platform market-data-universe}
      FINRA_CLIENT_ID:          ${FINRA_CLIENT_ID:-}
      FINRA_CLIENT_SECRET:      ${FINRA_CLIENT_SECRET:-}
      FINRA_TOKEN_URL:          ${FINRA_TOKEN_URL:-https://ews.fip.finra.org/fip/rest/ews/oauth2/access_token}
      FINRA_API_BASE_URL:       ${FINRA_API_BASE_URL:-https://api.finra.org}
      FINRA_SHORT_INTEREST_URL: ${FINRA_SHORT_INTEREST_URL:-}
      FINRA_OTC_DAILY_LIST_URL: ${FINRA_OTC_DAILY_LIST_URL:-}
      FINRA_OTC_SYMBOL_DIRECTORY_URL: ${FINRA_OTC_SYMBOL_DIRECTORY_URL:-}
      FINRA_OTC_OPERATION_COSTS: ${FINRA_OTC_OPERATION_COSTS:-{}}
      FINRA_OTC_TERMS_REVIEWED: ${FINRA_OTC_TERMS_REVIEWED:-false}
      FINRA_OTC_COMPLETENESS_REVIEWED: ${FINRA_OTC_COMPLETENESS_REVIEWED:-false}
      FINRA_OTC_REDISTRIBUTION_REVIEWED: ${FINRA_OTC_REDISTRIBUTION_REVIEWED:-false}
      FINRA_OTC_POLL_INTERVAL_SECONDS: ${FINRA_OTC_POLL_INTERVAL_SECONDS:-0}
      FINRA_ASYNC_MAX_RESULT_BYTES: ${FINRA_ASYNC_MAX_RESULT_BYTES:-0}
      TIINGO_API_KEY:           ${TIINGO_API_KEY:-}
      TIINGO_OPERATION_BYTE_BOUNDS: ${TIINGO_OPERATION_BYTE_BOUNDS:-{}}
      TWELVE_DATA_API_KEY:      ${TWELVE_DATA_API_KEY:-}
      FINNHUB_API_KEY:          ${FINNHUB_API_KEY:-}
      MARKETSTACK_API_KEY:      ${MARKETSTACK_API_KEY:-}
      MARKETSTACK_DISCOVERY_EXCHANGE: ${MARKETSTACK_DISCOVERY_EXCHANGE:-}
      EODHD_API_KEY:            ${EODHD_API_KEY:-}
      FMP_API_KEY:              ${FMP_API_KEY:-}
      FMP_OPERATION_BYTE_BOUNDS: ${FMP_OPERATION_BYTE_BOUNDS:-{}}
      TRADIER_API_KEY:          ${TRADIER_API_KEY:-}
      MARKETDATA_APP_API_KEY:   ${MARKETDATA_APP_API_KEY:-}
      MARKETDATA_APP_REVIEWED_PLAN: ${MARKETDATA_APP_REVIEWED_PLAN:-}
      MARKETDATA_APP_REVIEWED_DAILY_CREDIT_LIMIT: ${MARKETDATA_APP_REVIEWED_DAILY_CREDIT_LIMIT:-0}
      MARKETDATA_APP_OPTION_CHAIN_MAX_SYMBOLS: ${MARKETDATA_APP_OPTION_CHAIN_MAX_SYMBOLS:-0}
      XSTOCKS_API_KEY:           ${XSTOCKS_API_KEY:-}
      DINARI_API_KEY_ID:         ${DINARI_API_KEY_ID:-}
      DINARI_API_SECRET_KEY:     ${DINARI_API_SECRET_KEY:-}
      DINARI_API_BASE_URL:       ${DINARI_API_BASE_URL:-https://api-enterprise.sandbox.dinari.com/api/v2}
      ONDO_GLOBAL_MARKETS_API_KEY: ${ONDO_GLOBAL_MARKETS_API_KEY:-}
      IBKR_READ_ONLY_URL:       ${IBKR_READ_ONLY_URL:-}
      IBKR_READ_ONLY_SESSION_COOKIE: ${IBKR_READ_ONLY_SESSION_COOKIE:-}
      IBKR_READ_ONLY_VERIFY_TLS: ${IBKR_READ_ONLY_VERIFY_TLS:-true}
      IBKR_READ_ONLY_TIMEOUT_SECONDS: ${IBKR_READ_ONLY_TIMEOUT_SECONDS:-30}
      IBKR_CONID_MAP: ${IBKR_CONID_MAP:-{}}
      COINBASE_API_KEY:         ${COINBASE_API_KEY:-}
      KRAKEN_API_KEY:           ${KRAKEN_API_KEY:-}
      INSTRUMENT_SYNC_SCHEDULE_ENABLED: ${INSTRUMENT_SYNC_SCHEDULE_ENABLED:-false}
      INSTRUMENT_DISCOVERY_PAGE_DELAY_SECONDS: ${INSTRUMENT_DISCOVERY_PAGE_DELAY_SECONDS:-0.75}
      INSTRUMENT_METADATA_DELAY_SECONDS: ${INSTRUMENT_METADATA_DELAY_SECONDS:-1.0}
      INSTRUMENT_IDENTIFIER_DELAY_SECONDS: ${INSTRUMENT_IDENTIFIER_DELAY_SECONDS:-1.0}
      INSTRUMENT_DAILY_METADATA_CAP: ${INSTRUMENT_DAILY_METADATA_CAP:-750}
      INSTRUMENT_DAILY_IDENTIFIER_CAP: ${INSTRUMENT_DAILY_IDENTIFIER_CAP:-250}
      PROVIDER_MAX_CONCURRENCY: ${PROVIDER_MAX_CONCURRENCY:-2}
      PROVIDER_LIVE_USAGE_LEDGER: ${PROVIDER_LIVE_USAGE_LEDGER:-}
      PROVIDER_LIVE_USAGE_SCOPE: ${PROVIDER_LIVE_USAGE_SCOPE:-}
      PROVIDER_AVAILABILITY_MONITOR_ENABLED: ${PROVIDER_AVAILABILITY_MONITOR_ENABLED:-false}
      PROVIDER_AVAILABILITY_LIVE_ENABLED: ${PROVIDER_AVAILABILITY_LIVE_ENABLED:-false}
      PROVIDER_AVAILABILITY_NOTIFICATIONS_ENABLED: ${PROVIDER_AVAILABILITY_NOTIFICATIONS_ENABLED:-true}
      PROVIDER_AVAILABILITY_NOTIFICATION_COOLDOWN_SECONDS: ${PROVIDER_AVAILABILITY_NOTIFICATION_COOLDOWN_SECONDS:-86400}
      PROVIDER_AVAILABILITY_PROBE_TIMEOUT_SECONDS: ${PROVIDER_AVAILABILITY_PROBE_TIMEOUT_SECONDS:-20}
      PROVIDER_REQUEST_LOG_RETENTION_DAYS: ${PROVIDER_REQUEST_LOG_RETENTION_DAYS:-30}
      UNIVERSE_DISCOVERY_SNAPSHOT_RETENTION_DAYS: ${UNIVERSE_DISCOVERY_SNAPSHOT_RETENTION_DAYS:-30}
      PROVIDER_SUPPORT_SUPPORTED_TTL_SECONDS: ${PROVIDER_SUPPORT_SUPPORTED_TTL_SECONDS:-2592000}
      PROVIDER_SUPPORT_UNSUPPORTED_TTL_SECONDS: ${PROVIDER_SUPPORT_UNSUPPORTED_TTL_SECONDS:-604800}
      PROXY_FILE:              proxies.txt
      PROXY_ENABLED:           "false"
      LOG_LEVEL:               ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [charting]
    volumes:
      - ./backend/proxies.txt:/app/proxies.txt:ro
      # Keep repository acceptance references available to manifest tests run
      # inside the branch-scoped backend container.
      - ./tests:/tests:ro
      - ./docs:/docs:ro
      - ./frontend:/frontend:ro
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/docker-compose.dev.yml:ro
      - ./ops:/ops:ro
      - research_jobs:/jobs
      - research_results:/results

  # ── ARQ worker (background tasks) ──────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    command: python -m app.workers.arq_worker
    environment:
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      REDIS_URL:         redis://redis:6379/0
      OHLCV_DISTRIBUTED_LOCK_ENABLED: ${OHLCV_DISTRIBUTED_LOCK_ENABLED:-false}
      OHLCV_DISTRIBUTED_LOCK_TTL_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_TTL_SECONDS:-900}
      OHLCV_DISTRIBUTED_LOCK_WAIT_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_WAIT_SECONDS:-30}
      OHLCV_DISTRIBUTED_LOCK_RETRY_SECONDS: ${OHLCV_DISTRIBUTED_LOCK_RETRY_SECONDS:-0.25}
      APP_ENV:           production
      E2E_SEED_INSTRUMENTS: ${E2E_SEED_INSTRUMENTS:-false}
      E2E_SEED_MARKET_DATA: ${E2E_SEED_MARKET_DATA:-false}
      TOKENIZED_ASSET_REFRESH_ENABLED: ${TOKENIZED_ASSET_REFRESH_ENABLED:-false}
      TOKENIZED_ASSET_REFRESH_MAX_ASSETS: ${TOKENIZED_ASSET_REFRESH_MAX_ASSETS:-100}
      TOKENIZED_EVENT_REFRESH_ENABLED: ${TOKENIZED_EVENT_REFRESH_ENABLED:-false}
      TOKENIZED_EVENT_REFRESH_MAX_PROVIDERS: ${TOKENIZED_EVENT_REFRESH_MAX_PROVIDERS:-2}
      TOKENIZED_EVENT_REFRESH_PAGE_SIZE: ${TOKENIZED_EVENT_REFRESH_PAGE_SIZE:-100}
      MARKET_DATA_REFRESH_SCHEDULE_ENABLED: ${MARKET_DATA_REFRESH_SCHEDULE_ENABLED:-false}
      MARKET_DATA_SHADOW_REPORT_ENABLED: ${MARKET_DATA_SHADOW_REPORT_ENABLED:-false}
      MARKET_EVENTS_REFRESH_ENABLED: ${MARKET_EVENTS_REFRESH_ENABLED:-false}
      MARKET_EVENTS_REFRESH_LOOKAHEAD_DAYS: ${MARKET_EVENTS_REFRESH_LOOKAHEAD_DAYS:-90}
      MARKET_EVENTS_REFRESH_MAX_PROVIDERS: ${MARKET_EVENTS_REFRESH_MAX_PROVIDERS:-8}
      MARKET_EVENTS_PRELISTING_ENABLED: ${MARKET_EVENTS_PRELISTING_ENABLED:-false}
      MARKET_EVENTS_PRELISTING_LOOKAHEAD_DAYS: ${MARKET_EVENTS_PRELISTING_LOOKAHEAD_DAYS:-90}
      MARKET_EVENTS_PRELISTING_MAX_EVENTS: ${MARKET_EVENTS_PRELISTING_MAX_EVENTS:-500}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_ENABLED: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_ENABLED:-false}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_LOOKBACK_DAYS: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_LOOKBACK_DAYS:-365}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_ISSUERS: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_ISSUERS:-50}
      MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_EVENTS_PER_ISSUER: ${MARKET_EVENTS_EDGAR_UNIVERSE_SCAN_MAX_EVENTS_PER_ISSUER:-100}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ENABLED: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ENABLED:-false}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_ISSUERS: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_ISSUERS:-50}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_EVENTS_PER_ISSUER: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_EVENTS_PER_ISSUER:-100}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_SUBMISSIONS_REQUESTS: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_MAX_SUBMISSIONS_REQUESTS:-0}
      MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE: ${MARKET_EVENTS_EDGAR_DIRECTORY_SCAN_ISSUER_MATERIALIZATION_MODE:-disabled}
      MARKET_UNIVERSE_RECONCILIATION_ENABLED: ${MARKET_UNIVERSE_RECONCILIATION_ENABLED:-false}
      MARKET_UNIVERSE_MISSING_CONFIRMATIONS: ${MARKET_UNIVERSE_MISSING_CONFIRMATIONS:-3}
      # Provider-backed hydration is opt-in. The API still materialises the
      # canonical identity/taxonomy synchronously; a cold sweep must never
      # starve the workstation API during login or factory reset.
      CORE_WORKSTATION_BOOTSTRAP_ENABLED: ${CORE_WORKSTATION_BOOTSTRAP_ENABLED:-false}
      CORE_WORKSTATION_BOOTSTRAP_TIMEOUT_SECONDS: ${CORE_WORKSTATION_BOOTSTRAP_TIMEOUT_SECONDS:-45}
      CORE_WORKSTATION_BOOTSTRAP_LOOKBACK_DAYS: ${CORE_WORKSTATION_BOOTSTRAP_LOOKBACK_DAYS:-730}
      ETF_HOLDINGS_CLASSIFICATION_REFRESH_ENABLED: ${ETF_HOLDINGS_CLASSIFICATION_REFRESH_ENABLED:-false}
      ETF_HOLDINGS_CLASSIFICATION_MAX_PROFILES: ${ETF_HOLDINGS_CLASSIFICATION_MAX_PROFILES:-50}
      ETF_HOLDINGS_CLASSIFICATION_MAX_ENRICHMENTS_PER_PROFILE: ${ETF_HOLDINGS_CLASSIFICATION_MAX_ENRICHMENTS_PER_PROFILE:-32}
      BENCHMARK_FAMILY_HOLDINGS_REFRESH_ENABLED: ${BENCHMARK_FAMILY_HOLDINGS_REFRESH_ENABLED:-false}
      BENCHMARK_FAMILY_HOLDINGS_REFRESH_LOOKBACK_DATES: ${BENCHMARK_FAMILY_HOLDINGS_REFRESH_LOOKBACK_DATES:-1}
      SECRET_KEY:              ${SECRET_KEY:-change-me-insecure-default-do-not-use-in-production}
      ONESIGNAL_APP_ID:        ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY:  ${ONESIGNAL_REST_API_KEY:-}
      ALERT_POLL_INTERVAL:     ${ALERT_POLL_INTERVAL:-60}
      DEFAULT_MARKET_DATA_PROVIDER: ${DEFAULT_MARKET_DATA_PROVIDER:-alpaca}
      DEFAULT_METADATA_PROVIDER: ${DEFAULT_METADATA_PROVIDER:-edgar}
      DEFAULT_EVENT_PROVIDER: ${DEFAULT_EVENT_PROVIDER:-alpaca}
      DEFAULT_DISCOVERY_PROVIDER: ${DEFAULT_DISCOVERY_PROVIDER:-alpaca}
      DEFAULT_OPTIONS_PROVIDER: ${DEFAULT_OPTIONS_PROVIDER:-yfinance}
