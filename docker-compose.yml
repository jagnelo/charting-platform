# The full application stack is expected to run with an explicit
# COMPOSE_PROJECT_NAME. Makefile targets and local docs route this through
# `./scripts/dev-stack.sh project-name stack` so each git branch gets its own
# containers, networks, and volumes.

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  postgres_data:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    # To bind-mount to a specific NAS path instead, replace with:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /volume1/docker/charting/pgdata   # Synology example
    #   device: /mnt/pool/charting/pgdata         # TrueNAS example
  redis_data:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  research_jobs:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  research_results:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  strategy_lab_artifacts:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  strategy_lab_v2_preparation_socket:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}

networks:
  charting:
    driver: bridge
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
  strategy_lab_v2_internal:
    driver: bridge
    internal: true
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-chartingdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"   # expose for pgAdmin / direct access — remove in production
    networks: [charting, strategy_lab_v2_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (ARQ task queue) ──────────────────────────────────────────────────
  redis:
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks: [charting]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      # Infrastructure — always Docker-internal hostnames in this context
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      STRATEGY_LAB_V2_MIGRATIONS_ENABLED: ${STRATEGY_LAB_V2_MIGRATIONS_ENABLED:-true}
      STRATEGY_LAB_V2_MIGRATION_TARGET: ${STRATEGY_LAB_V2_MIGRATION_TARGET:-head}
      STRATEGY_LAB_V2_API_BINDINGS: ${STRATEGY_LAB_V2_API_BINDINGS:-}
      STRATEGY_LAB_V2_ARTIFACT_ROOT: /strategy-lab-artifacts
      STRATEGY_LAB_V2_WALK_FORWARD_CALENDAR_FACTORY: ${STRATEGY_LAB_V2_WALK_FORWARD_CALENDAR_FACTORY:-}
      STRATEGY_LAB_V2_PREPARATION_SOCKET_PATH: ${STRATEGY_LAB_V2_PREPARATION_SOCKET_PATH:-/run/strategy-lab-v2/preparation.sock}
      STRATEGY_LAB_V2_PREPARATION_AUTH_TOKEN: ${STRATEGY_LAB_V2_PREPARATION_AUTH_TOKEN:-}
      STRATEGY_LAB_V2_BACKTEST_CAPABILITY_SCOPE: ${STRATEGY_LAB_V2_BACKTEST_CAPABILITY_SCOPE:-}
      STRATEGY_LAB_V2_NAUTILUS_RC_EVIDENCE_DIRECTORY: /nautilus-rc-evidence
