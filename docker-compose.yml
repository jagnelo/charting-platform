  # ── Strategy Lab v2 execution worker (explicit opt-in) ────────────────────
  # This process is intentionally separate from the general ARQ worker. It
  # requires an application-owned callback factory and the local Docker daemon
  # because sandbox plans launch separately pinned, network-disabled runtime
  # containers. It is never started by the default stack profile.
  strategy-lab-v2-worker:
    profiles: ["strategy-lab-v2"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    command: python -m app.strategy_lab_v2.worker_entrypoint
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    environment:
      # The entrypoint's AsyncSessionLocal is created from app.config.DATABASE_URL;
      # keep it on the same in-network database as the namespaced migration URL.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      STRATEGY_LAB_V2_DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      STRATEGY_LAB_V2_REDIS_URL: redis://redis:6379/0
      STRATEGY_LAB_V2_ARTIFACT_ROOT: /strategy-lab-artifacts
      STRATEGY_LAB_V2_CALLBACK_FACTORY: ${STRATEGY_LAB_V2_CALLBACK_FACTORY:-app.strategy_lab_v2.worker_callbacks:create}
      # The package-owned mapper is safe for the canonical single
      # /outputs/result contract. Hosts with multi-artifact manifests must
      # override this with an explicit resolver that maps every artifact.
      STRATEGY_LAB_V2_EVIDENCE_RESOLVER: ${STRATEGY_LAB_V2_EVIDENCE_RESOLVER:-app.strategy_lab_v2.worker_callbacks:default_evidence_resolver_factory}
      STRATEGY_LAB_V2_MIGRATIONS_ENABLED: ${STRATEGY_LAB_V2_MIGRATIONS_ENABLED:-true}
      STRATEGY_LAB_V2_MIGRATION_TARGET: ${STRATEGY_LAB_V2_MIGRATION_TARGET:-head}
      STRATEGY_LAB_V2_QUEUE: ${STRATEGY_LAB_V2_QUEUE:-backtest}
      STRATEGY_LAB_V2_GROUP: ${STRATEGY_LAB_V2_GROUP:-strategy-lab-v2}
      # Required when the search-dispatch callback factory is selected; recovery
      # schedules retries through the same local authenticated preparation API.
      STRATEGY_LAB_V2_PREPARATION_SOCKET_PATH: ${STRATEGY_LAB_V2_PREPARATION_SOCKET_PATH:-/run/strategy-lab-v2/preparation.sock}
      STRATEGY_LAB_V2_PREPARATION_AUTH_TOKEN: ${STRATEGY_LAB_V2_PREPARATION_AUTH_TOKEN:-}
      STRATEGY_LAB_V2_PROCESS_TIMEOUT_SECONDS: ${STRATEGY_LAB_V2_PROCESS_TIMEOUT_SECONDS:-300}
      STRATEGY_LAB_V2_DOCKER_BINARY: ${STRATEGY_LAB_V2_DOCKER_BINARY:-docker}
    volumes:
      - strategy_lab_artifacts:/strategy-lab-artifacts
      - strategy_lab_v2_preparation_socket:/run/strategy-lab-v2
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [charting]

  # ── Strategy Lab v2 forward-event worker (explicit opt-in) ────────────────
  # This service is intentionally separate from the backtest worker. It owns
  # only Redis forward-event polling and durable handoff; the host must provide
  # authenticated event/materializer and account/engine callbacks explicitly.
  strategy-lab-v2-forward-worker:
    profiles: ["strategy-lab-v2"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    command: python -m app.strategy_lab_v2.forward_worker_entrypoint
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    environment:
      # Forward persistence also uses app.database.AsyncSessionLocal.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      STRATEGY_LAB_V2_FORWARD_DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      STRATEGY_LAB_V2_FORWARD_REDIS_URL: redis://redis:6379/0
      STRATEGY_LAB_V2_FORWARD_CALLBACK_FACTORY: ${STRATEGY_LAB_V2_FORWARD_CALLBACK_FACTORY:-}
      STRATEGY_LAB_V2_FORWARD_WORKER_ID: ${STRATEGY_LAB_V2_FORWARD_WORKER_ID:-}
      STRATEGY_LAB_V2_FORWARD_RUNTIME_PROFILE_FINGERPRINT: ${STRATEGY_LAB_V2_FORWARD_RUNTIME_PROFILE_FINGERPRINT:-}
      STRATEGY_LAB_V2_FORWARD_MIGRATIONS_ENABLED: ${STRATEGY_LAB_V2_FORWARD_MIGRATIONS_ENABLED:-true}
      STRATEGY_LAB_V2_FORWARD_MIGRATION_TARGET: ${STRATEGY_LAB_V2_FORWARD_MIGRATION_TARGET:-head}
      STRATEGY_LAB_V2_FORWARD_QUEUE: ${STRATEGY_LAB_V2_FORWARD_QUEUE:-forward-events}
      STRATEGY_LAB_V2_FORWARD_GROUP: ${STRATEGY_LAB_V2_FORWARD_GROUP:-strategy-lab-v2-forward}
      STRATEGY_LAB_V2_FORWARD_INTERVAL_SECONDS: ${STRATEGY_LAB_V2_FORWARD_INTERVAL_SECONDS:-1.0}
      STRATEGY_LAB_V2_FORWARD_RECLAIM_IDLE_MS: ${STRATEGY_LAB_V2_FORWARD_RECLAIM_IDLE_MS:-30000}
      STRATEGY_LAB_V2_FORWARD_BATCH_SIZE: ${STRATEGY_LAB_V2_FORWARD_BATCH_SIZE:-1}
      STRATEGY_LAB_V2_FORWARD_BLOCK_MS: ${STRATEGY_LAB_V2_FORWARD_BLOCK_MS:-0}
    volumes:
      - strategy_lab_artifacts:/strategy-lab-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [charting]

  # User code never runs in FastAPI or the general worker. This service has no
  # network, no provider credentials, a read-only root filesystem, dropped Linux
  # capabilities, and only the constrained job/result volume.
  research-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.research-runner
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    network_mode: "none"
    read_only: true
    # Keep native-library and accidental allocation pressure bounded at the
    # container boundary as well as through the runner's per-job rlimits.
    mem_limit: ${RESEARCH_CONTAINER_MEMORY_LIMIT:-768m}
    cpus: "${RESEARCH_CONTAINER_CPUS:-1.0}"
    pids_limit: ${RESEARCH_CONTAINER_PIDS_LIMIT:-128}
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
      - "seccomp:./backend/seccomp/research-runner.json"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      RESEARCH_JOB_DIR: /jobs
      RESEARCH_RESULT_DIR: /results
      RESEARCH_MAX_SECONDS: ${RESEARCH_MAX_SECONDS:-15}
      RESEARCH_MAX_MEMORY_BYTES: ${RESEARCH_MAX_MEMORY_BYTES:-536870912}
      RESEARCH_MAX_OUTPUT_BYTES: ${RESEARCH_MAX_OUTPUT_BYTES:-8388608}
      RESEARCH_MAX_OUTPUT_ROWS: ${RESEARCH_MAX_OUTPUT_ROWS:-10000}
      RESEARCH_MAX_OUTPUT_ARTIFACTS: ${RESEARCH_MAX_OUTPUT_ARTIFACTS:-128}
      RESEARCH_MAX_JOB_BYTES: ${RESEARCH_MAX_JOB_BYTES:-67108864}
    volumes:
      - research_jobs:/jobs
      - research_results:/results

  # ── Vue frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on: [backend]
    networks: [charting]
