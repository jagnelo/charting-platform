  # User code never runs in FastAPI or the general worker. This service has no
  # network, no provider credentials, a read-only root filesystem, dropped Linux
  # capabilities, and only the constrained job/result volume.
  research-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.research-runner
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    network_mode: "none"
    read_only: true
    # Keep native-library and accidental allocation pressure bounded at the
    # container boundary as well as through the runner's per-job rlimits.
    mem_limit: ${RESEARCH_CONTAINER_MEMORY_LIMIT:-768m}
    cpus: "${RESEARCH_CONTAINER_CPUS:-1.0}"
    pids_limit: ${RESEARCH_CONTAINER_PIDS_LIMIT:-128}
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
      - "seccomp:./backend/seccomp/research-runner.json"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      RESEARCH_JOB_DIR: /jobs
      RESEARCH_RESULT_DIR: /results
      RESEARCH_MAX_SECONDS: ${RESEARCH_MAX_SECONDS:-15}
      RESEARCH_MAX_MEMORY_BYTES: ${RESEARCH_MAX_MEMORY_BYTES:-536870912}
      RESEARCH_MAX_OUTPUT_BYTES: ${RESEARCH_MAX_OUTPUT_BYTES:-8388608}
      RESEARCH_MAX_OUTPUT_ROWS: ${RESEARCH_MAX_OUTPUT_ROWS:-10000}
      RESEARCH_MAX_OUTPUT_ARTIFACTS: ${RESEARCH_MAX_OUTPUT_ARTIFACTS:-128}
      RESEARCH_MAX_JOB_BYTES: ${RESEARCH_MAX_JOB_BYTES:-67108864}
    volumes:
      - research_jobs:/jobs
      - research_results:/results

  # ── Vue frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on: [backend]
    networks: [charting]
