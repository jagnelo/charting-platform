  # Search preparation hydrates owner-scoped PostgreSQL state and materializes
  # frozen runtime inputs outside the public FastAPI event loop. It is opt-in,
  # serial, and intentionally has neither the Docker socket nor provider keys.
  strategy-lab-v2-preparation:
    profiles: ["strategy-lab-v2"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels:
        charting.worktree.id: ${WORKTREE_ID:-unscoped}
    labels:
      charting.worktree.id: ${WORKTREE_ID:-unscoped}
    restart: unless-stopped
    command: python -m app.strategy_lab_v2.search_preparation_service
    read_only: true
    mem_limit: ${STRATEGY_LAB_V2_PREPARATION_MEMORY_LIMIT:-2g}
    cpus: "${STRATEGY_LAB_V2_PREPARATION_CPUS:-2.0}"
    pids_limit: ${STRATEGY_LAB_V2_PREPARATION_PIDS_LIMIT:-128}
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chartingdb}
      STRATEGY_LAB_V2_ARTIFACT_ROOT: /strategy-lab-artifacts
      STRATEGY_LAB_V2_PREPARATION_SOCKET_PATH: ${STRATEGY_LAB_V2_PREPARATION_SOCKET_PATH:-/run/strategy-lab-v2/preparation.sock}
      STRATEGY_LAB_V2_PREPARATION_AUTH_TOKEN: ${STRATEGY_LAB_V2_PREPARATION_AUTH_TOKEN:-}
      STRATEGY_LAB_V2_PREPARATION_BINDINGS_FACTORY: ${STRATEGY_LAB_V2_PREPARATION_BINDINGS_FACTORY:-}
      STRATEGY_LAB_V2_NAUTILUS_RC_EVIDENCE_DIRECTORY: /nautilus-rc-evidence
      STRATEGY_LAB_V2_NAUTILUS_RC_EVIDENCE_ARTIFACT_SHA256: ${STRATEGY_LAB_V2_NAUTILUS_RC_EVIDENCE_ARTIFACT_SHA256:-}
      STRATEGY_LAB_V2_NAUTILUS_RC_SOURCE_SHA256: ${STRATEGY_LAB_V2_NAUTILUS_RC_SOURCE_SHA256:-}
      STRATEGY_LAB_V2_NAUTILUS_RC_IMAGE_SHA256: ${STRATEGY_LAB_V2_NAUTILUS_RC_IMAGE_SHA256:-}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - strategy_lab_artifacts:/strategy-lab-artifacts
      - strategy_lab_v2_preparation_socket:/run/strategy-lab-v2
      - type: bind
        source: ${STRATEGY_LAB_V2_NAUTILUS_RC_EVIDENCE_HOST_DIRECTORY:-./.ai/runtime/strategy-lab-v2/nautilus-rc-evidence}
        target: /nautilus-rc-evidence
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [strategy_lab_v2_internal]

  # ── ARQ worker (background tasks) ──────────────────────────────────────────
  worker:
