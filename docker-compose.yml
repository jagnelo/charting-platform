      STRATEGY_LAB_V2_NAUTILUS_RC_SOURCE_SHA256: ${STRATEGY_LAB_V2_NAUTILUS_RC_SOURCE_SHA256:-}
      STRATEGY_LAB_V2_NAUTILUS_RC_IMAGE_SHA256: ${STRATEGY_LAB_V2_NAUTILUS_RC_IMAGE_SHA256:-}
      STRATEGY_LAB_V2_FORWARD_WORKER_ID: ${STRATEGY_LAB_V2_FORWARD_WORKER_ID:-}
