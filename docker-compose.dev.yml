# Development Docker Compose
#
# Runs ONLY the infrastructure (Postgres + Redis).
# The backend and frontend run directly on your machine with hot-reload.
# The Makefile/dev scripts inject a branch-scoped COMPOSE_PROJECT_NAME so each
# git branch keeps its own persisted Postgres and Redis volumes.
#
# Usage:
#   COMPOSE_PROJECT_NAME=$(./scripts/dev-stack.sh project-name dev) docker compose -f docker-compose.dev.yml up -d
#   (then in separate terminals: see Makefile dev targets or dev.sh)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chartingdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
  redis_dev_data:
