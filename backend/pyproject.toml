[project]
name = "charting-platform-backend"
version = "0.1.0"
description = "Personal trading chart platform — backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework — pinned: breaking changes in minor versions
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    # Database — pinned: breaking changes in minor versions
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    # Auth — pinned: security-sensitive, audit before upgrading
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    # Validation — pinned: breaking changes in minor versions
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    # Task queue
    "arq>=0.26",
    "redis>=5.0",
    # Scheduling
    "apscheduler>=3.10",
    "croniter>=2.0",
    # Market data
    "yfinance>=0.2.54",
    "nautilus-trader==1.226.0",
    # Data processing
    "pandas>=2.2",
    "xlrd>=2.0.1",
    "numpy>=1.26",
    # HTTP client
    "httpx>=0.27",
    # Config / utilities
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
    "greenlet>=3.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "testcontainers[postgres,redis]==4.7.2",
    "factory-boy==3.3.0",
    "freezegun==1.5.1",
    # Dev tools
    "ruff==0.4.7",
    "mypy==1.10.0",
    "watchfiles>=0.22",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "testcontainers[postgres,redis]==4.7.2",
    "factory-boy==3.3.0",
    "freezegun==1.5.1",
    "ruff==0.4.7",
    "mypy==1.10.0",
    "watchfiles>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationship() forward references are not resolvable by ruff
"app/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
