[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    # Coverage is opt-in in repository test targets and CI. Keeping it out of
    # pytest's implicit defaults prevents focused provider runs from entering
    # the coverage plugin's non-terminating report teardown path.
    -v
    --tb=short
markers =
    unit: Pure unit tests (no I/O)
    integration: Integration tests (requires Postgres + Redis containers)
    live: Live external-provider tests (requires network and may fail when providers change)
    slow: Tests that take >5s
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:jose\.jwt
    ignore:Timestamp.utcnow is deprecated and will be removed in a future version.*:Warning
    ignore:coroutine 'Connection\._cancel' was never awaited:RuntimeWarning
